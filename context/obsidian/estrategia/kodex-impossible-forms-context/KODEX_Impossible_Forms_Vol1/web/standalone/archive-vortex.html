<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Archive Vortex — KODEX</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020305;color:#f5f2ea;font-family:monospace}video{width:100%;height:100%;object-fit:cover;display:block}.hud{position:fixed;inset:14px;border:1px solid #30343a;pointer-events:none}header{position:fixed;top:14px;left:14px;right:14px;min-height:60px;padding:13px;border-bottom:1px solid #30343a;display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:.12em;text-transform:uppercase}strong{font-size:16px;color:#FF1744}.controls{position:fixed;bottom:28px;left:28px;right:28px;display:grid;grid-template-columns:1fr auto auto;gap:8px}label,button{min-height:44px;border:1px solid #30343a;background:rgba(4,5,7,.82);color:#f5f2ea;padding:0 12px;font:10px monospace;letter-spacing:.1em}label{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}input{width:100%;accent-color:#FF1744}@media(max-width:650px){.controls{grid-template-columns:1fr;left:18px;right:18px}}</style></head>
<body><video autoplay muted loop playsinline src="../../preview/mp4/archive-vortex.mp4"></video><div class="hud"></div><header><strong>Archive Vortex</strong><span>KODEX−∞ / ORIGINAL PROCEDURAL FORM</span></header>
<section class="controls"><label>SPEED <input id="speed" type="range" min=".25" max="2" value="1" step=".05"><output>1.00</output></label><button id="pause">PAUSE</button><button id="full">FULLSCREEN</button></section>
<script>const v=document.querySelector("video");speed.oninput=()=>{v.playbackRate=+speed.value;speed.parentElement.querySelector("output").value=(+speed.value).toFixed(2)};let p=false;pause.onclick=e=>{p=!p;p?v.pause():v.play();e.target.textContent=p?"RESUME":"PAUSE"};full.onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();</script></body></html>
