<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KODEX Sigil Type</title><link rel="stylesheet" href="../03_SIGIL_ENGINE/styles/kdx-type-system.css"><style>body{margin:0;background:#050507;color:#e8e4dc;font-family:ui-monospace,monospace;padding:32px}.row{padding:32px 0;border-bottom:1px solid #242630}.sig{max-width:1000px}.controls{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px}input,select{background:#0b0c10;color:#eee;border:1px solid #343844;padding:10px;font:inherit}</style></head><body><h1>KODEX MODULAR SIGIL TYPE SYSTEM</h1><div class="controls"><input id="text" value="KODEX-∞"><select id="style"><option>ritual</option><option>block</option><option>signal</option><option>outline</option></select></div><div id="live" class="sig"></div><div class="row" data-kdx-sigil="ARCHIVE MEMORY" data-style="ritual"></div><div class="row" data-kdx-sigil="SIGNAL DETECTED" data-style="signal" data-color="#78e8ff"></div><div class="row" data-kdx-sigil="FIELD NOTE 03" data-style="outline" data-color="#b18cff"></div><script type="module">import{renderSigilText,mountSigilText}from'../03_SIGIL_ENGINE/scripts/kdx-sigil-renderer.js';const t=document.querySelector('#text'),s=document.querySelector('#style'),l=document.querySelector('#live');function r(){l.innerHTML=renderSigilText(t.value,{style:s.value,cell:12,color:'#d8caa0'})}t.oninput=s.onchange=r;r();mountSigilText();</script></body></html>
