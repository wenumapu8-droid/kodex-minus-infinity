name: KODEX Core Reference

on:
  pull_request:
    paths:
      - 'packages/core-reference/**'
      - '.github/workflows/core-reference.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/core-reference/**'
      - '.github/workflows/core-reference.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run core-reference tests
        working-directory: packages/core-reference
        run: npm test

      - name: Run Genesis example
        working-directory: packages/core-reference
        run: npm run example
