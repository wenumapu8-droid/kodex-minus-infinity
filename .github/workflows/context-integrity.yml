name: KODEX Context Integrity

on:
  pull_request:
    paths:
      - '**/*.md'
      - '**/*.json'
      - '**/*.yaml'
      - '**/*.yml'
      - 'scripts/**'
      - 'tests/**'
  push:
    branches:
      - main
    paths:
      - '**/*.md'
      - '**/*.json'
      - '**/*.yaml'
      - '**/*.yml'
      - 'scripts/**'
      - 'tests/**'

permissions:
  contents: read

jobs:
  validate-context:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Python tools
        run: python -m py_compile scripts/*.py tests/*.py

      - name: Run Python tool tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate canonical context
        run: python scripts/validate_context.py
