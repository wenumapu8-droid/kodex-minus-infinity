rules:
  - Check this registry before creating a new engine or package.
  - ARCHIVE_VERIFIED means ZIP bytes, checksum and central-directory contents were inspected; it does not mean runtime validation or rights clearance.
  - Do not claim production integration without repository evidence.
  - Every migrated artifact requires provenance, checksum, rights and destination.
  - context/ERRATA.md overrides older summaries when direct byte inspection produced a correction.
