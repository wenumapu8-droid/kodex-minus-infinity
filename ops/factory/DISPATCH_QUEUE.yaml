  target: "complete KOD-18 through visible internal assembly, frontier visual convergence and release review"
  transport: "GitHub + Linear; chat is bootstrap/fallback only"
  cycle: "observe evidence -> functional gate -> visible preview -> frontier visual audit -> delta packet -> bounded implementation -> QA -> creator acceptance -> repeat"
  lane_blocking: "a blocker pauses only its dependent lane; independent lanes continue"
  stop_conditions:
    - "creator/canonical decision required"
    - "cultural or rights authorization required"
    - "missing provenance/source contract"
    - "worker capacity/quota unavailable"
    - "CI/test failure requiring rework"
    - "file ownership collision"
    - "release gate reached"
