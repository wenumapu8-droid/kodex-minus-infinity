rules:
  - "Connected is not Running. Execution requires fresh heartbeat, commit, test, PR or packet-specific evidence."
  - "Each station executes only its current_packet and referenced packet manifest."
  - "After handoff, re-read this queue before taking new work; never self-assign a next packet."
  - "Keep WIP finite and do not overlap file ownership across active write packets."
  - "Do not edit main directly."
  - "Do not merge unless the packet/reviewer gate explicitly authorizes merge."
  - "Deployment remains blocked without the exact creator phrase APROBAR DEPLOY."
  - "Do not expose secrets, private paths, raw conversations or chain-of-thought in queue/heartbeat/handoff."
  - "PRODUCT-FIRST: visible product, QA and creator-facing convergence outrank new control-plane expansion."
  - "FRONTIER VISUAL RULE: build/functional PASS does not equal visual PASS. Fast/volume workers cannot declare canonical visual acceptance."
  - "CREDENTIAL RULE: a station without valid model authentication is PAUSED, not RUNNING; its work is rerouted without discarding prior evidence."
  - "FRONTIER CAPACITY RULE: Claude Pro remains READY/IDLE unless ambiguity, difficult integration, second-pass visual review or connection/MCP work justifies scarce context use."
  - "VISUAL SCAFFOLD RULE: track VISUAL_IMPACT and NATIVE_IMPLEMENTATION separately; scaffold is a convergence aid, never a final static substitute for the living scene."

