      - "The shipped SVG orbital construction of CosmologyMap.astro — radial core gradient, dashed shell circles, nodes on radii — as a structural precedent for an accessible no-WebGL figure."
      - "Instrument chrome, shell grid, chips, rails and the always-rendered DOM fallback of OBSERVE V2, reused as layout."
    mustNotCopy:
      - "Historical religious/manuscript depictions of the soul or afterlife without heavy transformation"
      - "No external reference image, video or artwork reached this worker, so nothing external may be reproduced. Anything in the implementation that resembles a specific external work is an invention introduced downstream and must be rejected at visual review."
      - "The privately supplied video reference behind design/KODEX_VOICE_AND_SCENE_MESSAGE_SYSTEM.md must not be copied, sought out, reconstructed or approximated. The document's own rule governs: 'The reference itself is not redistributed. KODEX must not copy its wording, imagery or identity.' Only the abstract quality 'convergence into a sphere' is carried forward, realised through this passport's own geometry."
      - "No Mapuche cosmological structure of any kind: no Meli Witran Mapu quadripartite cardinal division, no kultrun drum-head figure, no rewe, no wenu leufu / Milky Way river motif, no antu / kuyen sun-moon pairing, no We Tripantu solstice framing, and no Mapudungun term anywhere in the scene."
      - "No link, quotation, citation or visual echo of any documented-register volume. Under R1 this scene is fiction-register and the two registers never mix."
      - "No reproduction or approximation of WenuSigil.astro: no 4-fold rotational pinwheel, no 8-point compass star at the centre, no four cardinal daggers, no crescent-claw arms."
      - "No tree-of-life diagram in any tradition: no Kabbalistic sephirot arrangement or its 22 connecting paths, no Yggdrasil or Norse world tree, no Bodhi tree, no axis mundi. SOURCE SPHERE contains no trunk, no roots, no canopy and no vertical world-axis. Its tree is a rooted graph, never a tree silhouette."
      - "No mandala construction geometry: no nested squares-in-circles, no gated four-portal enclosure, no radially repeated petal register."
      - "No manuscript pastiche: no faux vellum or parchment texture, no aged-paper grain, no illuminated-manuscript border, no invented glyph system presented as a script, and no rendering of Devanagari, Arabic, Kana, Han, Hangul, Cyrillic or Greek characters as ornament."
      - "No reproduction of any plate from book-ocin-arte-digital-ritual, and no GPU treatment applied to Ocin's finished work in any form. The manifest rule is absolute: 'Se aplica SOLO a fotos/derivados, NUNCA a la obra terminada de Ocin.'"
      - "No eye at the centre of the sphere. The core belongs to cosmology-core; __core-eye and __core-pupil belong to observation-eye and to FIELD OF EYES, and importing them here would both blur the organism boundary and produce an all-seeing-eye-in-a-sphere emblem this scene does not intend."
    culturalSensitivity:
      - "RESOLVED BY RULING R1 — REGISTER IS FICTION. SOURCE SPHERE sits in the marked-fiction register with the neon palette and must carry a persistent visible register marker. It may not be presented in the documented register under any circumstance. Local evidence independently corroborates the ruling: the anchor volume lore-1-la-fuente is registro ficcion / paleta neon and self-marks 'not history, not science, not health'."
      - "RESOLVED BY RULING R1 — ICONOGRAPHY FROM LIVING TRADITIONS. Any such iconography is handled as a GLYPH: named as a borrowing from the imaginary ('prestamo del imaginario') and never as that tradition's doctrine, and never as a claim about the origin of any species or any people. This is the position recorded in fic-razas-estelares-iconografia and SOURCE SPHERE inherits it rather than inventing its own. This scene requests no such admission and needs none, and R1 settles the FRAMING rather than licensing any specific depiction; mustNotCopy above still governs what may appear."
      - "SOURCE SPHERE must not link to, blend with, quote, cite or visually echo any documented-register volume, and above all not Mapuche material. Canon states it twice: 'Mapuche y Codex Estelar NUNCA se mezclan', and registro ficcion 'Nunca se mezcla con lo documentado ni con lo mapuche.'"
      - "THE NODE GRAPH NOW CONFIRMS THE MAPUCHE ADJACENCY WITH A MARKED EDGE, TWO HOPS FROM THIS SCENE. Of the 74 recovered authored edges, exactly two carry validity NEEDS_CULTURAL_REVIEW, and both are Mapuche-rooted: KDX-NODE-WE-TRIPANTU EXPANDS KDX-NODE-RETURN ('Ambos articulan renovación y continuidad cíclica') and KDX-NODE-WENU-MAPU CONTAINS KDX-NODE-ANIMAL-GUIDES ('Los animales se sitúan dentro de territorio y cosmología'). The first one matters directly here: this scene's canonical outgoing edge is SOURCE-CHAMBER RETURNS_THROUGH HEART-CHAMBER, and HEART-CHAMBER LEADS_TO ASTRAL-RETURN-GATE, so the route runs from this scene straight toward the return end — and KDX-NODE-RETURN is precisely the node a documented Mapuche volume EXPANDS under a cultural-review flag. Neither edge may be rendered, traversed, linked or referenced from SOURCE SPHERE, and no copy in this scene may use the words 'return of light', 'renewal', 'the beginning that comes back' or any translation of them. This is not a hypothetical adjacency any more; it is a marked edge in canon and it must be treated as a hard boundary until cultural review clears it."
      - "THE MAPUCHE BOUNDARY IS THE CENTRAL RISK OF THIS SCENE, and it is structural rather than incidental. cosmology-core — the organism this passport presets — is a declared resonance of doc-wenu-mapu, the documented Mapuche root volume cited to Canio & Pozo (2015). doc-we-tripantu, from the same source, is literally described as 'the return of light, the beginning that comes back'. A fiction-register scene about source, light, origin and return therefore sits one step away from silently absorbing documented Mapuche cosmology. SOURCE SPHERE must not link to, quote, cite, echo or visually resemble doc-wenu-mapu, doc-we-tripantu, spec-wenu-mapu, doc-rutrafe or doc-constelaciones, and must not use the phrase 'return of light' or any translation of it."
      - "The symmetry rules in geometry.topology are a cultural safeguard, not an aesthetic preference. Forbidding node counts divisible by four, forbidding shared divisors between shells, offsetting each shell centre and giving each shell a mutually non-commensurate rotation period together guarantee the figure never resolves into a four-fold cardinal frame, an eight-point star or a concentric mandala. Any implementation change that restores four-fold symmetry re-opens this boundary and must be rejected at review."
      - "The tree is an ARCHIVE tree. Manifest role: 'memoria y conexion (hub / capitulo-madre)'. It is a memory topology, not a cosmological axis. Rendering it as a world tree would import a motif that is live and specific in Mapuche, Norse, Kabbalistic and Buddhist traditions simultaneously, none of which KODEX has cleared here."
      - "The manuscript question resolves to a living author, not to antiquity. The only manuscript-class object in KODEX is Ocin's 81-plate monograph — copyrighted contemporary work under an explicit no-treatment rule — so 'manuscript reference' here is a rights question about a living artist's portfolio, not a heritage-imagery question. Nothing in this scene depicts a book, page, plate or script."
      - "Do not claim factual knowledge of souls, afterlife, or literal metaphysical transit. Source/light/origin is entirely mythopoetic. Do not resolve any residual gap with generic 'ancestral', 'tribal' or 'sacred geometry' substitution, which the protocol forbids outright."
      - "The register marker must be carried TEXTUALLY, not by palette alone. The manifest marks register by palette; design-system/tokens/kodex.tokens.json requires that colour never be the only channel. The persistent words REGISTRO · FICCION / REGISTER · FICTION are the required non-colour channel."
      - "OPEN CONFLICT ROUTED TO CULTURAL REVIEW: manifest estratos assign a living script to each stratum (macro-geometrias/devanagari, portales/arabic, geometrias-respirantes/kana, sol-negro/han, yayentru/hangul, laboratorio/cyrillic, artefacto/han, cosmos/greek), while design/KODEX_VOICE_AND_SCENE_MESSAGE_SYSTEM.md prohibits the KODEX Voice from 'use another culture's sacred language as decoration'. SOURCE SPHERE renders no script and so does not trigger it, but the conflict is real and belongs to the orchestrator."
  informationHierarchy:
    primary: "The central unbroken core — canonical visualAnchor kind 'sustained-absence', role dominant-phenomenon: 'Cámara de silencio; ausencia sostenida sin rellenar'. The absence is the dominant phenomenon and must stay unfilled; nothing may be added to the core to make it read as an object."
    secondary:
      - "The structural shell and branching tree-flow/lattice."
      - "The single flow path the visitor has committed to — from the core, through each shell it crosses, to the one record at its end."
      - "The persistent register marker identifying the scene as marked fiction."
    tertiary:
      - "Atmospheric telemetry and generated particle flows."
      - "Shell rotation, parallax and the depth wash behind the sphere — atmosphere only, carrying no data."
  geometry:
    primitives:
      - "Inner Sphere/Core (Void)"
      - "Nested Shells"
      - "Tree-Flow / Root Lattice"
      - "Flow Edge and Committed Flow Path"
      - "Focus Reticle"
    topology: "Concentric Spherical Organism with Radial Flow, canonical topology 'astral / source' (KDX-NODE-SOURCE-CHAMBER behavior.topology) — realised as a rooted directed acyclic branching graph (a tree in the graph sense, never in the pictorial sense) embedded on three ECCENTRIC elliptical shells around one core. The core is the single root; every node on shell k>1 has exactly one parent on shell k-1 and every parent has at least one child. Node placement is by seeded jittered angular division from session memory artifactSeed, so a revisit regenerates the identical sphere. FOUR SYMMETRY RULES ARE BINDING and are cultural safeguards, not preferences: (1) no shell may carry a node count divisible by 4; (2) no two shells may share a common divisor greater than 1; (3) each shell centre is offset from the core in a different direction, so the figure is eccentric and has no single mandala centre; (4) each shell rotates with a distinct, mutually non-commensurate period. Together these guarantee the figure never resolves into a four-fold cardinal frame, an eight-point star or a concentric mandala. Full-profile counts are 5 / 13 / 21 — Fibonacci, pairwise coprime, none divisible by 4 — giving 39 nodes and 39 edges."
    coordinateSystem: "Spherical coordinates centered at (0,0,0), expressed in normalized field space with x and y in [-1, 1] and y up, identical to the pointer normalization already implemented in kodex-observe-v2-client.ts. Shell radii are semi-major axes in field units with a fixed minor-axis ratio to produce the sphere read. Aspect correction is applied on the shorter viewport axis so the core disc and every node stay circular at every viewport."
    spatialLayers:
      - "Central Void (Source)"
      - "Energy Shell Layer"
      - "Branching/Root Emanations"
      - "Atmospheric/Particle Envelope"
  composition:
    focalStructure: "A gravitational center that draws attention inward to the sustained absence — but the core is never the focus target of last resort: at rest the eye is drawn outward along the flow. Exactly one shell holds focus at a time and exactly one node within it may be committed; focus is committed, never hovered. While a flow path is committed, that path and its terminal node are the only elements at full contrast, so the branch — not the sphere — is the subject. The core never occupies more than 8% of the field-box area, so the scene cannot read as a single luminous orb demanding worship rather than a structure inviting traversal."
    grid: "Radial / Spherical, inside the existing OBSERVE V2 shell grid used unchanged — header / left rail / scene code / hero block / visual shell / data stack / right rail / meta row / footer. The sphere occupies the visual shell only and never escapes it. The register marker sits in the header chip row where it is visible in every state."
    depthModel: "Deep central Z-axis void bounded by spherical layers, with three parallax planes and no perspective projection; total pointer-linked displacement never exceeds 4%. Depth within the sphere is carried by ellipse eccentricity, far-side dimming and far-side scaling. Per the epistemic standard's rule that perspective distortion cannot imply false magnitude, no node's rendered size may be read as a quantity: size encodes only front/back position on its shell."
    negativeSpace: "The core itself is negative space (sustained absence without filling). At least 45% of the field box stays unpopulated and the annuli between shells stay legibly empty apart from flow edges — no filler particles, no decorative dust, no secondary rings. A margin is kept inside the field-box edge so the outermost shell is never clipped, and the seeded jitter must never leave a gap larger than 2.2x mean node spacing, so the sphere cannot collapse into a crescent."
    responsiveRules:
      desktop: "Centered sphere organism, pointer drives rotation and shell opacity. Three shells at 5 / 13 / 21 nodes on the full profile, 5 / 9 / 13 on balanced; both rails and the dossier stack remain visible. The 44px touch minimum does not bind here because desktop input is pointer and keyboard, which is why desktop carries more nodes than mobile. Pointer proximity drives atmospheric attention only; a click is required to commit anything."
      mobile: "Scaled down to fit width, swipe controls rotation along the Y-axis; the sphere goes full-bleed above the fold and both rails collapse into the meta row. The register marker stays in the header and never collapses. Node counts are capped by touch-target geometry computed from the ELLIPSE, not the circle: because nodes are spaced equally in angle and the shell is drawn at a 0.42 minor-axis ratio, on-screen spacing is smallest at the left and right extremes, where it equals b * 2*pi/n with b = 0.42 * a. Requiring that minimum to clear 44px gives n <= 0.42 * a * 2*pi / 44 per shell; at 390x844 the caps are 3 / 6 / 10 and at 412x915 they are 4 / 6 / 10, and applying the symmetry rules on top both viewports resolve to 3 / 5 / 7, fifteen nodes. 3 / 5 / 9 is rejected because gcd(3,9)=3. Far-side nodes keep full-size hit targets even though they render smaller, and where two targets would still overlap the far-side node becomes non-interactive and its parent edge is committed in its place. No hover state is required for any semantic action on any viewport."
  paletteRoles:
    - role: "Core Void"
      semanticMeaning: "Sustained absence / Pure potential"
      tokenOrRange: "neon ground #0A0A0A (manifest organismos[07].paleta and organismos[04].paleta). Distinguished primarily by the absence of geometry and texture, not by colour. Brand-token neighbour color.field.obsidian (#050608) is NOT used — see the PALETTE note."
      colorIsNotOnlyChannel: true
    - role: "Core Halo"
      semanticMeaning: "The bounded edge of the absence; a mythopoetic figure, not a light source and not an energy claim"
      tokenOrRange: "neon magenta #FF2CF0 (manifest organismos[07].paleta) at low alpha, one hairline ring only. Brand-token neighbour color.signal.magenta (#FF1EAA) is NOT used."
      colorIsNotOnlyChannel: true
    - role: "Node Accent (canonical) / Shell / Tree-Flow"
      semanticMeaning: "The concept's canonical accent, and the structure containing/emanating from the source; at rest, present but not attended"
      tokenOrRange: "neon bone #E8E8E8 (manifest organismos[04].paleta) at reduced alpha, token line.hairline (1px), resolving the canonical accent slot 'bone' declared on KDX-NODE-SOURCE-CHAMBER. The node names the accent SLOT, not a hex value; ruling R1 selects the neon palette to resolve it, and bone resolves natively here. This is what the iMac lineage's bone accent was in fact pointing at."
      colorIsNotOnlyChannel: true
    - role: "Shell Attending (ORBITING)"
      semanticMeaning: "The shell has registered presence; nothing has been committed"
      tokenOrRange: "neon cyan #00F7FF (manifest organismos[07].paleta). Brand-token neighbour color.signal.cyan (#00E8F0) is NOT used."
      colorIsNotOnlyChannel: true
    - role: "Shell Open (EXPAND)"
      semanticMeaning: "The single shell the visitor has committed to opening"
      tokenOrRange: "neon violet #903CFF (manifest organismos[07].paleta). Brand-token neighbour color.signal.violet (#7855D5) is NOT used."
      colorIsNotOnlyChannel: true
    - role: "Committed Flow Path (TRANSMIT)"
      semanticMeaning: "A path the visitor committed and the session kept"
      tokenOrRange: "neon acid #A6FF00 (manifest organismos[04].paleta) at token line.signal (2px) against 1px hairline edges. Brand-token neighbour color.signal.acid (#B9FF3B) is NOT used."
      colorIsNotOnlyChannel: true
    - role: "Register Marker — Fiction"
      semanticMeaning: "Persistent declaration that this scene is marked fiction, per the manifest requirement that both registers are always marked"
      tokenOrRange: "neon violet #903CFF on the neon ground #0A0A0A. The WORDS carry the meaning; colour is secondary and never sufficient on its own."
      colorIsNotOnlyChannel: true
    - role: "Contested / Unresolved Marker"
      semanticMeaning: "A record the epistemic standard marks CONTESTED or UNKNOWN, or a node whose volume has review: true"
      tokenOrRange: "neon magenta #FF2CF0 with a 4-2 dashed stroke and the visible word UNKNOWN"
      colorIsNotOnlyChannel: true
    - role: "Instrument Text"
      semanticMeaning: "Chrome, labels and non-factual readouts"
      tokenOrRange: "neon bone #E8E8E8 with a muted variant; never a neon signal colour, so chrome cannot be mistaken for state"
      colorIsNotOnlyChannel: true
  typographyRoles:
    - role: "Register Marker"
      behavior: "Mono, uppercase, always visible in the header chip row and never collapsed at any viewport. Reads REGISTRO · FICCION / REGISTER · FICTION. This is a required element, not decoration: the manifest requires both registers to be always marked and marks them by palette alone, which cannot satisfy the design-system rule that colour may not carry essential meaning alone. The word is the non-colour channel."
    - role: "Telemetry"
      behavior: "Monospaced, abstract indicators of structural flow, explicitly non-factual and always preceded by a persistent marker (EN 'SIMULATED' / ES 'ATMOSFERA'). The existing OBSERVE V2 dossier renders generated SIGNAL, FOCUS, ANOMALY and LATENCY percentages with no such marker and must not be copied in that respect."
    - role: "Record Label"
      behavior: "The title of the volume a committed node stands for, shown with its own register tag. If a node's volume is registro documentado it must be visually and textually separated from the fiction chrome — under R1 a documented record must never be restyled into this scene, and the scene's own register marker never changes."
    - role: "Bilingual State Copy"
      behavior: "ES and EN strings per state, in the same shape as OBSERVE_V2_COPY in src/kodex/observe-v2/config.ts. SOURCE SPHERE supplies its own strings; only the structure is reused. Announced to screen readers on commit only. No string may assert that the visitor has received, remembered, returned from or been recognised by anything."
  motion:
    timescales:
      - "Breathing expansion/contraction (slow, organic) — token duration.long (1600ms) for shell expand and collapse"
      - "Particle transit along tree-flow (medium) — token duration.medium (600ms) per edge"
      - "Node highlight and shell focus — token duration.micro (120ms) / duration.short (240ms)"
      - "Shell rotation periods 12000 / 19000 / 31000 ms, deliberately non-commensurate so the three shells never realign into a symmetric frame"
      - "Canonical behavior scalars from KDX-NODE-SOURCE-CHAMBER, carried in place of the previously invented values: tempo 0.2 (the breathing loop is slow, which is what makes it read as sustained rather than pulsing), entropy 0.3 (the seeded jitter is irregular but not noisy), responsiveness 0.5 (shells answer input without snapping), persistence 0.5 (committed paths persist for the session, attention decays). These four are identical across all nine node files and are canonical defaults, not measurements."
    stateTransitions:
      - "Dormant to Breathing (organism IDLE -> ORBITING). Atmospheric; nothing is written."
      - "Breathing to Transmitting (organism ORBITING -> EXPAND, then a committed flow path). Consequential."
      - "ORBITING decays to IDLE after 3200ms without input, matching kodex-observe-v2-client.ts."
      - "The archive-tree sub-state runs in parallel and is atmospheric only: DORMANT while IDLE, GROWING while ORBITING, TRANSMIT on a committed path. It has no independent consequence and writes nothing of its own."
      - "SOURCE SPHERE introduces no parallel state machine; it renames the shipped engine states for this scene and adds one committed sub-event."
    loopingBehavior: "Continuous organic pulse/breathe loop around the central void. The three shells rotate in alternating directions at non-commensurate periods, so the composite silhouette never repeats within a session and never settles into an axis-aligned frame. Flow pulses are phase-offset deterministically from artifactSeed and must never fire in unison, which would read as a heartbeat and invite a physiological reading the scene must not make. The render loop pauses on document visibilitychange."
    reducedMotion: "Static sphere shell, no breathing scale animation, no fast particle transit, no rotation, no parallax, no depth drift. Every state change becomes a single 240ms opacity and stroke step; committed paths are drawn instantly at full length rather than animated. The profile resolves to low-power, which the shipped resolveProfile() already returns when prefers-reduced-motion is set."
  interaction:
    inputs:
      - "POINTER"
      - "TOUCH"
      - "KEYBOARD"
    semanticActions:
      - "ATMOSPHERIC — pointer proximity brightens the nearest node and its parent edge and applies parallax to the shells. Nothing is committed and nothing is written. Required by ADR-0010: passive pointer movement alone cannot make identity claims or write consequential personal memory."
      - "ATMOSPHERIC — flow pulses circulate while the sphere is orbiting. They indicate liveness only; they are not a count, a rate, a throughput or a signal strength, and no readout may derive a number from them."
      - "CONSEQUENTIAL — Rotate Organism and Focus Core (dilate shells) as view controls; opening one shell is a commit and at most one shell is open at a time."
      - "CONSEQUENTIAL — follow one flow: with a shell open, commit to one node on it. The full core-to-node path is drawn permanently for the session and the record that node stands for is opened. This is the only action that writes."
      - "CONSEQUENTIAL — return to core by Esc, activation of the core, tap outside the sphere, or the explicit exit control. Scene-local only: it asserts nothing about origin, homecoming or metaphysical return, and no copy may frame it as such."
      - "EXPLICITLY NOT AN ACTION — scroll position, dwell duration, pointer path shape, rotation phase at the moment of input, how many nodes were passed over, or which shells were merely looked at. None may be recorded, scored, aggregated or used to infer anything about the visitor."
    stateChanges:
      - "Hovering/Focusing strips away outer shells to reveal the core void."
      - "Sphere state advances IDLE -> ORBITING -> EXPAND, and decays ORBITING -> IDLE on inactivity."
      - "At most one shell is open at a time; opening another returns the previous one to the attending state."
      - "A committed path adds a persistent 2px chain from the core to that node, which survives release and reappears on revisit."
      - "Returning to the core returns every shell to the attending state and clears the reticle without erasing committed paths."
      - "Opening a node whose volume is registro documentado must present that record in the documented register rather than restyling it into the fiction chrome. The scene's own register marker never changes."
    memoryWrite:
      enabled: true
      key: "entitiesTraced"
      description: "Records that the user focused on the sustained absence — specifically, that the user committed one flow path. Only the flow commit writes: it appends one entity id, the manifest volume id the committed node stands for (for example 'vol:lore-1-la-fuente'), to the session memory array entitiesTraced declared in schemas/session-memory.schema.json. That schema sets additionalProperties false, so an ad-hoc key would be invalid, and the key is deliberately distinct from relationsTraced (FIELD OF EYES) and sourcesOpened (DNA PASSAGE) so the three scenes cannot collide. The write is idempotent by event identity. artifactSeed is READ to regenerate the sphere and is never written by this scene. No identity claim, score, ranking, profile, biometric value, attention metric, consciousness level, spiritual state or affinity value is ever written — the prohibited-pseudo-metric list applies to storage as strictly as to display. The visitor must be able to see and clear exactly what was written, and accessibility preferences are never inferred from behaviour."
    exitBehavior: "The sphere implodes into the void, leaving only the tree-flow roots. LEAVING IS NOT COMPLETION: the node's canonical outgoing edge is RETURNS_THROUGH KDX-NODE-HEART-CHAMBER, 'The route does not end at abstraction; the Source is integrated through the embodied heart node', so this scene is a gate on a route and not its end, and no copy, transition or affordance may frame the exit as culmination, arrival or attainment. Exit restores the exact prior route anchor, node, focus and scroll position per the ADR-0010 return-anchor law; committed paths persist for the session, so a revisit regenerates the identical seeded sphere with previous paths already drawn. SOURCE SPHERE is neither A nor Y and must not be routed as either; its use of the words source and return is scene-local and carries no topological claim, and per the marked Mapuche edge on KDX-NODE-RETURN the exit copy may not use 'return of light', 'renewal' or any translation of them."
  implementation:
    medium: "WEBGL"
    reusableEngineBoundary: "`source-chamber` — the engine name is canonical, declared as behavior.engine on KDX-NODE-SOURCE-CHAMBER, and it is what the implementation must register itself as. SourceSphereOrganism (the iMac lineage's name) is the implementation class behind that engine id and encapsulates sphere geometry, tree-flow, and the breathing loop independently of the scene. It is a data-driven preset composing the canonical cosmology-core and archive-tree organisms, not a new renderer, and it owns seeded shell and node generation under the four symmetry rules, flow-graph construction, shell rotation, per-shell and per-node state, the open/follow state machine, pointer normalization, profile resolution, the render-loop lifecycle and reduced-motion handling. The shell, node, edge and path layers are DOM/SVG and require no WebGL at all; the depth wash is an optional background adapter only. SourceSphereOrganism MUST expose an explicit destroy() that cancels the animation frame, clears tracked timeouts, deletes programs, buffers, textures and framebuffers, loses the WebGL context and removes every listener it added. This is not optional: the shipped runtime registers window 'resize' and document 'visibilitychange' listeners inside bindEvents() as inline arrows that can never be removed and has no teardown path, so an unmounted instance both leaks and — because the visibilitychange handler calls start() unconditionally — resurrects its render loop after being stopped."
    sceneSpecificParts:
      - "Atmospheric post-processing"
      - "Shell count, radii and the minor-axis ratio"
      - "Node counts per profile and per viewport, and the touch-target cap that overrides them on small screens"
      - "The four symmetry rules, which are scene configuration but must be enforced as invariants, not defaults"
      - "The flow-graph parent-selection rule (nearest in angle, every parent has at least one child)"
      - "Mapping of cosmology-core IDLE / ORBITING / EXPAND and archive-tree DORMANT / GROWING / TRANSMIT onto the palette roles declared above"
      - "Bilingual copy strings for the three sphere states, and the persistent register marker"
      - "The node-to-volume binding: which manifest volumes the nodes stand for, and their register tags"
      - "The 45% negative-space and 8%-maximum-core composition rules"
    dependencies:
      - "Three.js / ShaderMaterial (iMac lineage declaration). NOTE THE CONFLICT: the canonical grammar declares one engine, KDX CORE, and the macmini lineage specified no new third-party dependency at all. See the ENGINE note."
      - "design-system/tokens/kodex.tokens.json for non-colour tokens"
      - "Existing state and profile config in src/kodex/observe-v2/config.ts"
      - "Existing shell grid and DOM fallback in src/components/kodex/scenes/KodexObserveV2Scene.astro, including .kdx-observe-v2__phenomenon-core (__core-ring, __core-ring--inner, __core-pulse only — NOT __core-eye or __core-pupil)"
      - "Structural precedent only, not a component dependency: src/components/kodex/CosmologyMap.astro"
      - "SHADER GAP — the largest cost item. cosmology-core's canonical fx_chain is [thermal-map, pixel-sort] and NEITHER shader exists. archive-tree's is [dither-matrix, bitmap-threshold] and both are only partially and approximately covered by the single existing threshold.frag.glsl. Three options: (a) write thermal-map and pixel-sort as new shaders — pixel-sort is the expensive one, since a faithful sort needs a multi-pass sorting network rather than one fullscreen pass; (b) ship v1 on the already-implemented chain (crt-scan plus memory-feedback), explicitly deviating from both organisms' canonical fx_chains and recording the deviation; (c) ship v1 with the depth wash disabled entirely, which is viable because it carries no data. This passport recommends (c) for v1 and (a) as a separate packet."
      - "schemas/session-memory.schema.json for entitiesTraced"
      - "KOD-28 (JourneyState + EventTrace). The flow commit cannot be implemented before it lands, because idempotent replay by event identity is what keeps the memory write from double-writing."
    performanceRisk: "HIGH"
  fallback:
    noWebGL: "CSS radial gradients and layered SVGs simulating the sphere and roots. The scene stays fully functional and loses only atmosphere: the depth wash is the only WebGL layer and carries no data, while core, shells, nodes, flow edges, committed paths, every state and every action are DOM/SVG and unaffected. This path is already proven — the shipped runtime always renders its DOM fallback layer and only adds .is-active to the canvas when WebGL2 initialises, and ?fallback=1 forces it; CosmologyMap.astro further proves a shell-and-core figure ships as plain SVG. There must be no layout shift between the two paths."
    noAudio: "Scale pulses and opacity shifts communicate the 'breathing' rhythm. The organisms' canonical audio routings (cosmology-core mid+high+parallax, archive-tree low+mid+feedback) are optional atmosphere only; no information is available exclusively through sound, and no audio-reactive value may drive a visible readout, since that would present a generated number as a measurement."
    staticMode: "A high-fidelity static render of the Source Sphere at the attending state with the shells at their seed phase: all three shells drawn, all nodes at rest radius with far-side dimming applied, every flow edge drawn at full length, no rotation, no parallax, no pulses. Shell focus and node commitment remain available through keyboard and tap with instantaneous transitions. This is the mode used to produce the target captures, so captures are comparable across runs despite the seeded geometry."
  accessibility:
    keyboardEquivalent: "Enter/Space triggers the 'Focus Core' state, and more generally the sphere is a single stop in the tab order exposed as one composite widget with roving tabindex and aria-activedescendant. Up and Down arrows move the roving focus between rings — core, shell 1, shell 2, shell 3 — and Left and Right move around the current shell in rendered angular order, wrapping at the seam, with a deterministic tie-break by node id. Enter or Space opens a shell when focus is on a shell handle and commits a flow path when it is on a node; Esc returns to the core; Home moves to the core and End to the outermost shell. Because shells rotate, keyboard order is fixed to the seeded generation order and never to on-screen position, and while the roving focus is inside the sphere shell rotation pauses. Every consequential action is reachable without a pointer and without hover, with a visible focus indicator at every step."
    touchEquivalent: "Tap and hold dilates the shells; tap commits, and no hover is required for any semantic action. A tap on a shell or any of its nodes opens that shell, a second tap on a node commits the flow path, and a tap on the core or outside the sphere returns. Hit targets are at least 44x44 CSS px regardless of rendered node radius, which is what caps node count on small viewports. Far-side nodes keep full-size targets despite rendering smaller, and where two targets would overlap the far-side node becomes non-interactive and its parent edge is committed in its place. No long-press, multi-touch gesture, swipe, drag or pinch is required for any consequential action."
    screenReaderAlternative: "Aria live region describing the silent core and radiating branches. The sphere is exposed as a real nested list in the accessibility tree — 'Source core', then each shell as 'Shell 1 of 3, 5 nodes', then each node with its accessible name: the title of the volume it stands for, its register tag, its state and its parent node. It must be a real list rather than a role='img' with a single title. A text summary of all committed paths is available on demand and contains exactly the same data written to session memory. Committed actions are announced through a polite live region; pointer movement, shell rotation and flow pulses are never announced. Decorative layers are aria-hidden."
    nonColorEquivalent: "Core distinguished by absolute lack of geometry/texture rather than just color. Every other colour role carries a second channel: shell at rest versus attending is also stroke weight (1px versus 2px); an open shell is also the reticle bracket plus node scale; a committed flow path is also a 2px solid stroke against 1px hairline edges and a filled terminal node against hollow ones; contested or unresolved is also a 4-2 dashed stroke plus the visible word UNKNOWN; front versus back of a shell is also scale, not only alpha. Most importantly, the fiction register is marked in WORDS, not only by the neon palette, so register survives monochrome. State is additionally exposed as a data attribute and in the accessible name."
    reducedMotionEquivalent: "Replaces breathing animation with discrete opacity toggles; no rotation, no parallax, no pulses, and all transitions become 240ms opacity or stroke steps. A stored accessibility.motion preference of REDUCED or OFF in session memory overrides the media query, OFF additionally freezing shell rotation permanently, and no motion, sound, contrast or text-scale setting is ever inferred from behaviour."
  reviewChecks:
    - "Does the core feel like sustained absence rather than just a black circle?"
    - "Are pointer, touch, and keyboard interactions semantically equivalent?"
    - "Is the SourceSphereOrganism cleanly isolated for reuse?"
    - "Does the generated telemetry avoid looking like factual scientific measurement?"
    - "REGISTER MARKER — the words REGISTRO · FICCION / REGISTER · FICTION are visible in every state and at every viewport including 390x844, and remain legible under a grayscale filter. Register is never carried by palette alone."
    - "CANONICAL ANCHOR — the core reads as sustained, unfilled absence, per the node's visualAnchor 'Cámara de silencio; ausencia sostenida sin rellenar'. Nothing has been added inside the core to make it read as an object, a light source or an orb."
    - "NOT A TERMINUS — the scene never presents itself as culmination, arrival or the end of the route. Canon: 'The route does not end at abstraction; the Source is integrated through the embodied heart node.' Confirm no copy, transition or affordance frames leaving this scene as completion."
    - "ROUTE POSITION — the scene is reachable from DNA ASCENT and returns through HEART CHAMBER, its two CANONICAL edges, and neither transition is compulsory or irreversible."
    - "MAPUCHE EDGE BOUNDARY — the scene renders, traverses, links and references neither NEEDS_CULTURAL_REVIEW edge, and no copy uses 'return of light', 'renewal' or 'the beginning that comes back' in any language. Verify specifically at the exit, which is where the route runs closest to KDX-NODE-RETURN."
    - "NO REGISTER BLEND — the scene links to, quotes, cites and visually echoes no documented-register volume, and no Mapuche term, motif or cosmological structure appears anywhere."
    - "No node overlaps another and the outermost shell is never clipped, at 1440x900, 390x844 and 412x915."
    - "Symmetry audit: no shell's node count is divisible by 4, no two shells share a divisor greater than 1, every shell centre is offset from the core, and the three rotation periods are 12000 / 19000 / 31000 ms. Capture the sphere at ten random times and confirm it never presents a four-fold or eight-fold axis-aligned figure."
    - "The figure does not read as a mandala, a kultrun face, a compass rose or the WenuSigil emblem — confirmed by a reviewer who has seen WenuSigil.astro rendered alongside it."
    - "No trunk, roots, canopy or vertical world-axis appears; the tree is visible only as a rooted radial graph."
    - "No Devanagari, Arabic, Kana, Han, Hangul, Cyrillic or Greek characters appear anywhere in the rendered scene, and no faux-manuscript or parchment texture is present."
    - "Exactly one shell is open at a time; returning to the core leaves no second reticle on screen."
    - "Hover alone never changes a readout that implies a committed state and never writes to session memory — verify against the event trace after sweeping the pointer across every node on every shell."
    - "Every numeric readout in the chrome carries its persistent non-factual marker, and none of CONSCIOUSNESS, COHERENCE, ARCHIVE ENERGY, RETURN SIGNAL or EMOTIONAL FREQUENCY appears in any form."
    - "Full keyboard pass with no pointer: enter the sphere, traverse core and all three shells with arrows, open a shell, commit a flow path, return with Esc, with a visible focus indicator at every step and shell rotation paused throughout."
    - "Minimum 44x44 px touch targets verified on 390x844 and 412x915, with no two targets overlapping, including far-side nodes."
    - "With prefers-reduced-motion set: no rotation, no parallax, no pulses, and all transitions are 240ms opacity or stroke steps."
    - "With ?fallback=1: the scene is fully usable, core, shells, nodes, edges and committed paths are all present, and there is no layout shift versus the WebGL path."
    - "Screen-reader pass: the sphere is a real nested list, every node has a name, a register tag and a parent; commits are announced; rotation and pointer movement are not."
    - "Monochrome pass under a grayscale filter: rest, attending, open, committed and contested remain distinguishable, and the register is still readable."
    - "Leaving and re-entering the scene regenerates the identical seeded sphere and redraws previously committed paths, and no duplicate entity is written on replay."
    - "After unmount, no animation frame is running, the WebGL context is released, no timeout remains pending, and no window or document listener registered by the scene remains. Specifically verify that hiding and re-showing the tab after unmount does NOT restart the render loop."
    - "Sustained 50fps or better at the full profile on desktop with 39 nodes and 39 edges animating and no frame-time regression versus OBSERVE V2 at the same profile, and 30fps or better at low-power on mobile with 15 nodes and 15 edges."
    - "Touch-target arithmetic re-verified against the shipped build at 390x844 and 412x915: measure the minimum on-screen distance between adjacent node centres on each shell and confirm it is at least 44 px, taking the measurement at the left and right extremes of each ellipse where the spacing is smallest, not at the top and bottom where it is largest."
