  epistemicConstraints:
    - "CANON, verbatim from KDX-NODE-SOURCE-CHAMBER editorial body: 'Concepto autoral de KODEX sobre el origen como potencial. No es cosmología física ni pretende serlo.' This is an authored KODEX concept about origin as potential; it is not physical cosmology and does not claim to be. That single sentence is the strongest available statement of the boundary against cos-01-origen and the Chaisson material."
    - "CANON BINDS exitBehavior: the node's outgoing CANONICAL edge is RETURNS_THROUGH KDX-NODE-HEART-CHAMBER, 'The route does not end at abstraction; the Source is integrated through the embodied heart node.' This scene is therefore not a terminus and must never present itself as culmination, arrival, attainment or the end of anything."
    - "Source/light/origin/return is mythopoetic unless separately verified. The anchor volume lore-1-la-fuente is registro ficcion and marks itself 'not history, not science, not health'; SOURCE SPHERE inherits that marking and displays it persistently."
    - "Do not claim factual knowledge of souls, afterlife or literal metaphysical transit. The scene makes no claim about consciousness, reincarnation, energy, frequency or biology, and must not imply that the visitor originated anywhere, is returning anywhere, is being recognised, or is being read. The KODEX Voice prohibitions apply verbatim: the scene may not diagnose the visitor or claim to read energy, consciousness, frequency or biology."
    - "Generated telemetry is not factual. Every numeric readout — flow, coherence, depth, latency, node count, checksum — is generated atmosphere, not measurement. Three of the five prohibited pseudo-metrics canon/KODEX_EPISTEMIC_STANDARD.md lists by example — ARCHIVE ENERGY, RETURN SIGNAL, COSMIC COHERENCE — are precisely the labels this scene must never invent."
    - "Flow pulses indicate liveness only. Per the visual-truthfulness rule that particle density cannot imply a count unless particles encode units, no pulse rate, density or brightness may be captioned or derived as a quantity."
    - "The sphere geometry is generated, not measured. It represents no dataset, no cosmology and no real structure, and must never be captioned or labelled as if it did. Fibonacci radii and node counts are arithmetic chosen for composition and non-symmetry; they assert nothing about nature, and the scene must not describe them as sacred, universal or fundamental."
    - "Registers must not blend. Under R1 SOURCE SPHERE sits in the FICTION register; it must not link to, blend with or absorb any documented-register volume, must never touch Mapuche material, and must not restyle documented volumes into its own chrome when they are opened from it. Resonance links in the manifest are relations between separate records, not permission to merge them."
    - "The scene may not present the documented cosmological volumes cos-01-origen, cos-02-atomos or cos-03-estrellas, or their Chaisson sourcing, as its own content or as corroboration of its mythopoetic frame."
  scientificClaimPolicy: "SYMBOLIC_ONLY"
  notes:
    - "LINEAGE — this passport is the R2 merge of two independent versions: the iMac branch feature/visual-passport-source-sphere-v1 (128 lines, 3 sourceRefs, 4 reviewChecks, no notes field) supplied the skeleton, field ordering and compact field values; the macmini branch feature/visual-passport-source-sphere-v1-macmini (660 lines, 26 sourceRefs, 20 reviewChecks) supplied sourceRefs, reviewChecks, provenanceBoundaries and the escalated decisions below. Neither lineage was discarded. Where the two disagreed on a value rather than on depth, the disagreement is recorded here rather than silently resolved. Note also that the iMac source-sphere branch carried an earlier 122-line copy of DNA_PASSAGE.v1.yaml; the newer 149-line supervisor-patched version on the dna-passage branch was used for that passport, not this one."
    - "REGISTER — CLOSED BY RULING R1, AND INDEPENDENTLY CORROBORATED LOCALLY. SOURCE SPHERE sits in the FICTION register with the neon palette. The macmini lineage had already closed this on evidence (lore-1-la-fuente is registro ficcion / paleta neon); R1 makes it binding. Consequences applied here: paletteRoles reconciled to the neon values; no link to or blend with any documented-register volume and never with Mapuche material; the register marker carried textually as well as by colour; and iconography from a living tradition treated as a glyph, a borrowing from the imaginary, never doctrine."
    - "PALETTE — WHICH VALUES WERE USED AND WHY, AND WHAT IS STILL OPEN. R-open 3 in the creator rulings is UNRESOLVED: the canonical organism palettes are close to but not identical with the design-system tokens. This passport uses the ORGANISM NEON VALUES — cosmology-core #FF2CF0, #903CFF, #00F7FF, #0A0A0A and archive-tree #A6FF00, #E8E8E8, #0A0A0A from the manifest — because ruling R1 says the palette is neon and those are the neon values, citing the brand-token neighbour beside each for traceability. This is a change from the macmini lineage, which treated the design-system tokens (magenta #FF1EAA, violet #7855D5, cyan #00E8F0, acid #B9FF3B, obsidian #050608) as authoritative. The delta is real and visible and R-open 3 is NOT settled by doing this: the orchestrator still owes a ruling on whether the manifest or the token file is canonical, and if the token file wins the neon values must be re-derived there rather than taken from the manifest."
    - "R-OPEN 1 — CONCEPT IDENTITY: CLOSED. The concept is the real canonical node KDX-NODE-SOURCE-CHAMBER at src/data/kodex/nodes/source-chamber.json in wenu-frontend, atlasStatus CANON, status active, publishable true. It was invisible to every earlier search because of a loader bug — getKodexNodes() resolved its path with import.meta.url, which at build time points into dist/ rather than src/, so the loader returned [] and no node route was ever generated. Fixed on feature/kodex-node-graph-v1 @ 867fb8b0 (PR #44). THE MAPPING WAS VERIFIED FROM CONTENT, NOT ASSUMED FROM THE NAME, and the name does not match: the node is titled SOURCE CHAMBER, the packet says SOURCE SPHERE. Three independent content checks carry it. (1) The node's proposition, 'El origen no es un comienzo: es lo que todavía no ha elegido forma. La unidad acá no cierra nada', is the exact string this passport already carried as nodeQuestion in both revisions. (2) The node's summary, 'Holds the KODEX concept of origin as pure potential, silence and non-final unity', is almost word for word the iMac lineage's semanticPurpose, and its visualAnchor 'sustained-absence' is the phrase the iMac lineage used in informationHierarchy.primary and negativeSpace. (3) Graph position: source-chamber is gate 04 of the canonical ASTRAL ROUTE 01-06, after dna-ascent (gate 03) and field-of-eyes (gate 02) — the same three concepts, in the same order, as work packets KOD-38 / KOD-39 / KOD-40."
    - "FIGURE MISMATCH — CANON SAYS CHAMBER, THE PACKET SAYS SPHERE, AND THIS IS WORTH THE CREATOR'S ATTENTION. The node's visualAnchor is kind 'sustained-absence' with the label 'Cámara de silencio; ausencia sostenida sin rellenar' — a chamber of silence, an unfilled sustained absence. It is not a sphere, and nothing in the node describes shells, orbits or a spherical body. The spherical shell-and-flow figure specified in geometry is this passport's reading, inherited from the packet title and from the shell/core precedent in the shipped code; it is not canonical. What IS canonical is the sustained, unfilled absence at the centre, and every composition rule here is written to protect it: the core is negative space, it never exceeds 8% of the field box, the annuli stay empty and the eye is drawn outward along the flow rather than inward to an orb. If the creator intends a chamber rather than a sphere, the shells should be reconsidered — the absence survives either way, the shells do not. This should be settled before implementation, because it is the difference between an interior and a body."
    - "STATUS — STAYS DRAFT, BUT FOR DIFFERENT AND SMALLER REASONS THAN BEFORE. With R-open 1 closed and the register closed by R1, the open items are: the FIGURE MISMATCH above, the MODE AND ACCENT question, R-open 3 (palette), the organism-composition question, and the engine declaration. Those are open decisions for the creator, so status may not move to REVIEW."
    - "MODE AND ACCENT vs RULING R1 — A GENUINE AMBIGUITY, RECORDED AS AN OPEN DECISION RATHER THAN RESOLVED. The node declares mode 'dark-archive' and accent 'bone', while R1 places this scene in the FICTION register with the NEON palette. This passport's reading is that these are two DIFFERENT AXES and do not contradict. The node schema constrains mode to exactly two values, ['dark-archive', 'technical-plate'], and all nine nodes are dark-archive; two values, one of which is 'technical-plate', describe a RENDER SURFACE, not a content register, and the manifest's five-value register vocabulary appears nowhere in the node schema. The node schema likewise constrains accent to a fixed eight-name list [gold, red, violet, cyan, acid, magenta, indigo, bone] — SLOT NAMES, not hex values — so the node says which accent slot the concept owns and R1 supplies the palette that resolves it. Here it resolves cleanly: bone is archive-tree's #E8E8E8. THE READING IS NOT CERTAIN. A defensible contrary reading is that 'dark-archive' IS the archive's presentation register and node-graph content therefore sits outside the documented/fiction split, making R1's fiction placement a category error rather than a binding ruling. Nothing in either repository defines mode or accent in prose; the enums are the only evidence, and enums do not state intent. The creator should say which reading is intended. Note that of the three passports this one is least affected either way, because its own anchor volume lore-1-la-fuente independently declares registro ficcion / paleta neon."
    - "CONCEPT ID — REVERSED ON NEW EVIDENCE, AND THE iMac LINEAGE WAS RIGHT ON BOTH OF ITS IDS. An earlier revision of this merge set conceptId to the organism slug cosmology-core and recorded the iMac lineage's KDX-NODE-SOURCE-CHAMBER and kodex-tree-infinity-core as unverifiable claims, because a full-tree grep found no such ids and src/data/kodex/nodes/ did not exist on any branch then available. Both node files were real; the loader bug meant nothing ever read them. conceptId is now the canonical node id, and tree-infinity-core is restored as a verified REFERENCE. cosmology-core and archive-tree remain the RENDERING anchors — what the scene is a preset of — and are retained as PRIMARY_CONCEPT sourceRefs."
    - "RELATIONSHIPS — USED, NOT DECORATIVE, AND ONE OF THEM CHANGES A FIELD. The node graph gives this scene two CANONICAL edges (DNA ASCENT LEADS_TO here; here RETURNS_THROUGH HEART CHAMBER) and one VALID containment (gate 04 of ASTRAL ROUTE 01-06). The outgoing edge is not decoration: its descriptor, 'The route does not end at abstraction; the Source is integrated through the embodied heart node', is a canonical statement that this scene is not a terminus, and it is carried into epistemicConstraints, exitBehavior and reviewChecks. The route's own proposition independently confirms the non-compulsory, reversible traversal model. The two NEEDS_CULTURAL_REVIEW edges are handled in provenanceBoundaries.culturalSensitivity, where one of them is now the sharpest evidence in this passport."
    - "THE STOP CONDITION IS NOT TRIGGERED, and this is deliberate. The packet stops if 'reference provenance/copying boundary cannot be stated'. It can be stated, and conservatively: no external reference reached this worker, therefore nothing external may be copied; the one canonical reference acknowledged to exist — the privately supplied video behind KODEX_VOICE_AND_SCENE_MESSAGE_SYSTEM.md — carries its own explicit non-copying rule in that document, which this passport adopts verbatim. The boundary is total rather than uncertain."
    - "ORGANISM COMPOSITION — the one architectural assumption in this passport, escalated not decided. Manifest sistemas.gramatica licenses any TREATMENT on any ORGANISM. It does not state that two organisms may be composed in one scene. The justification used here is herm-tabla-esmeralda's 'TREE (micro) vs COSMOLOGY (macro): everything is the same', which is a semantic identity claim in a registro esoterico volume, not an engine rule. If the orchestrator rejects organism composition, the fallback is to preset cosmology-core alone and render the branching flow as an internal connection layer rather than as archive-tree — the geometry survives, the archive-tree state vocabulary and fx_chain do not. This decision should be made before implementation because it changes which fx_chain the scene claims and which neon palette contributes the flow colour."
    - "CULTURAL BOUNDARY — the single most important finding in this passport. cosmology-core, the organism being preset, is a declared resonance of doc-wenu-mapu, the documented Mapuche root volume cited to Canio & Pozo (2015), ISBN 978-956-335-205-4. Its companion doc-we-tripantu is described in the manifest as 'the return of light, the beginning that comes back'. A fiction-register scene about source, light, origin and return is therefore one careless step from absorbing documented Mapuche cosmology into Codex Estelar myth, which R1 and the manifest forbid twice over. This passport fences it structurally rather than by intention: the symmetry rules make a Meli Witran Mapu or kultrun reading geometrically impossible, the tree is a graph and never a silhouette, no Mapudungun appears, and no documented Mapuche volume may be linked. A cultural reviewer should confirm the fence before implementation, and specifically should look at the rendered sphere beside WenuSigil.astro."
    - "MANUSCRIPT — the packet asks for provenance boundaries on manuscript references. Investigated: the only manuscript-class object in KODEX is book-ocin-arte-digital-ritual, an 81-plate monograph by a living author, registro documentado, paleta 'libro', under the manifest's absolute rule that treatments apply only to photos and derivatives and never to Ocin's finished work. So the manuscript question here is a rights question about a contemporary artist's portfolio, not a heritage-imagery question. SOURCE SPHERE resolves it by containing no book, page, plate, script or manuscript texture at all."
    - "OPEN CONFLICT FOR THE ORCHESTRATOR — script as ornament. Manifest estratos assign a living writing system to each stratum (devanagari, arabic, kana, han, hangul, cyrillic, greek) while design/KODEX_VOICE_AND_SCENE_MESSAGE_SYSTEM.md prohibits 'use another culture's sacred language as decoration'. These cannot both stand. SOURCE SPHERE renders no script and so does not trigger the conflict, but it is a real contradiction inside canon and it will surface in any scene that displays a stratum badge."
    - "OPEN CONFLICT FOR THE ORCHESTRATOR — register marking is colour-only in canon. The manifest marks the two mandatory registers by palette ('DOCUMENTADO (paleta marca)' and 'MITO/FICCION (paleta neon)'), while design-system/tokens/kodex.tokens.json states 'Color may not carry essential meaning alone.' Register is essential meaning. Ruling R1 resolves this for these three passports by requiring the marker to be carried textually, but the contradiction is system-wide and every other KODEX scene inherits it."
    - "ORGANISM COMPOSITION vs CONCEPT ID — keep the two apart. conceptId is the canonical NODE (KDX-NODE-SOURCE-CHAMBER, closed above). cosmology-core and archive-tree are the RENDERING organisms this scene is a preset of, and whether two organisms may be composed in one scene is still open — see the ORGANISM COMPOSITION note. If the composite warrants its own registry entry the creator should assign one; this passport does not create canon."
    - "PASSPORT ID — LINEAGE DISAGREEMENT. iMac used VP-SOURCE-SPHERE-V1, macmini used KDX-VP-SOURCE-SPHERE-V1. Neither lineage is authority here; ops/factory/VISUAL_PASSPORT_TEMPLATE.yaml is, and it prescribes the prefix KDX-VP-. That is what this file uses. Flagged rather than assumed."
    - "MEMORY KEY — LINEAGE DISAGREEMENT, RESOLVED ON EVIDENCE. iMac specified an ad-hoc key kodex-source-chamber-witnessed; macmini specified entitiesTraced. schemas/session-memory.schema.json declares entitiesTraced and sets additionalProperties false, so the ad-hoc key would be rejected by the repository's own schema. The schema-valid key is used and the iMac choice is recorded here. The three merged passports deliberately claim three different keys — relationsTraced, sourcesOpened, entitiesTraced — so they cannot collide."
    - "SCHEMA ENVELOPE — LINEAGE DISAGREEMENT. The iMac file was a bare top-level mapping; the macmini file used the schema_version / visual_passport envelope. The envelope is kept because ops/factory/VISUAL_PASSPORT_TEMPLATE.yaml uses it and the contract validator reads the passport at the visual_passport key."
    - "ENGINE — LINEAGE DISAGREEMENT, CARRIED AS THE iMac VALUE AND FLAGGED. iMac declared a Three.js / ShaderMaterial dependency; macmini declared 'No new third-party dependency' and specified the whole scene as DOM/SVG on KDX CORE with the WebGL layer optional. The canonical grammar says one engine, KDX CORE. The iMac declaration is kept per R2's instruction to take the iMac structure, but it conflicts with canon and with the macmini finding that the scene is shippable with no WebGL at all. The orchestrator should rule; the macmini position is the cheaper and more canon-conformant one."
    - "OTHER LINEAGE DISAGREEMENTS CARRIED AS-IS. medium: iMac WEBGL, macmini HYBRID — WEBGL is kept per the iMac skeleton, though the scene is specified so the DOM/SVG path is fully functional, which is closer to HYBRID in substance. interaction.inputs: iMac declares POINTER/TOUCH/KEYBOARD, macmini adds TIME for ambient decay — the iMac set is kept even though decay is specified in motion. reusableEngineBoundary: iMac SourceSphereOrganism, macmini SourceSphere — the iMac name is kept. performanceRisk: both lineages agreed on HIGH. targetCaptures: iMac's desktop_wide 1920x1080 is kept and macmini's desktop-1440x900 added, because the grafted reviewChecks are written against 1440x900."
    - "COORDINATE — coordinateAssignment stays null. ADR-0010's concept assignment law requires creator approval plus a defined relation, sources, consequences, memory writes, Y contribution and epistemic/rights/cultural status before any A-Y letter is assigned. Note the specific trap this scene invites: ADR-0010 calls A 'the source invariant' and Y 'RETURN / +infinity'. A scene named SOURCE SPHERE whose exit action returns to the core must not be assigned A or Y on the strength of its name. Its use of both words is scene-local."
    - "DEPENDENCY — the flow commit cannot be implemented before KOD-28 (JourneyState + EventTrace) lands, because idempotent replay by event identity is what keeps the memory write from double-writing."
    - "SHADER GAP — cosmology-core's canonical fx_chain is [thermal-map, pixel-sort] and NEITHER exists; archive-tree's is [dither-matrix, bitmap-threshold] and both are only partially covered by one approximate shader. Full audit against src/kodex/observe-v2/shaders/: crt-scan, bitmap-threshold, memory-feedback and chromatic-split have shaders; glitch-fracture is partial/approximate; dither-matrix, thermal-map and pixel-sort have none. This scene is the worst affected of the three passports, and it is directly relevant to R4 track 3 (the four missing GPU treatments)."
    - "WHY performanceRisk IS HIGH. (1) The shader gap is the dominant factor: both of cosmology-core's canonical treatments are unimplemented, and a faithful pixel-sort needs a multi-pass sorting network rather than a single fullscreen pass. (2) Element count exceeds FIELD OF EYES: at the full profile the sphere is 39 nodes plus 39 flow edges plus 3 shell rings plus the core, 82 animated SVG elements, on top of the 44 elements the shipped runtime already writes CSS custom properties to every frame. Per-element updates must be restricted to transform and opacity, batched in a single write phase, never interleaved with reads. (3) Continuous shell rotation means every node's transform changes every frame, unlike FIELD OF EYES where nodes are static between commits — a genuinely higher steady-state cost, and the reason the depth wash should be dropped for v1. (4) Curved flow edges must animate by stroke-dashoffset or transform only, never by recomputing path d attributes per frame. (5) Committed paths accumulate for the session and are never removed, so their draw cost must stay O(committed) with no full-sphere repaint per commit. (6) Far-side dimming and scaling must be computed from the rotation phase arithmetically, not by hit-testing or sorting nodes per frame. (7) token performance.maxActiveHeavyCanvases is 1, so the depth wash and any other heavy canvas on the same route are mutually exclusive. (8) The listener leak and render-loop resurrection recorded below become compounding performance failures, not merely correctness ones, if the scene is mounted more than once."
    - "IMPLEMENTATION PACKET RECOMMENDATION — split into three packets, in this order. (a) C2, producer BOUNDED_CODING_AGENT, reviewer LONG_CONTEXT_ARCHITECT: extract SourceSphereOrganism as a DOM/SVG organism preset with an explicit destroy(), seeded shell and flow-graph generation enforcing the four symmetry rules as invariants with unit tests, the open/follow state machine, the keyboard model, and NO WebGL layer at all. This is the whole scene and it is shippable, because the depth wash carries no data. (b) C1, MULTIMODAL_VISUAL_SPEC: visual and cultural review against reviewChecks at the target captures, after (a), with the symmetry and Mapuche-boundary checks performed by a reviewer who has seen WenuSigil.astro rendered. (c) C2 or C3, separate and optional: implement thermal-map and pixel-sort as real shaders and attach the depth wash, only if the orchestrator wants the canonical fx_chain honoured. Do not bundle (c) into (a) — it is the expensive half and the scene does not need it. Do not issue (a) until R-open 1 and the organism-composition question are answered."
    - "DEFECT 1 FOUND IN EXISTING CODE — reported, not fixed, since this packet may not edit runtime code. src/components/kodex/scenes/kodex-observe-v2-client.ts bindEvents() adds addEventListener('resize', () => this.resize()) and document.addEventListener('visibilitychange', ...) as inline arrow functions that cannot be removed, and the class has no destroy() or dispose(). stop() only cancels the animation frame and clears timeouts. Two consequences, the second worse than the first: mounting a second scene leaks listeners and a WebGL context; and because the visibilitychange handler calls this.start() unconditionally when the document becomes visible, an unmounted or intentionally stopped runtime will resurrect its own render loop the next time the user switches back to the tab. This is a zombie-render defect, not only a leak."
    - "DEFECT 2 FOUND IN EXISTING CODE — src/components/kodex/CosmologyMap.astro. Its header comment states 'Non-blocking: falls back to a legible list layout on <640px.' There is no 640px breakpoint anywhere in the file and the SVG map never becomes a list; the only media query is at max-width 820px and it merely collapses the stage grid to one column. The <ol role='list'> that exists is the separate ecosystem-portals panel, not a fallback for the map. The accessibility promise in the comment is not implemented. This passport's screenReaderAlternative specifies the list structure that comment describes, and it must be built rather than assumed."
    - "DEFECT 3 FOUND IN EXISTING CODE — src/components/kodex/CosmologyMap.astro node interaction is pointer-only. The nodes are SVG <g> elements with a .kdx-cosmo__nodes g:hover rule that changes circle radius and fill, with no tabindex, no focus rule and no :focus-visible equivalent, inside an svg carrying role='img' and a single title. That violates the protocol's 'Pointer discovery is never the only way to access a semantic action.' It is currently harmless because the hover carries no semantic action, but the pattern must not be carried into SOURCE SPHERE, where nodes ARE the semantic action."
    - "DEFECT 4 FOUND IN EXISTING CODE — the OBSERVE V2 dossier renders generated SIGNAL, FOCUS, ANOMALY and LATENCY percentages with no non-factual marker. This passport requires such a marker and it is worth backporting. Recorded independently in the FIELD OF EYES passport; repeated here because it is unresolved."
    - "EVIDENCE — sources actually inspected are listed field by field in sourceRefs, and every file named there was read. Sources looked for and NOT found: any SOURCE SPHERE concept or reference image; any thermal-map, pixel-sort, dither-matrix, bitmap-threshold or glitch-fracture shader; any canonical A-Y letter assignment for this concept; any manifest volume named as a sphere (the string 'esfera' appears zero times in the manifest). The R2 bucket is the one source located but deliberately not opened, and it is marked as such. CORRECTION TO AN EARLIER REVISION OF THIS FILE: that revision recorded the two iMac-lineage ids kodex-node-source-chamber and kodex-tree-infinity-core as not existing on this machine. Both DO exist, as src/data/kodex/nodes/source-chamber.json and tree-infinity-core.json; they were unreachable because of the node-loader bug, not absent. The earlier claim was wrong and is corrected here rather than deleted."
