  epistemicConstraints:
    - "Source, light, origin and return are mythopoetic in this scene and nothing else. The anchor volume lore-1-la-fuente is registro ficcion and marks itself 'not history, not science, not health'; SOURCE SPHERE inherits that marking and displays it persistently."
    - "The scene makes no claim about souls, consciousness, afterlife, reincarnation, energy, frequency, biology or any literal metaphysical transit. It must not imply that the visitor originated anywhere, is returning anywhere, is being recognised, or is being read. The KODEX Voice prohibitions apply verbatim: the scene may not diagnose the visitor or claim to read energy, consciousness, frequency or biology."
    - "Every numeric readout — flow, coherence, depth, latency, node count, checksum — is generated atmosphere, not measurement. None may be presented as system state, biometric data, attention score, resonance value or consciousness level. The prohibited pseudo-metrics of canon/KODEX_EPISTEMIC_STANDARD.md are directly in scope for a scene with this name, and three of the five it lists by example — ARCHIVE ENERGY, RETURN SIGNAL, COSMIC COHERENCE — are precisely the labels this scene must never invent."
    - "Flow pulses indicate liveness only. Per the visual-truthfulness rule that particle density cannot imply a count unless particles encode units, no pulse rate, density or brightness may be captioned or derived as a quantity."
    - "The sphere geometry is generated, not measured. It represents no dataset, no cosmology and no real structure, and must never be captioned or labelled as if it did. Fibonacci radii and node counts are arithmetic chosen for composition and non-symmetry; they assert nothing about nature, and the scene must not describe them as sacred, universal or fundamental."
    - "Registers must not blend. SOURCE SPHERE sits in the marked-fiction register and must not touch Mapuche material, and must not restyle documented volumes into its own chrome when they are opened from it. Resonance links in the manifest are relations between separate records, not permission to merge them."
    - "The scene may not present the documented cosmological volumes cos-01-origen, cos-02-atomos or cos-03-estrellas, or their Chaisson sourcing, as its own content or as corroboration of its mythopoetic frame."

  scientificClaimPolicy: "SYMBOLIC_ONLY"

  notes:
    - "PROVENANCE QUESTION 1 — concept identity, and why status is DRAFT. The title SOURCE SPHERE exists in no file of either repository except KOD-40.yaml itself, verified by case-insensitive full-tree grep of both repos. The concept/reference images named in the packet's source_inputs never reached this worker and no image of any kind was inspected. This passport is therefore derived from canonical text that genuinely exists: the cosmology-core and archive-tree organism records, the lore-1-la-fuente volume that is literally titled The Source, the herm-tabla-esmeralda volume that declares TREE and COSMOLOGY identical, and the sphere named in design/KODEX_VOICE_AND_SCENE_MESSAGE_SYSTEM.md. The orchestrator must confirm this is the intended concept before any implementation packet is issued. Status stays DRAFT for this reason alone — every other question below is answered."
    - "THE STOP CONDITION IS NOT TRIGGERED, and this is deliberate. The packet stops if 'reference provenance/copying boundary cannot be stated'. It can be stated, and conservatively: no external reference reached this worker, therefore nothing external may be copied; the one canonical reference that is acknowledged to exist — the privately supplied video behind KODEX_VOICE_AND_SCENE_MESSAGE_SYSTEM.md — carries its own explicit non-copying rule in that document, which this passport adopts verbatim. The boundary is total rather than uncertain."
    - "PROVENANCE QUESTION 2 — organism composition is the one architectural assumption in this passport. Manifest sistemas.gramatica licenses any TREATMENT on any ORGANISM. It does not state that two organisms may be composed in one scene. The justification used here is herm-tabla-esmeralda's 'TREE (micro) vs COSMOLOGY (macro): everything is the same', which is a semantic identity claim in a registro esoterico volume, not an engine rule. If the orchestrator rejects organism composition, the fallback is to preset cosmology-core alone and render the branching flow as an internal connection layer rather than as archive-tree — the geometry survives, the archive-tree state vocabulary and fx_chain do not. This decision should be made before implementation because it changes which fx_chain the scene claims."
    - "REGISTER — RESOLVED, unlike KOD-38. lore-1-la-fuente is registro ficcion / paleta neon and self-marks 'not history, not science, not health'. SOURCE SPHERE is therefore marked fiction, neon palette, with a persistent visible register marker. The orchestrator does not need to rule on this; it needs only to confirm the anchoring in question 1."
    - "CULTURAL BOUNDARY — the single most important finding in this passport. cosmology-core, the organism being preset, is a declared resonance of doc-wenu-mapu, the documented Mapuche root volume cited to Canio & Pozo (2015), ISBN 978-956-335-205-4. Its companion doc-we-tripantu is described in the manifest as 'the return of light, the beginning that comes back'. A fiction-register scene about source, light, origin and return is therefore one careless step from absorbing documented Mapuche cosmology into Codex Estelar myth, which the manifest forbids twice over. This passport fences it structurally rather than by intention: the symmetry rules make a Meli Witran Mapu or kultrun reading geometrically impossible, the tree is a graph and never a silhouette, no Mapudungun appears, and no documented Mapuche volume may be linked. A cultural reviewer should confirm the fence before implementation, and specifically should look at the rendered sphere beside WenuSigil.astro."
    - "MANUSCRIPT — the packet asks for provenance boundaries on manuscript references. Investigated: the only manuscript-class object in KODEX is book-ocin-arte-digital-ritual, an 81-plate monograph by a living author, registro documentado, paleta 'libro', under the manifest's absolute rule that treatments apply only to photos and derivatives and never to Ocín's finished work. So the manuscript question here is a rights question about a contemporary artist's portfolio, not a heritage-imagery question. SOURCE SPHERE resolves it by containing no book, page, plate, script or manuscript texture at all."
    - "OPEN CONFLICT FOR THE ORCHESTRATOR — script as ornament. Manifest estratos assign a living writing system to each stratum (devanagari, arabic, kana, han, hangul, cyrillic, greek) while design/KODEX_VOICE_AND_SCENE_MESSAGE_SYSTEM.md prohibits 'use another culture's sacred language as decoration'. These cannot both stand. SOURCE SPHERE renders no script and so does not trigger the conflict, but it is a real contradiction inside canon and it will surface in any scene that displays a stratum badge."
    - "OPEN CONFLICT FOR THE ORCHESTRATOR — register marking is colour-only. The manifest marks the two mandatory registers by palette ('DOCUMENTADO (paleta marca)' and 'MITO/FICCIÓN (paleta neon)'), while design-system/tokens/kodex.tokens.json states 'Color may not carry essential meaning alone.' Register is essential meaning. This passport resolves it locally by requiring a persistent textual register marker, but the contradiction is system-wide and every KODEX scene inherits it."
    - "PALETTE CONFLICT — unchanged from KOD-38 and now affecting two more organisms. Canonical cosmology-core palette (#FF2CF0, #903CFF, #00F7FF, #0A0A0A) and archive-tree palette (#A6FF00, #E8E8E8, #0A0A0A) are close to but not identical with the design-system tokens (magenta #FF1EAA, violet #7855D5, cyan #00E8F0, acid #B9FF3B, obsidian #050608). This passport uses the design-system tokens as authoritative because they are the versioned artefact in the canon repository. The delta is real and visible; the orchestrator should rule on which is canonical rather than letting the implementation choose."
    - "CONCEPT ID — no canonical id exists for the composite figure, so conceptId is set to the primary organism it presets (cosmology-core), with archive-tree declared as the composed secondary. If the composite warrants its own registry entry the orchestrator should assign one; this passport does not create canon."
    - "COORDINATE — coordinateAssignment stays null. ADR-0010's concept assignment law requires creator approval plus a defined relation, sources, consequences, memory writes, Y contribution and epistemic/rights/cultural status before any A-Y letter is assigned, and no canonical source assigns one here. Note the specific trap this scene invites: ADR-0010 calls A 'the source invariant' and Y 'RETURN / +infinity'. A scene named SOURCE SPHERE whose exit action is called RETURN_TO_CORE must not be assigned A or Y on the strength of its name. Its use of both words is scene-local."
    - "DEPENDENCY — FOLLOW_FLOW cannot be implemented before KOD-28 (JourneyState + EventTrace) lands, because idempotent replay by event identity is what keeps the memory write from double-writing."
    - "WHY performanceRisk IS HIGH RATHER THAN MEDIUM. (1) The shader gap is the dominant factor: both of cosmology-core's canonical treatments are unimplemented, and a faithful pixel-sort needs a multi-pass sorting network rather than a single fullscreen pass, which would multiply the existing six-pass cost. (2) Element count exceeds FIELD OF EYES: at the full profile the sphere is exactly 39 nodes plus 39 flow edges plus 3 shell rings plus the core, 82 animated SVG elements, on top of the 44 elements the shipped runtime already writes CSS custom properties to every frame. Per-element updates must be restricted to transform and opacity, batched in a single write phase, never interleaved with reads. (3) Continuous shell rotation means every node's transform changes every frame, unlike FIELD OF EYES where nodes were static between commits — this is a genuinely higher steady-state cost and is the reason the depth wash should be dropped for v1. (4) Curved flow edges must animate by stroke-dashoffset or transform only, never by recomputing path d attributes per frame. (5) Committed paths accumulate for the session and are never removed, so their draw cost must stay O(committed) with no full-sphere repaint per commit. (6) Far-side dimming and scaling must be computed from the rotation phase arithmetically, not by hit-testing or sorting nodes per frame. (7) token performance.maxActiveHeavyCanvases is 1, so the depth wash and any other heavy canvas on the same route are mutually exclusive. (8) The listener leak and render-loop resurrection recorded below become compounding performance failures, not merely correctness ones, if the scene is mounted more than once."
    - "IMPLEMENTATION PACKET RECOMMENDATION — split into three packets, in this order. (a) C2, producer BOUNDED_CODING_AGENT, reviewer LONG_CONTEXT_ARCHITECT: extract SourceSphere as a DOM/SVG organism preset with an explicit destroy(), seeded shell and flow-graph generation enforcing the four symmetry rules as invariants with unit tests, the open/follow state machine, the keyboard model, and NO WebGL layer at all. This is the whole scene and it is shippable, because L0 carries no data. (b) C1, MULTIMODAL_VISUAL_SPEC: visual and cultural review against reviewChecks at the three target captures, after (a), with the symmetry and Mapuche-boundary checks performed by a reviewer who has seen WenuSigil.astro rendered. (c) C2 or C3, separate and optional: implement thermal-map and pixel-sort as real shaders and attach the depth wash, only if the orchestrator wants the canonical fx_chain honoured. Do not bundle (c) into (a) — it is the expensive half and the scene does not need it. Do not issue (a) until provenance questions 1 and 2 are answered, because the organism-composition decision changes which state vocabulary the code implements."
    - "DEFECT 1 FOUND IN EXISTING CODE — reported, not fixed, since this packet may not edit runtime code. src/components/kodex/scenes/kodex-observe-v2-client.ts bindEvents() adds addEventListener('resize', () => this.resize()) and document.addEventListener('visibilitychange', ...) as inline arrow functions that cannot be removed, and the class has no destroy() or dispose(). stop() only cancels the animation frame and clears timeouts. Two consequences, the second worse than the first: mounting a second scene leaks listeners and a WebGL context; and because the visibilitychange handler calls this.start() unconditionally when the document becomes visible, an unmounted or intentionally stopped runtime will resurrect its own render loop the next time the user switches back to the tab. This is a zombie-render defect, not only a leak."
    - "DEFECT 2 FOUND IN EXISTING CODE — src/components/kodex/CosmologyMap.astro. Its header comment states 'Non-blocking: falls back to a legible list layout on <640px.' There is no 640px breakpoint anywhere in the file and the SVG map never becomes a list; the only media query is at max-width 820px and it merely collapses the stage grid to one column. The <ol role='list'> that exists is the separate ecosystem-portals panel, not a fallback for the map. The accessibility promise in the comment is not implemented. This passport's screenReaderAlternative specifies the list structure that comment describes, and it must be built rather than assumed."
    - "DEFECT 3 FOUND IN EXISTING CODE — src/components/kodex/CosmologyMap.astro node interaction is pointer-only. The nodes are SVG <g> elements with a .kdx-cosmo__nodes g:hover rule that changes circle radius and fill, with no tabindex, no focus rule and no :focus-visible equivalent, inside an svg carrying role='img' and a single title. That violates the protocol's 'Pointer discovery is never the only way to access a semantic action.' It is currently harmless because the hover carries no semantic action, but the pattern must not be carried into SOURCE SPHERE, where nodes ARE the semantic action."
    - "DEFECT 4 FOUND IN EXISTING CODE — the OBSERVE V2 dossier renders generated SIGNAL, FOCUS, ANOMALY and LATENCY percentages with no non-factual marker. This passport requires such a marker for SOURCE SPHERE and it is worth backporting. Recorded independently in the FIELD OF EYES passport; repeated here because it is unresolved."
    - "EVIDENCE — sources actually inspected are listed field by field in sourceRefs, and every file named there was read in this session. Sources looked for and NOT found: any SOURCE SPHERE concept or reference image; any file naming SOURCE SPHERE other than KOD-40.yaml; any thermal-map, pixel-sort, dither-matrix, bitmap-threshold or glitch-fracture shader; any canonical A-Y letter assignment for this concept; any manifest volume named as a sphere (the string 'esfera' appears zero times in the manifest). The R2 bucket is the one source located but deliberately not opened, and it is marked as such."
