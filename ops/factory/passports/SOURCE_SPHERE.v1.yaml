schema_version: 1
visual_passport:
  passportId: "KDX-VP-SOURCE-SPHERE-V1"
  conceptId: "cosmology-core"
  title: "SOURCE SPHERE"
  status: "DRAFT"

  semanticPurpose: >-
    Compose the canonical `cosmology-core` organism (manifest `organismos[07]`, role "relaciones planetarias
    (registro macro / llave de arquetipos)", states IDLE / ORBITING / EXPAND, verbs orbit / connect / expand)
    as a shell-and-core body whose interior carries the branching flow of the canonical `archive-tree` organism
    (`organismos[04]`, role "memoria y conexión (hub / capítulo-madre)", states DORMANT / GROWING / TRANSMIT,
    verbs grow / connect / transmit). The scene names the KODEX volume literally called THE SOURCE —
    `lore-1-la-fuente`, "La Fuente", Codex Estelar Book I chapter I — whose own canonical resonances are
    `threshold-portal` and `cosmology-core`. Where COSMOLOGY reads relations at macro scale and TREE reads
    memory at micro scale, SOURCE SPHERE stages the two as one figure, on the authority of the existing
    hermetic volume `herm-tabla-esmeralda`, which states the identity in exactly those terms: "TREE (micro) vs
    COSMOLOGY (macro): everything is the same." The visitor does not receive the source; the visitor chooses
    one shell, follows one branch of flow out of the core, and opens the single record at its end. Everything
    else is atmosphere.

  nodeQuestion: >-
    If everything in the archive branches out of one core, which single branch will you follow far enough to
    open what is actually at the end of it — and what does the archive keep of that choice?

  coordinateAssignment: null

  sourceRefs:
    - id: "kodex-minus-infinity ops/factory/packets/KOD-40.yaml (KDX-WP-VISUAL-03)"
      relation: "PRIMARY_CONCEPT"
      rightsStatus: "CLEAR"
      notes:
        - "The string SOURCE SPHERE occurs in no other file of kodex-minus-infinity or wenu-frontend. Verified by case-insensitive full-tree grep of both repositories; KOD-40.yaml is the only hit."
        - "The packet's source_inputs name 'actual SOURCE SPHERE concept/reference images available to the visual worker'. No such image set reached this worker. No image of any kind was inspected in producing this passport."
        - "This passport is therefore derived entirely from canonical text and shipped code that genuinely exist and are listed below."
    - id: "kodex-minus-infinity design/KODEX_VOICE_AND_SCENE_MESSAGE_SYSTEM.md"
      relation: "PROVENANCE"
      rightsStatus: "REFERENCE_ONLY"
      notes:
        - "This is the only canonical evidence in either repository that a sphere scene is intended. Its 'Reference qualities to preserve' list item 7 reads: 'repeated convergence into eye, sphere, torus, lattice and white expansion', and item 8 'a progression from obscurity to radiance'. Item 1 is 'a dark field with one dominant luminous object'."
        - "The same document states the copying rule directly: 'This document translates the sensory qualities observed in the privately supplied video reference into an original KODEX system. The reference itself is not redistributed. KODEX must not copy its wording, imagery or identity.' The reference video did not reach this worker and must not be sought, reproduced or approximated."
        - "It is also the source of the KODEX Voice prohibitions honoured below, including 'use another culture's sacred language as decoration' and 'claim to read energy, consciousness, frequency or biology'."
    - id: "wenu-frontend public/kodex-content/manifest.json — organismos[07] cosmology-core"
      relation: "PRIMARY_CONCEPT"
      rightsStatus: "CLEAR"
      notes:
        - "Canonical organism 07. rol: 'relaciones planetarias (registro macro / llave de arquetipos)'. estados: IDLE / ORBITING / EXPAND. verbos ES: orbita, conecta, expande. EN: orbit, connect, expand."
        - "Canonical fx_chain: [thermal-map, pixel-sort]. Canonical audio routing: mid+high+parallax. Declared palette #FF2CF0, #903CFF, #00F7FF, #0A0A0A."
        - "NEITHER treatment in this organism's canonical fx_chain exists as a shader in the implementation repository. See implementation.dependencies and the shader-gap note."
    - id: "wenu-frontend public/kodex-content/manifest.json — organismos[04] archive-tree"
      relation: "PRIMARY_CONCEPT"
      rightsStatus: "CLEAR"
      notes:
        - "Canonical organism 04. rol: 'memoria y conexión (hub / capítulo-madre)'. estados: DORMANT / GROWING / TRANSMIT. verbos ES: crece, conecta, transmite. EN: grow, connect, transmit."
        - "Canonical fx_chain: [dither-matrix, bitmap-threshold]. Audio routing: low+mid+feedback, 'cada hoja es un archivo'. Declared palette #A6FF00, #E8E8E8, #0A0A0A."
        - "Supplies the packet's 'tree-flow' requirement. It is an ARCHIVE tree — a memory-and-connection hub — and canonically not a world tree, a tree of life or any cosmological axis. See provenanceBoundaries."
    - id: "wenu-frontend public/kodex-content/manifest.json — volumes lore-1-la-fuente"
      relation: "PRIMARY_CONCEPT"
      rightsStatus: "CLEAR"
      notes:
        - "'La Fuente' / 'The Source'. The only KODEX volume whose title is the word SOURCE. registro: ficcion. marco: ficcion. paleta: neon. categoria: cosmic origin."
        - "resonancias: [threshold-portal, cosmology-core, libro-kodex-estelar-1, doc-evolucion-cosmica, cos-01-origen, pixel-sort]. This is the evidentiary link from the word SOURCE to the organism this passport presets."
        - "Curaduria: 'The primordial consciousness that knows itself: the first pulse of vibration that fecundates every form. Book I chapter I. **Register: fiction.** KODEX ESTELAR myth, named as such: not history, not science, not health.'"
        - "Because this volume is registro ficcion, SOURCE SPHERE's register is DECIDED, not open: the scene sits in the marked-fiction register with the neon palette. This is the one question FIELD_OF_EYES had to leave open and that this passport can close on evidence."
    - id: "wenu-frontend public/kodex-content/manifest.json — volumes herm-tabla-esmeralda"
      relation: "RESEARCH"
      rightsStatus: "CLEAR"
      notes:
        - "registro: esoterico. paleta: neon. Curaduria: 'As above so below: the hermetic principles of micro-macro. TREE (micro) vs COSMOLOGY (macro): everything is the same.'"
        - "This is the only canonical statement that licenses composing archive-tree with cosmology-core in one figure. It is a SEMANTIC identity claim, not an engine-architecture rule — see the composition provenance question in notes."
        - "registro esoterico is defined in sistemas.registro_vocabulario as 'Simbólico/hermético: marcado como creencia o práctica, nunca como hecho ni medicina.' Both anchors are non-documented and neon, so they do not blend registers with one another."
    - id: "wenu-frontend public/kodex-content/manifest.json — sistemas.gramatica"
      relation: "DESIGN_SYSTEM"
      rightsStatus: "CLEAR"
      notes:
        - "'un motor (KDX CORE) + una suite de 8 tratamientos GPU (KDX FX SUITE), 8 organismos = presets data-driven. Cualquier tratamiento se aplica a cualquier organismo (combinaciones infinitas).'"
        - "This is the authority for specifying SOURCE SPHERE as a data-driven preset rather than a new renderer. Note what it does and does not say: it licenses any TREATMENT on any ORGANISM. It does not explicitly license composing two organisms in one scene."
    - id: "wenu-frontend public/kodex-content/manifest.json — sistemas.registro_vocabulario and top-level note"
      relation: "PROVENANCE"
      rightsStatus: "CLEAR"
      notes:
        - "note: 'Dos registros siempre marcados: DOCUMENTADO (paleta marca) y MITO/FICCIÓN (paleta neon). Mapuche y Codex Estelar NUNCA se mezclan.'"
        - "registro ficcion: 'Lore/ficción de autor, presentado como tal. Nunca se mezcla con lo documentado ni con lo mapuche.'"
        - "registro mito: 'Ficción / esotérico / lore marcado como tal, sin claims. Nunca se mezcla con lo documentado.'"
        - "Volume register census taken by this worker: documentado 1352, ficcion 65, estructura 6, esoterico 4, across 1427 volumes."
    - id: "wenu-frontend public/kodex-content/manifest.json — volumes doc-wenu-mapu and doc-we-tripantu"
      relation: "PROVENANCE"
      rightsStatus: "REFERENCE_ONLY — DOCUMENTED MAPUCHE RECORD, MUST NOT BE TOUCHED BY THIS SCENE"
      notes:
        - "doc-wenu-mapu is the declared 'root volume of the documented record'. registro documentado, paleta marca, review: false. Cited to Canio Llanquinao, M. & Pozo Menares, G. (2015), Wenumapu: astronomía y cosmología mapuche, Ocho Libros, ISBN 978-956-335-205-4."
        - "Its resonancias include cosmology-core — the same organism this passport presets. That is the collision risk this passport exists to fence off."
        - "doc-we-tripantu, same citation, is described as 'Return of the light, winter solstice (June 21): renewal, cleansing, beginning and return.' A scene about source, light, origin and return anchored in Codex Estelar fiction sits directly on top of that documented Mapuche material and must not absorb it."
        - "Located and read as text. No Mapuche visual, term or cosmological structure is used anywhere in this passport."
    - id: "wenu-frontend public/kodex-content/manifest.json — volumes book-ocin-arte-digital-ritual and fx_chain_nota"
      relation: "PROVENANCE"
      rightsStatus: "REFERENCE_ONLY — AUTHOR'S FINISHED WORK"
      notes:
        - "The only manuscript-class object in KODEX: 'OCÍN — Arte Digital Ritual (81 láminas)', a monograph of 81 plates. registro documentado, paleta 'libro'. 'the archive that remembers'."
        - "Every organism record carries fx_chain_nota: 'Se aplica SOLO a fotos/derivados, NUNCA a la obra terminada de Ocin (specimens limpios).' Treatments may never be applied to the finished plates."
        - "This is the manuscript reference the packet asks about. It is a living author's copyrighted body of work, not an antiquarian codex."
    - id: "wenu-frontend public/kodex-content/manifest.json — volumes fic-razas-estelares-iconografia"
      relation: "PROVENANCE"
      rightsStatus: "REFERENCE_ONLY"
      notes:
        - "The standing KODEX position on iconography drawn from living traditions. registro ficcion, paleta neon, review: false."
        - "'Where an image comes from a living tradition it is named as a borrowing from the imaginary, not as its doctrine.' review_nota records that its resonances touch no documented volume of Mapuche root."
        - "SOURCE SPHERE inherits this governance rather than inventing its own."
    - id: "wenu-frontend public/kodex-content/manifest.json — volumes doc-geometria-sagrada"
      relation: "RESEARCH"
      rightsStatus: "CLEAR"
      notes:
        - "registro documentado. fuente: 'Matemática documentada.' 'Real mathematics: Fibonacci, the golden ratio phi, flower of life, platonic solids. The PHI LOCK (0.618) that reappears in THRESHOLD and COSMOLOGY.'"
        - "This is the licence for using Fibonacci ratios as a composition device below. It is used as ARITHMETIC ONLY and carries no claim. The separate fiction volume lore-1-geometria-sagrada is NOT used and must not be invoked."
    - id: "wenu-frontend public/kodex-content/manifest.json — volumes cos-01-origen, cos-02-atomos, cos-03-estrellas"
      relation: "PROVENANCE"
      rightsStatus: "REFERENCE_ONLY — DOCUMENTED SCIENCE, SEPARATE REGISTER"
      notes:
        - "registro documentado, fuente 'Eric Chaisson · evolución cósmica'. cos-01-origen: 'A hot point of energy that expands. Not an explosion in space: the expansion of space itself.'"
        - "cos-01-origen's resonancias include lore-1-la-fuente, so the manifest already links documented cosmology to the fiction Source volume as RESONANCE. Resonance is not blending: the two remain separate volumes with separate registers and separate palettes."
        - "SOURCE SPHERE must not present any of this documented cosmology as its own content. If a real cosmological fact ever appears in this scene it needs its own documented marking and its own source line."
    - id: "wenu-frontend src/components/kodex/scenes/kodex-observe-v2-client.ts"
      relation: "REFERENCE"
      rightsStatus: "CLEAR"
      notes:
        - "KdxObserveV2Runtime, 732 lines, read in full in the relevant sections. WebGL2 six-pass pipeline source -> displace -> threshold -> chroma -> feedback -> crt with ping-pong framebuffers over a fullscreen triangle."
        - "Pointer normalization: rect-relative, scaled by 2, offset by -1, y negated; pointer.activeUntil = now + 1400ms. locked auto-advances to observing after 820ms via a tracked timeout."
        - "resolveProfile(): ?profile= override, else low-power if prefers-reduced-motion, low-power if max-width 760px and dpr > 2, balanced if max-width 760px, else balanced if dpr > 1.65, else full."
        - "?fallback=1 forces the DOM path, ?debug=1 shows the debug panel, ?state= forces a state. All verified in source."
        - "Adopted read-only as the engine reference. Not modified. See the two defects recorded in notes."
    - id: "wenu-frontend src/kodex/observe-v2/shaders/ (7 files)"
      relation: "REFERENCE"
      rightsStatus: "CLEAR"
      notes:
        - "Present and read: fullscreen.vert.glsl, source.frag.glsl (139 lines), displace.frag.glsl, threshold.frag.glsl, chroma.frag.glsl, feedback.frag.glsl, crt.frag.glsl."
        - "NAMING COLLISION WARNING for the implementer: source.frag.glsl is the pipeline's first PASS, not the SOURCE concept. They are unrelated. Do not conflate them."
        - "Treatment coverage actually verified by reading each shader: crt-scan -> crt.frag.glsl (present); chromatic-split -> chroma.frag.glsl (present); memory-feedback -> feedback.frag.glsl (present); dither-matrix and bitmap-threshold -> threshold.frag.glsl only PARTIALLY (it is one combined Bayer-dither-plus-threshold pass with a hardcoded 4x4 matrix, while the canonical dither-matrix declares pattern 'Bayer 8x8', dither_scale 4, contrast 1.25, color_quant true, and canonical bitmap-threshold declares edge_width, posterize, crush and invert, none of which the shader exposes)."
        - "thermal-map: NO SHADER EXISTS. pixel-sort: NO SHADER EXISTS. glitch-fracture: NO SHADER EXISTS."
        - "Consequence: BOTH treatments of cosmology-core's canonical fx_chain are missing, and archive-tree's chain is only partially covered by one approximate shader. This is the single largest cost item in the implementation packet."
    - id: "wenu-frontend src/components/kodex/scenes/KodexObserveV2Scene.astro"
      relation: "REFERENCE"
      rightsStatus: "CLEAR"
      notes:
        - "Shell grid: header / left rail / scene code / hero block / visual shell / data stack / right rail / meta row / footer. Reused as layout."
        - "Already contains a shell-and-core DOM structure that this scene should adopt rather than reinvent: .kdx-observe-v2__phenomenon-core with children __core-ring, __core-ring--inner, __core-pulse (plus __core-eye and __core-pupil, which belong to observation-eye and are NOT used here)."
        - "Also contains a glyph layer using KodexGlyph name='orbit' and name='nodeRing', and an always-rendered DOM fallback field at [data-kdx-fallback]."
    - id: "wenu-frontend src/components/kodex/CosmologyMap.astro"
      relation: "REFERENCE"
      rightsStatus: "CLEAR"
      notes:
        - "A shipped, purely-SVG orbital map: 500x500 viewBox, radial core gradient, two dashed shell circles at r=150 and r=220, six concept nodes on lines from the centre, and a separate <ol role='list'> of five ecosystem portals."
        - "Proves the shell/core figure can ship as accessible SVG with no WebGL at all. Adopted as the structural precedent for the DOM/SVG layer of this passport."
        - "Two defects found in it are recorded in notes; both are reasons this passport specifies keyboard and list behaviour explicitly rather than assuming the precedent is safe to copy wholesale."
    - id: "wenu-frontend src/components/kodex/motion/OrbitEngine.astro and ParticleField.astro"
      relation: "REFERENCE"
      rightsStatus: "CLEAR"
      notes:
        - "OrbitEngine.astro is a thin aria-hidden wrapper div with variant/scene props and a slot — a container, not a renderer. ParticleField.astro is a single labelled canvas element. Both are shells to be filled, so neither reduces the implementation cost materially. Recorded so the implementation packet is not over-credited."
    - id: "wenu-frontend src/kodex/observe-v2/config.ts"
      relation: "REFERENCE"
      rightsStatus: "CLEAR"
      notes:
        - "States idle/aware/locked/observing, bilingual per-state copy, and OBSERVE_V2_PROFILE_SCALE with dpr 1.5 / 1.25 / 1.0 and particle scale 1.0 / 0.76 / 0.44. Structure reused; SOURCE SPHERE supplies its own strings."
    - id: "kodex-minus-infinity design-system/tokens/kodex.tokens.json"
      relation: "DESIGN_SYSTEM"
      rightsStatus: "CLEAR"
      notes:
        - "Authoritative colour, space, line, duration, easing, layout and performance tokens used throughout this passport."
        - "Its own notes include 'Color may not carry essential meaning alone' and 'Typography families are intentionally omitted until font rights are approved'. Both are honoured below."
        - "performance tokens read and applied: maxActiveHeavyCanvases 1, mobileDprCap 1.2, desktopDprCap 1.65, highPriorityMotionMax 2. layout.touchTargetMin 44px."
    - id: "kodex-minus-infinity schemas/session-memory.schema.json"
      relation: "DESIGN_SYSTEM"
      rightsStatus: "CLEAR"
      notes:
        - "Read in full. Defines entitiesTraced, relationsTraced, sourcesOpened, artifactSeed, accessibility {motion, sound, contrast, textScale} and consent. The memory write below uses entitiesTraced, which is distinct from the relationsTraced key claimed by FIELD_OF_EYES."
    - id: "kodex-minus-infinity docs/decisions/ADR-0010-ALPHABETIC-MULTIVERSE-A-M-Y.md"
      relation: "RESEARCH"
      rightsStatus: "CLEAR"
      notes:
        - "Concept assignment law: a letter is assigned only with creator approval plus defined relation, sources, consequences, memory writes, Y contribution and epistemic/rights/cultural status. None exists for SOURCE SPHERE, so coordinateAssignment stays null."
        - "'Passive pointer movement alone cannot make identity claims or write consequential personal memory.' This governs the atmospheric/consequential split below."
        - "Return-anchor law ('leaving M restores the exact prior node, focus, state and route anchor') and mutated-revisit K-prime behaviour govern exitBehavior."
        - "Explicit warning taken from this ADR: A is 'the source invariant' and Y is 'RETURN / +infinity'. SOURCE SPHERE is NOT A and is NOT Y. It must not be routed as either, and its use of the words source and return is scene-local, not topological."
    - id: "kodex-minus-infinity canon/KODEX_EPISTEMIC_STANDARD.md"
      relation: "RESEARCH"
      rightsStatus: "CLEAR"
      notes:
        - "Claim classes, metric admission requirements and the prohibited pseudo-metrics list — which explicitly names 'CONSCIOUSNESS 700', 'COSMIC COHERENCE 94%', 'ARCHIVE ENERGY 87.3%', 'RETURN SIGNAL 8.42 Hz', 'EMOTIONAL FREQUENCY 540'. Three of those five are exactly the readouts a scene named SOURCE SPHERE would invite. None may appear."
        - "Visual truthfulness rules applied: 'Particle density cannot imply a count unless particles encode units' and 'Animation cannot manufacture a trend'."
    - id: "kodex-minus-infinity ops/factory/VISUAL_PASSPORT_PROTOCOL.md"
      relation: "DESIGN_SYSTEM"
      rightsStatus: "CLEAR"
      notes:
        - "Production contract. Its no-pseudo-telemetry, cultural provenance, interaction equivalence and disposal/lifecycle requirements are answered field by field below."
    - id: "wenu-frontend _macmini-kodex-rescue/src/components/WenuSigil.astro"
      relation: "PROVENANCE"
      rightsStatus: "REFERENCE_ONLY — BRAND EMBLEM, DO NOT REPRODUCE OR APPROXIMATE"
      notes:
        - "Read for the boundary only. Self-described: 'Simetría rotacional de 4 (Meli Witran Mapu / 4 direcciones): cuatro brazos creciente-garra en molinete horario, estrella-brújula de 8 puntas al centro, cuatro dagas cardinales con puntos, enmarcado por anillos de instrumento.' Declared 'Diseño ORIGINAL — no es calco de ninguna referencia' and 'la ÚNICA fuente de verdad del emblema'."
        - "It is a 4-fold cardinal figure with an 8-point centre star inside instrument rings — geometrically very close to what a naive SOURCE SPHERE would produce. The symmetry rules in geometry.topology exist to keep this scene visibly distinct from it and from the Meli Witran Mapu structure it references."
        - "It lives under _macmini-kodex-rescue/, which is not imported by any live source file in wenu-frontend. Treated as archive, not as shipping code."
    - id: "R2 bucket pub-2b4562c758ed440ab047fe9523a2d99c.r2.dev/kodex-content/art/"
      relation: "REFERENCE"
      rightsStatus: "UNKNOWN"
      notes:
        - "Bucket referenced by manifest cover URLs. Located but deliberately NOT opened by this worker. No image was inspected."
