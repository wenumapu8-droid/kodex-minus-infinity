      - "Spherical energy boundaries and nested shells"
      - "Tree-flow/root structures branching from a core"
      - "Core-and-shell as generic information design: one origin, ordered rings of increasing distance, branching connections outward. This is the shared structure of orbital diagrams, dendrograms and radial trees and belongs to no one."
