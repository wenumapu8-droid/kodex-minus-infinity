        - "proposition verbatim: 'La herencia es dato antes que simbolo. El ascenso no niega la biologia: la lee dos veces.' — adopted verbatim as nodeQuestion, replacing the iMac lineage's paraphrase."
        - "visualAnchor: kind 'dual-reading', role 'dominant-phenomenon', label 'Una misma estructura en capa verificada y capa simbolica, distinguibles'. THIS IS THE CENTRAL CANONICAL INSTRUCTION FOR THE SCENE: one and the same structure, shown in a verified layer and a symbolic layer, distinguishable. It is the node-level statement of the same two-layer rule the manifest volume fic-diseno-humano-adn states as 'Nunca se funden'."
