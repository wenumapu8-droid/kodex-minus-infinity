  provenanceBoundaries:
    mayAbstract:
      - "The double helix as a generic geometric primitive: two phase-offset helical curves about a shared axis with transverse connectors. The form is not owned by anyone; only a specific rendering of it could be."
      - "The scale-ladder composition already shipped in ManifestoSpiral.astro — a vertical traversal whose stations move between orders of magnitude — reused as structure, with this scene's own station set and copy."
      - "The organism's own canonical vocabulary: states DORMANT / DESCEND / ABSORB and verbs accelerate / distort / absorb."
      - "The perfect-loop discipline and transparent-canvas method of PROTO-CANVAS-001 (phase exactly 0 -> 2pi, ctx.clearRect per frame, painter z-sorting)."
      - "The progressive-enhancement pattern already proven in both repositories: a hand-coded static/SVG layer always rendered, the heavy engine attached only when capability allows."
      - "The bilingual ES/EN station copy pattern, and the register-marking pattern (documentado = brand palette, ficcion = neon palette) that canon already applies to every volume."
    mustNotCopy:
      - "No external reference image reached this worker. Therefore no external artwork, frame, figure, poster or layout may be reproduced. This boundary is stated conservatively on purpose: nothing external may be reproduced because nothing external was seen."
      - "Do not reproduce a specific published scientific figure of DNA — no recreation of the Franklin Photo 51 X-ray diffraction pattern, and no redraw of a particular journal or textbook plate. If a real structural figure is ever wanted, it must be sourced, rights-cleared and cited first."
      - "Do not render a real, identifiable genomic sequence. No ACGT letter run, no chromosome ideogram, no accession number, no barcode-style sequence texture. Invented letters are pseudo-telemetry; real letters are somebody's data. Both are forbidden by default."
      - "No human body, face, silhouette or medical-scan imagery attached to the helix. The lore speaks of 'tu ADN' and 'tu cuerpo'; the scene must not personalize that onto the visitor or onto any identifiable person."
      - "Do not reproduce the kultrun drumhead, its four-direction cross, its choike terminals or its Antu / Kuyen / Melipal / Wuñelfe quadrant motifs into DNA PASSAGE. They belong to the Mapuche documented register and are the subject of an unresolved citation gap (PROVENANCE QUESTION 3); they must not be carried into a scene whose subject sits in the fiction register."
      - "FX treatments must never be applied to Ocin's finished specimen artwork. Per the manifest's fx_chain_nota, treatments apply only to photographs and derivatives, never to the completed work."
    culturalSensitivity:
      - "REGISTER IS THE WHOLE PROBLEM HERE, and it must be ruled before implementation. The manifest states 'Mapuche y Codex Estelar NUNCA se mezclan' and defines the ficcion register as one that 'Nunca se mezcla con lo documentado ni con lo mapuche'. The sacred-DNA material that gives this concept its meaning is Codex Estelar Libro IV — registro ficcion, paleta neon. DNA PASSAGE must therefore sit in the FICTION register, with the neon palette and explicit fiction marking, and must not borrow Mapuche cosmology."
      - "This matters because the only shipped 3D version of the passage does exactly what canon forbids: ManifestoSpiral3D.astro places 'XII · The cosmic code' — the DNA station — inside a fourteen-station Mapuche cosmology (Wenu Mapu, Nag Mapu, Meli Witran Mapu, Itrofill Mongen, Minche Mapu, Kutral/Kuruf/Ko/Kura). DNA PASSAGE must not inherit that arrangement by default. The orchestrator must rule; see PROVENANCE QUESTION 2."
      - "Mapuche material in KODEX is a DOCUMENTED register that requires citation. Canon's own documented volumes cite their sources, and COWORK-BRIDGE records the rule as 'mapuche=documentado citado (Canio & Pozo), review:true donde no verifique'. ManifestoSpiral3D asserts an 'authentic kultrun' with no source named anywhere in the file. That gap must be closed in its own packet and must not be replicated here."
      - "Do not substitute generic 'ancestral', 'tribal' or 'sacred geometry' motifs for the material this scene may not use. The lore text itself names Flower of Life, Metatron's cube and the Platonic solids; these are esoteric-tradition motifs and, if used at all, are marked fiction-register symbols, never presented as mathematics, physics or anatomy."
      - "The Merkabah, the light body and prana breathing appear in the same book as the sacred DNA. They are attributed spiritual material. They may be preserved as symbolic discourse, per the epistemic standard, but never rendered as physiology and never as instruction."
      - "'DNA activation' is a real-world pseudo-medical claim. The lore's 'los códigos dormidos del ADN se encienden' may exist in the scene only as marked fiction. It must never be phrased as something the visitor can do, receive or measure. The manifest's own nota_registro already binds this: 'sin claims de hecho ni de salud.'"

  informationHierarchy:
    primary: >-
      The station the visitor currently occupies on the passage, its register mark (DOCUMENTED or FICTION),
      and whether the geometry visible at that station belongs to the biological layer or the symbolic layer.
    secondary:
      - "The two helix strands and their base-pair connectors as the continuous form that carries the whole traversal."
      - "The visitor's position along the passage, shown as a non-numeric progress rail plus a named station index."
      - "The source record behind the current station, and whether it has been opened."
    tertiary:
      - "Ambient depth: starfield, drift, glow and grain. Atmosphere only; carries no data and is fully removable."
      - "Bilingual station copy and the closing line."
      - "Navigation and skip affordances."

  geometry:
    primitives:
      - "helix strand = a parametric curve about a single vertical axis; two instances at a declared phase offset. Rendered as a stroked path (SVG/static) or a swept ribbon (WebGL)."
      - "base-pair connector = a transverse segment joining the two strands at a sampled parameter, with a terminal mark at each strand end"
      - "groove = the negative space between successive strand crossings; a first-class element because groove EQUALITY versus INEQUALITY is what separates the two geometric layers"
      - "passage axis = the invisible vertical line both strands wind around; the traversal path and the camera/scroll track"
      - "station node = a discrete marked position on the axis carrying a label, a register mark and a source affordance"
      - "layer boundary = an explicit visible transition where the biological layer ends and the symbolic layer begins; never a crossfade"
      - "depth field = starfield and ambient wash behind everything; atmosphere only, token color.field.obsidian ground"
    topology: >-
      An OPEN, SINGLE-AXIS HELICAL PASSAGE — not a graph, not a closed loop, not a spiral in the plane. Two
      helical curves wind about one vertical axis; the visitor travels along that axis. The traversal is
      one-dimensional and BIDIRECTIONAL: it must be possible to move backward as freely as forward, and to
      leave from any station. Station spacing along the axis is deliberately IRREGULAR so the passage cannot be
      read as a progress bar with equal steps, and the station count is a scene constant that never varies with
      viewport (unlike the base-pair count, which may). A radial or concentric arrangement is rejected because
      it would place the visitor at a single centre, which contradicts a passage. A closed loop is rejected
      because it would imply the journey must be completed to return, which contradicts ADR-0010.
      THE TWO GEOMETRIC LAYERS ARE DEFINED HERE AND ARE THE HEART OF THIS PASSPORT.
      LAYER B — BIOLOGICALLY RECOGNIZABLE. Permitted ONLY where the object is explicitly labelled as the
      molecule, and then it must actually be B-DNA: right-handed; approximately 10.5 base pairs per full turn;
      strand phase offset approximately 140 degrees / 220 degrees (NOT 180), which is what produces the unequal
      major and minor grooves; antiparallel strands; pitch-to-diameter ratio approximately 3.4 to 2.0, i.e.
      about 1.7. Claim class OBSERVED, attributable to structural biology. If any of these is not met, the
      object is NOT biologically recognizable and MUST NOT be labelled, captioned or narrated as DNA.
      LAYER S — SYMBOLIC. Everything else: the golden double spiral floating in space that the lore text names
      as its 'Símbolo Visual', the scale ladder, the Source, the toroid, the light body. Claim class
      MYTHOPOETIC. Layer S is free to use any phase offset, any base-pair density, any handedness and any
      amplitude envelope — precisely because it is not claiming to be the molecule.
      THE TWO LAYERS MUST NEVER BE BLENDED INTO ONE CONTINUOUS OBJECT. Canon: 'Nunca se funden.' Where the
      passage moves from one to the other it passes through an explicit layer boundary that the visitor can
      see and that a screen reader announces. Both layers may exist in the same scene; they may not exist in
      the same strand at the same moment without that boundary.
      NOTE ON THE SHIPPED GEOMETRY: both existing implementations use an exact 180-degree strand offset, giving
      equal grooves, and neither has 10.5 base pairs per turn (ManifestoSpiral ~15.5; ManifestoSpiral3D 8.1 on
      desktop and 4.5 on mobile). Both are therefore Layer S, correctly. Nothing in them needs to change; what
      must change is that neither may be captioned as biological DNA while it has that geometry.
    coordinateSystem: >-
      Passage-local coordinates. The axis parameter u runs 0 at the entry station to 1 at the final station and
      is the single source of truth for position; every station, camera position and reveal derives from u.
      Cross-section is normalized (x, z) in [-1, 1] with the axis at the origin, and the rendered amplitude is
      amp(u) * r_max where amp(u) is a scene-authored envelope. In the static/SVG path the same u maps to a
      viewBox y so the two paths agree station-for-station. Pointer, where used, is normalized to [-1, 1] with
      y negated, identical to the convention already implemented in kodex-observe-v2-client.ts, so no new input
      convention is introduced. Aspect correction is applied on the shorter axis so the helix cross-section
      never reads as an ellipse caused by the viewport.
    spatialLayers:
      - "L0 depth field — starfield and ambient wash. Atmospheric only, carries no data, fully removable."
      - "L1 far strand — the strand currently behind the axis, drawn first, reduced contrast."
      - "L2 base-pair connectors — drawn between the strands, depth-sorted so they read as passing behind and in front."
      - "L3 near strand — the strand currently in front of the axis, full contrast."
      - "L4 station layer — station nodes, labels, register marks and source affordances. The only interactive layer."
      - "L5 chrome — progress rail, station index, skip control, register legend, exit control."

  composition:
    focalStructure: >-
      Exactly one station is current at any moment, and the current station is what the scene is about. The
      helix is continuous through the whole passage but contrast is not: the current station and the two
      strand-turns immediately around it hold full contrast, while the rest of the passage drops to roughly 45%
      so the visitor always knows where they are without a numeric readout. The current station's register mark
      is always visible at full contrast, never faded, because register is the one thing that must never be
      ambiguous. The layer boundary, when one falls within view, is always drawn at full contrast regardless of
      distance from the current station.
    grid: >-
      A single vertical column. The passage occupies a centred column of at most 560px on the static path
      (matching the shipped #ms-wrap max-width) and token layout.worldShare (0.75) of the shell width on the
      WebGL path. Station labels alternate left and right of the axis to avoid a centred stack, exactly as the
      shipped SVG already does with its side parameter. Chrome sits outside the column and never overlaps the
      helix.
    depthModel: >-
      Painter's algorithm with depth by contrast and stroke weight — no perspective camera is required for the
      static path, and the WebGL path uses a shallow depth range only. Strand segments are z-sorted per frame,
      as PROTO-CANVAS-001 already does, so the two strands genuinely appear to wind around one another rather
      than crossing flat. Depth is reinforced by three channels at once: draw order, stroke weight (near strand
      up to 2x the far strand) and opacity. Pointer-linked parallax, where present, is capped at 3% of column
      width in total; the passage's depth must come from the geometry, not from the pointer.
    negativeSpace: >-
      The passage is mostly empty and must stay that way. At least 55% of the column remains unmarked. The
      helix amplitude never exceeds 0.42 of the column width, so the strands never touch the column edge and
      station labels always have clear space. No station may sit within 0.06 of u from another, and a margin of
      0.05 of u is kept clear at both ends so the entry and the exit are not clipped. Absence is informational
      here: where a station has no source record, the space stays visibly empty and is marked UNKNOWN rather
      than filled, per the epistemic standard's failure behaviour.
    responsiveRules:
      desktop: >-
        1024px and above: the full station set, the full base-pair density for the chosen layer, both strands
        at full contrast, chrome and register legend visible in the rail. Profile resolves to full or balanced
        per the existing resolveProfile() logic. Pointer parallax is atmospheric only; every consequential
        action still requires a commit. Reference capture at 1440x900.
      mobile: >-
        Below 760px the passage goes full-bleed in a single column with chrome collapsed into a bottom bar. The
        STATION COUNT AND ORDER DO NOT CHANGE — only density and effects scale, so the scene means the same
        thing on every device. Base-pair connector density may be reduced for legibility and fill rate, and
        this is exactly why connector count may never carry meaning. Station hit targets are at least 44x44 CSS
        px per token layout.touchTargetMin, which is the binding constraint on how close stations may sit; if
        44px cannot be met at 390x844, station spacing increases rather than the target shrinking. Below 360px
        the static path is served, matching the existing capability gate. No hover is required for any semantic
        action at any viewport. Reference captures at 390x844 and 412x915.

  paletteRoles:
    - role: "passage ground"
      semanticMeaning: "The archive at rest; the depth the passage descends through."
      tokenOrRange: "color.field.obsidian (#050608)"
      colorIsNotOnlyChannel: true
    - role: "symbolic strand — organic"
      semanticMeaning: "Layer S. The golden double spiral the lore text names as its Símbolo Visual. Mythopoetic, never a measurement."
      tokenOrRange: "shipped expression #c9a84c / #e8c766 (wenu ember). Token equivalent under review — see PALETTE CONFLICT in notes."
      colorIsNotOnlyChannel: true
    - role: "symbolic strand — informatic"
      semanticMeaning: "Layer S. The second strand as the cybernetic/informatic counterpart already shipped alongside the gold."
      tokenOrRange: "color.signal.cyan (#00E8F0); shipped expression #64e0d0 / #7fe9db"
      colorIsNotOnlyChannel: true
    - role: "biological layer"
      semanticMeaning: "Layer B. Geometry that is claiming to be the molecule, and therefore must satisfy the B-DNA constraints in geometry.topology."
      tokenOrRange: "color.text.onDark (#F0ECE3) on obsidian, deliberately achromatic to separate it from the neon fiction register"
      colorIsNotOnlyChannel: true
    - role: "register mark — fiction"
      semanticMeaning: "This station's material is Codex Estelar lore: not history, not science, not health."
      tokenOrRange: "color.signal.magenta (#FF1EAA) — the manifest's neon register"
      colorIsNotOnlyChannel: true
    - role: "register mark — documented"
      semanticMeaning: "This station's material is documented and cited."
      tokenOrRange: "color.text.mutedOnDark (#9A9992) — the manifest's brand register"
      colorIsNotOnlyChannel: true
    - role: "current station"
      semanticMeaning: "The single station the visitor occupies."
      tokenOrRange: "color.signal.livingRed (#FF3833)"
      colorIsNotOnlyChannel: true
    - role: "source opened"
      semanticMeaning: "A source the visitor deliberately opened and the session kept."
      tokenOrRange: "color.signal.violet (#7855D5)"
      colorIsNotOnlyChannel: true
    - role: "unresolved / unknown"
      semanticMeaning: "A station with no source record, or a claim the epistemic standard marks UNKNOWN or CONTESTED."
      tokenOrRange: "color.signal.orange (#FF7A00); descent-tunnel's own canonical palette also leads with #FF5A00"
      colorIsNotOnlyChannel: true
    - role: "layer boundary"
      semanticMeaning: "The visible seam where biological geometry ends and symbolic geometry begins."
      tokenOrRange: "color.signal.acid (#B9FF3B)"
      colorIsNotOnlyChannel: true

  typographyRoles:
    - role: "station label"
      behavior: >-
        Bilingual EN over ES, as the shipped SVG already does (Latin name above, uppercase mono ES below).
        Real DOM text at every viewport, never baked into a texture, never an image. Changes only on a station
        change, never on pointer movement.
    - role: "register mark"
      behavior: >-
        Mono, uppercase, letter-spaced, always adjacent to the station label and never removed at any
        breakpoint. Carries the literal words FICTION / FICCION or DOCUMENTED / DOCUMENTADO. It is a text label
        first and a colour second, so register survives monochrome, and it is never abbreviated to a glyph.
    - role: "layer label"
      behavior: >-
        Mono, uppercase. States which geometric layer is on screen in words — BIOLOGICAL GEOMETRY / GEOMETRIA
        BIOLOGICA or SYMBOLIC GEOMETRY / GEOMETRIA SIMBOLICA. Mandatory whenever Layer B is visible; a Layer B
        rendering without this label is a defect, because an unlabelled accurate helix invites the viewer to
        read the symbolic material around it as equally factual.
    - role: "chapter / passage position"
      behavior: >-
        Mono, uppercase, low contrast, fixed corner. Names the station, e.g. 'IV · THE SOURCE'. It must never
        show a percentage, a count, a coordinate, a frequency or any other number, because a mono uppercase
        string in a fixed corner is exactly the shape a visitor reads as telemetry.
    - role: "source citation"
      behavior: >-
        Reading-width prose, capped at token layout.maxReadingWidth (68ch). Shows the actual source record for
        the station, including its register and its limitations, or the visible words NO SOURCE RECORDED. Never
        auto-summarised into a claim.
    - role: "non-factual marker"
      behavior: >-
        Any generated value that ever appears — and none should — must be preceded by a persistent marker
        (EN 'SIMULATED', ES 'ATMOSFERA'). The shipped DNA passage displays no numbers at all, which is the
        better answer and is the one this passport requires: prefer no number to a marked number.

  motion:
    timescales:
      - "duration.micro (120ms) — station mark acquire, focus ring"
      - "duration.short (240ms) — station change, label swap, contrast step"
      - "duration.medium (600ms) — layer-boundary crossing announcement and its visual seam"
      - "duration.long (1600ms) — register change, entry and exit of the passage"
      - "duration.ambient (12000ms) — strand shimmer and depth drift base period"
      - "easing.standard for state changes, easing.enter for appearance, easing.exit for release, easing.linear only for the continuous strand shimmer"
    stateTransitions:
      - "DORMANT -> DESCEND: the visitor begins traversing. Maps to the organism's canonical second state. Atmospheric; nothing is written."
      - "DESCEND -> DORMANT: no input for 3200ms, matching the decay already implemented in kodex-observe-v2-client.ts. The passage does not reset position; only attention decays."
      - "DESCEND -> ABSORB: the visitor commits at a station (ANCHOR_STATION). Maps to the organism's canonical third state. Consequential."
      - "ABSORB -> DESCEND: the visitor resumes travelling. The anchored station remains marked."
      - "any -> layer boundary crossing: an explicit 600ms transition with its own announcement. This transition may never be skipped, shortened below 240ms, or crossfaded, because it is the mechanism that keeps the two layers distinct."
      - "any -> EXITED: the visitor leaves. Position and opened sources persist for the session."
      - "DNA PASSAGE introduces no parallel state machine. It uses the organism's own three canonical states and adds the layer-boundary crossing as a transition, not as a state."
    loopingBehavior: >-
      The passage itself does NOT loop — it is an open traversal with an entry and an end, and arriving at the
      end is not a completion (see interaction.exitBehavior). Only the ambient strand shimmer loops, and it
      does so seamlessly using the discipline proven in PROTO-CANVAS-001: phase runs exactly 0 -> 2pi over a
      fixed frame count so the loop closes with no visible seam. The shimmer must never travel in a way that
      implies flow, transcription, replication or any directional biological process, because animation cannot
      manufacture a trend. The render loop pauses when the scene leaves the viewport and on document
      visibilitychange.
    reducedMotion: >-
      No drift, no parallax, no shimmer, no travelling pulse, no smooth-scroll interpolation. Station changes
      become a single 240ms opacity and contrast step; the layer-boundary crossing remains but becomes an
      instant, clearly marked switch rather than a 600ms transition, because the boundary is information and
      may not be removed with the motion. Under prefers-reduced-motion the static path is served, which is
      already the shipped behaviour of the capability gate, and resolveProfile() already returns low-power.

  interaction:
    inputs:
      - "POINTER"
      - "TOUCH"
      - "KEYBOARD"
      - "TIME"
    semanticActions:
      - "ATMOSPHERIC — TRAVERSE: moving along the passage by scroll, drag, arrow key or the station index. Changes what is on screen and nothing else. Position is scene state, never a claim about the visitor, and it is not written to memory. Required by ADR-0010: passive movement alone cannot make identity claims or write consequential personal memory."
      - "ATMOSPHERIC — pointer parallax and ambient drift. Nothing is committed and nothing is written."
      - "CONSEQUENTIAL — ANCHOR_STATION: commit at the current station by click, tap, Enter or Space. Marks the station for the session. Writes nothing by itself."
      - "CONSEQUENTIAL — OPEN_SOURCE: open the source record behind the current station. This is the scene's only memory write, and it is deliberately the provenance action rather than the travel action, because the epistemic standard requires every canonical visualization to provide a route to inspect sources."
      - "CONSEQUENTIAL — EXIT_PASSAGE: Esc, the explicit exit control, or the skip-to-index control."
      - "EXPLICITLY NOT AN ACTION — scroll velocity, dwell time at a station, how far along the passage the visitor reached, whether they reached the end, how many stations they passed, pointer path shape, and time spent in either geometric layer. None of these may be recorded, scored, aggregated, ranked or used to infer anything about the visitor. In particular, depth reached is not achievement and must never be presented as one."
    stateChanges:
      - "Organism state advances DORMANT -> DESCEND -> ABSORB and decays DESCEND -> DORMANT on inactivity."
      - "The current station changes as the visitor traverses; exactly one station is current at any time."
      - "Crossing a layer boundary changes the active geometric layer and updates the mandatory layer label and the register mark together."
      - "ANCHOR_STATION marks the current station for the session; anchoring a new station does not clear previously anchored ones."
      - "OPEN_SOURCE marks the station's source as opened and appends to session memory."
      - "Reaching the final station changes nothing except that there is no further station. It does not set completionEligible, does not unlock anything, and does not write."
    memoryWrite:
      enabled: true
      key: "sourcesOpened"
      description: >-
        Only OPEN_SOURCE writes. It appends the source id of the record behind the current station to the
        session memory array `sourcesOpened` defined in schemas/session-memory.schema.json. That array is
        declared uniqueItems: true, so the write is idempotent by construction and replaying the same committed
        event cannot double-write. TRAVERSE writes nothing, ANCHOR_STATION writes nothing, and no atmospheric
        action writes anything. Nothing about progress, depth, speed, completion, duration, or which geometric
        layer the visitor preferred is ever written. No identity claim, score, ranking, profile, biometric
        value, genetic value, ancestry inference or 'activation' state is ever written — a scene about DNA must
        be held to this more strictly than any other, because the subject matter invites exactly the inference
        that canon forbids. The visitor must be able to see exactly what was written and to clear it, and
        stored accessibility preferences must never be inferred from behaviour.
    exitBehavior: >-
      EXIT_PASSAGE restores the exact prior route anchor, node, focus and scroll position, applying the
      ADR-0010 return-anchor law. Exit is available from EVERY station, is never gated on progress, and is
      never presented as abandoning something. Reaching the final station is an ending of the scene and NOT a
      canonical completion: it does not constitute Y, does not set completionEligible, and must not be
      captioned as arrival, ascension, activation or awakening. Position and opened sources persist for the
      session so a revisit returns the visitor where they were with previously opened sources still marked —
      the mutated-revisit behaviour the ADR requires. On exit the scene must release its animation frame, its
      WebGL context, all framebuffers, textures and geometries, its smooth-scroll instance, its ticker
      callbacks and every event listener it registered; see implementation.reusableEngineBoundary.

  implementation:
    medium: "HYBRID"
    reusableEngineBoundary: >-
      `HelixPassage` — a data-driven preset of the canonical `descent-tunnel` organism, not a new renderer.
      HelixPassage owns: parametric generation of the two strands from a declared layer profile (Layer B with
      the B-DNA constraints, or Layer S with free parameters); base-pair connector sampling; station placement
      along the axis u and the guarantee that station count and order never vary with viewport; the traversal
      model and its keyboard equivalent; the layer-boundary crossing; register marking; profile resolution;
      the static/SVG parity path; reduced-motion handling; and the full render-loop lifecycle. Everything
      scene-specific is configuration. The layer profile is the single most important parameter: it is what
      makes 'is this geometry claiming to be a molecule?' a declared, reviewable property of the scene rather
      than an accident of whoever wrote the curve.
      DISPOSAL IS A HARD REQUIREMENT, not a nicety. HelixPassage MUST expose an explicit destroy() that (a)
      cancels the animation frame and all timeouts; (b) removes EVERY listener it registered, including any
      ticker callback registered on an animation library and any subscription made on a smooth-scroll
      instance — these are the two that the shipped ManifestoSpiral3D.dispose() misses, leaving a callback
      invoking a destroyed Lenis instance; (c) disposes geometries, materials AND every texture slot, not only
      material.map — emissiveMap, bumpMap and shader-uniform textures must be disposed too, which the shipped
      dispose() also misses; (d) restores any global it mutated; and (e) is invoked when the scene leaves the
      viewport and on visibilitychange, not only on pagehide. Today the shipped engine keeps its entire WebGL
      context and GPU memory alive for the rest of the page life once scrolled past, and has no
      visibilitychange listener at all. Token performance.maxActiveHeavyCanvases is 1, so a passage that never
      releases its context makes every subsequent heavy scene a violation.
      ENGINE CHOICE IS AN OPEN DECISION AND IS FLAGGED, NOT SILENTLY MADE. The canonical grammar says one
      engine: 'un motor (KDX CORE)'. The shipped DNA passage instead runs on three.js plus gsap plus lenis
      (~500kb dynamic import) with its own postprocessing composer. Specifying HelixPassage on KDX CORE would
      honour the grammar and reuse the existing six-pass pipeline; keeping three.js would preserve the approved
      visual but institutionalise a second engine. This passport does not decide it. See ENGINE DIVERGENCE in
      notes.
    sceneSpecificParts:
      - "The station set: names, bilingual copy, order, irregular positions along u, and the source record behind each."
      - "The layer profile per passage segment, and where the layer boundaries fall."
      - "The register assignment for the scene as a whole and per station — pending the orchestrator's ruling."
      - "The amplitude envelope amp(u) and the strand colour assignment."
      - "The chrome layout: which rail, index, legend and exit controls this scene shows."
      - "The 55% negative-space and station-spacing composition rules."
    dependencies:
      - "Existing shaders in src/kodex/observe-v2/shaders/ — chroma.frag.glsl covers chromatic-split."
      - "NO SHADER EXISTS for pixel-sort, the second half of descent-tunnel's canonical fx_chain. It must be written, or the chain must be substituted, and the choice is the orchestrator's. This is a real gap, not an oversight."
      - "Existing state and profile config in src/kodex/observe-v2/config.ts (resolveProfile, OBSERVE_V2_PROFILE_SCALE)."
      - "design-system/tokens/kodex.tokens.json."
      - "schemas/session-memory.schema.json for sourcesOpened."
      - "KOD-28 (JourneyState + EventTrace) — OPEN_SOURCE depends on it for event identity, though sourcesOpened's uniqueItems constraint means a partial implementation degrades safely rather than double-writing."
      - "A ruling on the engine question before any renderer work begins; if KDX CORE is chosen there is no new third-party dependency, if three.js is chosen there are three."
    performanceRisk: "HIGH"

  fallback:
    noWebGL: >-
      The scene stays fully functional, and this is already proven rather than hypothetical: ManifestoSpiral.astro
      is a complete hand-coded SVG rendering of this exact passage and is the shipped default served whenever
      WebGL is unavailable. The static path must present the SAME stations in the SAME order with the SAME
      register marks, the SAME layer labels, the SAME source affordances, the SAME keyboard model and the SAME
      memory write. Only atmosphere is lost. The existing runtime's ?fallback=1 parameter must force this path
      for review, and the static layer must always be rendered rather than swapped in, so there is no layout
      shift between the two paths.
    noAudio: >-
      DNA PASSAGE declares no audio dependency. The organism's canonical audio routing ('low-mid+velocidad')
      is optional atmosphere only. With sound off, no semantic action, state, transition, station or memory
      write changes, and no information is available exclusively through sound. One specific prohibition: the
      canonical routing modulates by descent velocity, and that modulation must never be presented, captioned
      or heard as a measurement of anything — not a frequency, not a resonance, not a body state. Per the
      epistemic standard, a waveform cannot imply measured sound, pulse or brain activity without a real signal.
    staticMode: >-
      A single frame at a declared station with the full passage visible, all stations labelled and marked, both
      layer labels and the layer boundary drawn, no drift, no shimmer, no parallax, no travelling pulse.
      Traversal, anchoring and source opening remain available through keyboard and tap with instantaneous
      transitions. This is the mode used to produce the target captures, so that captures are reproducible and
      comparable across runs.

  accessibility:
    keyboardEquivalent: >-
      This is the single largest gap in the shipped implementation, which has ZERO keyboard handlers, no
      tabindex and no focusable control in its enhanced block — the passage is currently reachable only by
      scrolling. HelixPassage must fix this. The passage is one composite widget with a single tab stop, roving
      tabindex and aria-activedescendant. ArrowDown/ArrowUp (and ArrowRight/ArrowLeft) move between stations
      one at a time; PageDown/PageUp move to the next and previous layer boundary; Home and End move to the
      first and last station; Enter or Space performs ANCHOR_STATION; a second Enter, or a dedicated control,
      performs OPEN_SOURCE; Esc performs EXIT_PASSAGE. A skip-to-station-index control is the FIRST focusable
      element in the scene, so the entire passage can be bypassed or jumped without traversing it — this is
      what makes the traversal genuinely non-compulsory rather than merely nominally so, and it matches the
      'SKIP · INDEX' already declared by the shipped descent folio. Every consequential action is reachable
      without a pointer and without any hover state, with a visible focus indicator at every step. Smooth-scroll
      interpolation must never swallow or delay keyboard navigation.
    touchEquivalent: >-
      Tap a station to make it current and to anchor it; tap its source affordance to open it; tap the exit or
      index control to leave. Vertical drag traverses. No hover is required for any semantic action. No
      long-press, pinch, multi-touch gesture or horizontal swipe is required for anything consequential. Hit
      targets are at least 44x44 CSS px per token layout.touchTargetMin, which is the binding constraint on
      station spacing at 390x844 and 412x915. Smooth-scroll momentum must not make it impossible to stop at a
      station: a station must be reachable and holdable by a single deliberate tap on the index.
    screenReaderAlternative: >-
      The passage is exposed as an ordered list of stations. Each station carries an accessible name including
      its position ('station 5 of 9'), its bilingual label, its REGISTER in words, its geometric LAYER in words,
      and whether its source has been opened. The layer-boundary crossing is announced through a polite live
      region — a screen-reader user must never lose the distinction between biological and symbolic geometry,
      since that distinction is carried visually for everyone else. Committed actions are announced; traversal
      and pointer movement are not. A full text alternative for the whole passage is available on demand and
      contains the same stations, registers, layers and sources as the visual scene; the shipped
      ManifestoSpiral.astro already provides a real .sr-only description and that practice is inherited and
      extended. Decorative layers — depth field, shimmer, parallax — are aria-hidden.
    nonColorEquivalent: >-
      Every colour role carries at least one more channel. Register is carried by the literal words FICTION or
      DOCUMENTED, not by neon versus brand palette alone. Geometric layer is carried by the mandatory layer
      label AND by stroke treatment: Layer B is a continuous solid stroke, Layer S is a distinguishable
      treatment (for example a dashed or double stroke) fixed at implementation and held constant. The current
      station is also 1.3x scale plus a focus ring. An opened source is also a filled marker against an outlined
      one. Unresolved is also a 4-2 dashed stroke and the visible word UNKNOWN. The layer boundary is also a
      full-width rule across the column. State is additionally exposed as a data attribute and in the accessible
      name, so the scene remains fully usable in monochrome — which matters more than usual here, because
      register is a truth claim and must survive any colour condition.
    reducedMotionEquivalent: >-
      As motion.reducedMotion, and the static path is served, matching the shipped capability gate. A stored
      accessibility.motion preference of OFF in session memory overrides the media query. Smooth-scroll
      interpolation is disabled entirely under reduced motion — hijacked scrolling is itself a motion effect.
      No motion, sound or contrast setting is ever inferred from behaviour.

  reviewChecks:
    - "GEOMETRY GATE — for any element labelled or narrated as DNA, measure the rendered form: right-handed, ~10.5 base pairs per turn, unequal major and minor grooves (strand phase offset ~140/220 degrees, NOT 180), antiparallel strands, pitch-to-diameter ~1.7. If it fails any of these it must not be labelled DNA. Both currently shipped helices fail this test and are therefore Layer S."
    - "LAYER SEPARATION — biological and symbolic geometry are never blended into one continuous object; every transition between them passes through a visible layer boundary that is also announced to screen readers. Verified at all three target captures."
    - "LAYER LABEL — whenever Layer B geometry is on screen, the words BIOLOGICAL GEOMETRY / GEOMETRIA BIOLOGICA are visible. No unlabelled accurate helix appears anywhere."
    - "REGISTER MARK — every station shows its register in words at every breakpoint, including 390x844, and register survives a grayscale filter."
    - "NO NUMBERS — no percentage, count, frequency, temperature, coherence, integrity or activation value appears anywhere in the scene; the progress rail is graphic only and is never rendered as text. Confirm the chapter/corner element shows a station name, never a value."
    - "NO SEQUENCE — no ACGT run, chromosome ideogram, accession number or sequence-like texture appears anywhere."
    - "NON-COMPULSORY TRAVERSAL — the skip-to-index control is the first focusable element; every station is reachable directly from the index without traversing intermediate stations; exit is available from every station; reaching the final station unlocks nothing and is not captioned as completion, arrival, activation or awakening."
    - "NO ALPHABET IMPLICATION — no station is labelled with, ordered by, or visually keyed to an A-Y letter, and nothing in the scene suggests the passage is a required stage of a lettered sequence."
    - "TRAVERSAL WRITES NOTHING — sweep the full passage by pointer and by keyboard without opening a source, then inspect the event trace: session memory is unchanged. Depth reached, dwell time and speed appear nowhere."
    - "FULL KEYBOARD PASS with no pointer: skip control, enter the passage, traverse every station with arrows, jump boundaries with PageUp/PageDown, anchor a station, open a source, exit with Esc — with a visible focus indicator at every step and no action reachable only by scrolling."
    - "TOUCH TARGETS — minimum 44x44 px verified on 390x844 and 412x915, with no two station targets overlapping, and a station reachable and holdable by a single deliberate tap."
    - "REDUCED MOTION — no drift, shimmer, parallax or travelling pulse; smooth-scroll interpolation disabled; the layer boundary is still present and still announced."
    - "STATIC / NO-WEBGL PARITY — with the static path forced, the same stations in the same order with the same registers, layers, sources, keyboard model and memory write are present, and there is no layout shift versus the WebGL path."
    - "STATION INVARIANCE — station count and order are identical at 1440x900, 390x844 and 412x915. Only density and effects differ."
    - "MONOCHROME PASS under a grayscale filter: register, layer, current station, opened source, unresolved and the layer boundary all remain distinguishable."
    - "REVISIT — leaving and re-entering restores position and previously opened sources, and no duplicate source id is written on replay."
    - "DISPOSAL — after the scene leaves the viewport and after unmount: no animation frame is running, no ticker callback remains registered, no smooth-scroll subscription remains, the WebGL context is released, all textures including emissiveMap and bumpMap are disposed, and no window or document listener registered by the scene remains."
    - "CULTURAL BOUNDARY — no kultrun, no four-direction cross, no choike terminals, no Antu/Kuyen/Melipal/Wuñelfe motifs, and no Mapuche cosmological terminology appear in the scene unless the orchestrator has explicitly ruled the register and supplied citations."
    - "PERFORMANCE — no more than one heavy canvas active per token performance.maxActiveHeavyCanvases; DPR capped at 1.2 mobile / 1.65 desktop; sustained 50fps or better at full profile on desktop and 30fps or better at low-power on mobile; no frame-time regression versus the existing manifesto scene at equivalent settings."

