        - "TITLE MISMATCH, FLAGGED NOT RESOLVED: the node title is DNA ASCENT, the work packet title is DNA PASSAGE. The mapping is confirmed on content — dual-reading of one structure in a verified and a symbolic layer is exactly this passport's subject — and on graph position, since dna-ascent is gate 03 of the astral route between field-of-eyes and source-chamber, matching the KOD-38/39/40 packet order. The packet title is retained; the canonical id is used as conceptId."
