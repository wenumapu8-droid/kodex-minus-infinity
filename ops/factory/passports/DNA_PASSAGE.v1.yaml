schema_version: 1
visual_passport:
  passportId: "KDX-VP-DNA-PASSAGE-V1"
  conceptId: "descent-tunnel"
  title: "DNA PASSAGE"
  status: "DRAFT"

  semanticPurpose: >-
    Compose the canonical `descent-tunnel` organism (manifest `organismos[03]`, role "profundidad infinita",
    states DORMANT / DESCEND / ABSORB, verbs accelerate / distort / absorb) into a traversal whose wall is a
    double helix, so that descent through depth and descent through scale become the same movement. KODEX
    already ships this passage: `/manifesto` opens with ManifestoSpiral.astro — "the DNA-helix cosmos journey
    (from a dream, 2026-07)", lede "From the earth, out through the source, into the cosmos" — and its WebGL
    upgrade ManifestoSpiral3D.astro carries a 14-station version whose chapter XII is literally "The cosmic
    code / The spiral within / At the center of the body: the same spiral as the sky". DNA PASSAGE promotes
    that opening from page ornament to a semantic scene, and it does so under the two-layer DNA doctrine
    already recorded in canon (manifest volume `fic-diseno-humano-adn`): documented DNA — the double helix,
    the KODEX resonance `1-espiral` — and the esoteric/mythopoetic reading are two distinguished layers, and
    "Nunca se funden" / "Never blended". The scene's whole reason to exist is to hold both layers at once
    without letting either contaminate the other.

  nodeQuestion: >-
    The same helix is a molecule that has been measured and a story about where you came from. While you are
    travelling it, which of the two are you inside — and what keeps the difference visible instead of letting
    the beauty of the form quietly turn the myth into a fact?

  coordinateAssignment: null

  sourceRefs:
    - id: "ops/factory/packets/KOD-39.yaml (KDX-WP-VISUAL-02)"
      relation: "PRIMARY_CONCEPT"
      rightsStatus: "CLEAR"
      notes:
        - "The exact string 'DNA PASSAGE' occurs in no file of kodex-minus-infinity or wenu-frontend except this packet. Verified by full-tree grep of both repositories."
        - "The packet's source_inputs name 'actual DNA PASSAGE concept/reference images available to the visual worker'. No image set reached this worker; no image was inspected. See PROVENANCE QUESTION 1."
        - "Unlike KOD-38, the absence of images did NOT leave this passport ungrounded: a shipped, approved implementation of a DNA passage exists in wenu-frontend and is the primary anchor below."
    - id: "wenu-frontend src/components/ManifestoSpiral.astro"
      relation: "PRIMARY_CONCEPT"
      rightsStatus: "CLEAR"
      notes:
        - "Read in full (260 lines). Header: 'ManifestoSpiral.astro — the DNA-helix cosmos journey (from a dream, 2026-07). Opening of /manifesto. Earth at the top; scrolling down travels out through the scales — atom, seed, cell, THE SOURCE, planets, sun, galaxy — and pours into a black hole at the bottom. Two strands: gold (organic/DNA) + cyan (cybernetic/informatic).'"
        - "This is the DEFAULT served visual for /manifesto and the no-WebGL / reduced-motion / <360px fallback for the 3D version. Hand-coded inline SVG, no dependencies."
        - "Measured geometry: cx=190, yTop=150, yBot=1490, k=0.0225 rad/px, y step 3px. Total twist (1490-150)*0.0225 = 30.15 rad = 4.80 turns. Rungs every 6th sample = every 18px = 0.405 rad, i.e. ~15.5 rungs per turn, ~74 rungs total. Amplitude envelope amp(y)=12+62*((yBot-y)/(yBot-yTop))^0.72 — wide at Earth, narrowing into the black hole."
        - "Strand pair is P1 = cx + a*sin(th), P2 = cx - a*sin(th) — an exact pi phase offset, which yields two IDENTICAL grooves. Real B-DNA has unequal major/minor grooves. This helix is therefore symbolic, not biologically recognizable. That is correct for its register; see geometry and reviewChecks."
        - "Stations, in served order: Earth / LA TIERRA, Atom / EL ATOMO, Seed / LA SEMILLA, Cell-DNA / LA CELULA, The Source / LA FUENTE, Planets / LOS PLANETAS, Sun / EL SOL, Galaxy / LA GALAXIA, Black Hole / EL AGUJERO NEGRO. Bilingual EN + ES on every station."
        - "Strand colours as shipped: gold #c9a84c / #e8c766 (organic) and teal-cyan #64e0d0 / #7fe9db (cybernetic). These are wenu-frontend brand tokens (ember #c9a84c), NOT the kodex.tokens.json signal palette. See PALETTE CONFLICT in notes."
        - "Accessibility as shipped: a real .sr-only paragraph describes the whole journey; prefers-reduced-motion disables every animation. There is no keyboard interaction because there is no interaction at all beyond scroll reveal."
        - "DEFECT: window 'scroll' and 'resize' listeners are registered and never removed; there is no teardown. Reported, not fixed."
    - id: "wenu-frontend src/components/ManifestoSpiral3D.astro"
      relation: "PRIMARY_CONCEPT"
      rightsStatus: "REVIEW_REQUIRED"
      notes:
        - "Inspected in detail (2555 lines), read-only. WebGL 'visionary' upgrade of the same journey; header says 'Ocin's dream, prototype v5 — audited + approved, 2026-07-18', ported 1:1 from a prototype index.html."
        - "14 stations, chapter I..XIV, expressed as Mapuche cosmology: I Wenu Mapu, II Antu, III Rupu, IV Kuyen, V Nag Mapu, VI the descent toward Minche Mapu, VII Kutral, VIII Kuruf, IX Ko, X Kura, XI Meli Witran Mapu, XII The cosmic code, XIII Itrofill Mongen, XIV Minche Mapu."
        - "The DNA object: turns 4.2, radius 8.5, spans world y -164 to -256. Strands are flat ribbons (custom BufferGeometry, width 1.8, MeshStandardMaterial emissive #a8c4ff) plus additive glow TubeGeometry radius 1.2. Base pairs are two BoxGeometry bars + two SphereGeometry junctions per rung, colour pairs amethyst/ember #9a7ee0-#c9a84c and teal/silver #64e0d0-#b8b4aa."
        - "Second strand is generated at `ang + Math.PI` — again an exact pi offset, again equal grooves, again not biologically recognizable."
        - "Base-pair COUNT CHANGES WITH VIEWPORT: STEPS 200 desktop / 110 mobile with a rung every 6th sample gives 34 base pairs on desktop and 19 on mobile — 8.1 and 4.5 per turn respectively, against ~10.5 in real B-DNA. A structure whose base-pair count depends on screen width is decorative by construction and must stay in the symbolic layer."
        - "There is NO ethnographic or cultural citation anywhere in the file. Line 829 asserts an 'authentic kultrun drumhead — audited pass' without naming a source. See PROVENANCE QUESTION 2 and 3."
        - "Interaction: pointermove only (eye-net pupil tracking, idle drift after 2s). Lenis smooth-scroll hijacks the window. ZERO keyboard handlers, zero tabindex, zero focusable control in the enhanced block. No storage, no fetch, no analytics — nothing is persisted."
        - "No numeric readout is displayed anywhere; the progress rail is a CSS width only and is never rendered as text. This is good and must be preserved."
        - "Capability gate: the SVG fallback is served when prefers-reduced-motion is set, OR innerWidth < 360, OR neither webgl2 nor webgl can be obtained, OR any exception. lowPerf (deviceMemory < 4 or hardwareConcurrency <= 2) deliberately does NOT gate the fallback; it only forces the lighter preset via `mobile = innerWidth < 760 || lowPerf`."
        - "Dependencies: three, three/addons postprocessing (EffectComposer, RenderPass, UnrealBloomPass, ShaderPass, OutputPass), GLTFLoader, gsap, gsap/ScrollTrigger, lenis — all dynamic-imported inside an IntersectionObserver. The file states ~500kb. Also fetches /models/serpent_head_r2.glb at runtime."
        - "It HAS a real dispose() (renderer.dispose, composer.dispose, lenis.destroy, scene traverse, ScrollTrigger kills, listener removal). See notes for exactly what it still leaks."
