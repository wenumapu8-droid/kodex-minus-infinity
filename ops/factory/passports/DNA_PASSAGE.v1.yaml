    - "COORDINATE — coordinateAssignment stays null. ADR-0010's concept assignment law requires creator approval before any A-Y letter is assigned, and no canonical source assigns one. Note the specific temptation this scene creates and rejects: a passage with ordered loci looks like it wants to be a lettered sequence. It is not one, and reviewChecks tests for that explicitly."
    - "DEPENDENCY — source opening cannot be implemented before KOD-28 (JourneyState + EventTrace) lands, because idempotent replay by event identity is what keeps the memory write from double-writing."
    - "PERFORMANCE RISKS — why implementation.performanceRisk is HIGH. (1) The only shipped implementation loads ~500kb of three.js + gsap + lenis plus a full postprocessing composer, and additionally fetches a GLB model at runtime; that is already the heaviest scene in either repository. (2) It builds up to 9000 connective-thread points, 1008 eye-net instances, 3000 starfield points and 6000 galaxy particles on desktop, with an UnrealBloomPass over all of it. (3) It never releases its WebGL context on scroll-out — only pause() is called — so with token performance.maxActiveHeavyCanvases at 1, any second heavy scene on the same page is a violation by construction. (4) The unremoved ticker callback and smooth-scroll subscription mean the leak compounds per mount rather than staying constant. (5) Smooth-scroll hijacking of the window is itself a main-thread cost and interacts badly with the keyboard model this passport requires. (6) The helix is a stroked/swept curve whose cost scales with sample count on every frame, and the static SVG path builds ~447 samples per strand plus ~74 rungs at DOM level, which must not be rebuilt on resize. (7) If HelixPassage is instead built on KDX CORE, risk drops toward MEDIUM — which is itself an argument for the consolidation decision above."
    - "IMPLEMENTATION PACKET RECOMMENDATION — split into three, in this order. (a) C1, ORCHESTRATOR/architecture: rule the engine question — KDX CORE versus three.js — and, if KDX CORE, rule the pixel-sort shader gap. Blocking for (b). (b) C2, producer BOUNDED_CODING_AGENT, reviewer LONG_CONTEXT_ARCHITECT: build HelixPassage with locus invariance across viewports, the full keyboard model, the static/SVG parity path, the register marking, and an explicit destroy() with a test asserting zero remaining listeners, tickers, subscriptions and undisposed textures. No new visual invention. (c) C1, MULTIMODAL_VISUAL_SPEC: visual review against reviewChecks at the target captures, after (b). Do not issue (b) until R-open 1 is answered. The register question that previously blocked everything is now closed by R1. A separate packet is worth opening for the leaks listed under DEFECTS, since they affect production today and are independent of DNA PASSAGE; and R-open 2 needs its own cultural-review packet."
    - "DEFECTS FOUND IN EXISTING CODE — reported, not fixed, since this packet may not edit runtime code. (1) kodex-observe-v2-client.ts bindEvents() registers addEventListener('resize', ...) and document.addEventListener('visibilitychange', ...) as anonymous arrows and never removes them; stop() only cancels the RAF and timeouts and there is no destroy path, so a second mount leaks listeners and a WebGL context. (2) ManifestoSpiral3D.astro has a real dispose(), but gsap.ticker.add(...) is never removed and the retained closure keeps calling lenis.raf() on a Lenis instance dispose() already destroyed; lenis.on('scroll', ScrollTrigger.update) has no matching off(); gsap.ticker.lagSmoothing(0) is a global mutation never restored. (3) The same dispose() disposes only material.map, never emissiveMap, bumpMap or shader-uniform textures, so the DNA ribbon texture, the serpent maps and the kultrun emissive maps are never freed. (4) dispose() is reachable only from a pagehide listener; the IntersectionObserver's exit branch calls pause() only, so the WebGL context and all GPU memory survive for the rest of the page life once the section is scrolled past. There is no visibilitychange listener anywhere in the file, and renderer.forceContextLoss() is never called. (5) ManifestoSpiral.astro registers window 'scroll' and 'resize' listeners and never removes them. (6) The shipped DNA passage has ZERO keyboard affordance — no keydown handler, no tabindex, no focusable control — so the whole scene is pointer/scroll-only, which fails the packet's own equivalence criterion in production today. (7) ManifestoSpiral3D.astro's header comment (lines 15-17) describes the DNA as 'MeshPhysicalMaterial iridescent strands' with 'base pairs as glowing sacred-geometry star-cross Sprites'; the implementation actually uses MeshStandardMaterial ribbons with BoxGeometry bars and SphereGeometry junctions, and no Sprites. Documentation that contradicts the code it documents is a maintenance hazard worth a one-line fix. (8) COWORK-BRIDGE.md prescribes 'Datos vivos' — core temp 87.3K, field stability 94.6%, quantum noise 2.7dB, signal 87.6%, timeline drift 0.0009% — which are near-verbatim instances of the pseudo-metrics canon/KODEX_EPISTEMIC_STANDARD.md prohibits. This is a canon-versus-working-document conflict, not a code bug, and the bridge should be annotated so no future scene implements it."
