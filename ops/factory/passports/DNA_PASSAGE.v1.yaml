  epistemicConstraints:
    - "THE CENTRAL CONSTRAINT, inherited verbatim from canon (manifest volume fic-diseno-humano-adn): documented DNA — the double helix, resonance 1-espiral — and the esoteric reading are two distinguished layers and 'Nunca se funden' / 'Never blended'. This scene may show both. It may never merge them."
    - "Real DNA structure is OBSERVED-class and may inform the helix primitive. The spiritual/cosmic 'source passage' is MYTHOPOETIC-class. The B-DNA parameters in geometry.topology are the operational boundary between the two: satisfy them and the object may be called DNA; do not satisfy them and it may not."
    - "Nothing in this scene is a claim about genetics, heredity, ancestry, evolution, health or the body. The Codex Estelar material it draws on is marked in canon as 'ficción/esotérico de autor... sin claims de hecho ni de salud' — no claims of fact and no claims of health. That marking travels with the material into this scene and must be visible in it."
    - "'DNA activation' is a real-world pseudo-medical claim and is treated as such. The lore's 'los códigos dormidos del ADN se encienden' may appear only as explicitly marked fiction. The scene must never imply the visitor's DNA is being activated, read, scanned, awakened, measured or changed, and must never offer an action framed as doing so."
    - "No particle, light, glow, pulse or motion in this scene is a measurement. Per the epistemic standard: particle density cannot imply a count unless particles encode units, animation cannot manufacture a trend, and a waveform cannot imply measured sound, pulse or brain activity without a real signal. Base-pair connector count in particular carries NO meaning — it is a legibility and fill-rate parameter that already varies with viewport in the shipped implementation."
    - "No numeric telemetry may be displayed as factual system state. This explicitly overrides the values prescribed in wenu-frontend COWORK-BRIDGE.md ('core temp 87.3K', 'field stability 94.6%', 'quantum noise 2.7dB', 'signal 87.6%'), which are close paraphrases of the examples canon/KODEX_EPISTEMIC_STANDARD.md lists as prohibited pseudo-metrics. Where the bridge and canon conflict, canon governs."
    - "The scene must not profile the visitor, rank them, or infer identity, ancestry, mood, ability, spiritual state or intent from interaction. Depth reached is not attainment and must never be scored or displayed as one."
    - "The helix is generated, not measured. Its geometry represents no dataset and must never be captioned or labelled as if it did."
    - "Registers must not blend. DNA PASSAGE sits in the fiction register or the documented register, never both, and must not absorb Mapuche material — which is a separate, documented, citation-bearing register — pending the orchestrator's ruling."
    - "Where a station has no source record, the absence stays visible and is marked UNKNOWN. It is not filled for aesthetic balance."

  scientificClaimPolicy: "MIXED_WITH_EXPLICIT_LABELS"

  notes:
    - "WHY scientificClaimPolicy IS 'MIXED_WITH_EXPLICIT_LABELS' AND NOT 'SYMBOLIC_ONLY' — this is a deliberate departure from the template default and from KOD-38, and it is the single most consequential choice in this passport. The packet's own epistemic constraints say real DNA biology MAY inform the helix primitive while the source passage is mythopoetic. SYMBOLIC_ONLY would forbid the biological layer outright and would make acceptance criterion 1 vacuous — you cannot 'explicitly separate' biologically recognizable geometry from symbolic geometry if biologically recognizable geometry is not permitted to exist. MIXED_WITH_EXPLICIT_LABELS admits both classes and forces the labelling that keeps them apart, which is exactly what canon's 'Nunca se funden' requires. If the orchestrator prefers SYMBOLIC_ONLY, then Layer B must be removed entirely and the scene must never be captioned as DNA at all — that is a coherent alternative, but it is a different scene and the orchestrator should choose it explicitly rather than by default."
    - "PROVENANCE QUESTION 1 — concept identity. The exact string 'DNA PASSAGE' exists in no file of either repository except KOD-39 itself, and the concept/reference images named in the packet's source_inputs never reached this worker; no image was inspected. UNLIKE KOD-38, however, this passport is not anchored in inference: a shipped, approved DNA passage exists at wenu-frontend /manifesto in two implementations, and the Codex Estelar Libro IV lore that gives it meaning is present locally as primary text. The orchestrator must confirm that this shipped manifesto passage IS the DNA PASSAGE concept the packet means. Status stays DRAFT for this reason. If it is a different, unseen concept, this passport must be re-derived rather than patched."
    - "PROVENANCE QUESTION 2 — REGISTER BLEND, AND IT IS THE BLOCKING ONE. Canon states 'Mapuche y Codex Estelar NUNCA se mezclan' and defines the ficcion register as one that never mixes with documented or Mapuche material. The sacred-DNA material behind this concept is Codex Estelar Libro IV, registro ficcion, paleta neon. But the shipped ManifestoSpiral3D.astro places its DNA station — 'XII · The cosmic code / The spiral within' — inside a fourteen-station Mapuche cosmology running from Wenu Mapu to Miñche Mapu. On the face of it that is the blend canon forbids, in production, today. This passport therefore specifies DNA PASSAGE as a fiction-register scene that borrows no Mapuche material, and flags the shipped manifesto as needing its own review. The orchestrator must rule: (a) is the manifesto's cosmic DNA in fact Codex Estelar material, or an independent visionary motif that happens to share the form? and (b) does DNA PASSAGE inherit the manifesto's Mapuche framing or not? The register decision changes the palette, the permitted links and the permitted motifs, so it must be answered before any implementation packet is issued."
    - "PROVENANCE QUESTION 3 — MAPUCHE CITATION GAP in existing production code. ManifestoSpiral3D.astro renders a detailed kultrun drumhead — four-direction cross, choike three-toed terminals, Antu, Küyen, Melipal and Wüñelfe quadrant motifs — and its comment at line 829 calls it an 'authentic kultrún drumhead — audited pass'. There is NO ethnographic or cultural source citation anywhere in the 2555-line file. Canon requires documented Mapuche material to be cited (COWORK-BRIDGE records 'mapuche=documentado citado (Canio & Pozo), review:true donde no verifique'), and canon's own documented volumes do cite. This is a finding about existing shipped code, outside KOD-39's scope to fix, and it should be routed to cultural review as its own packet. DNA PASSAGE must not replicate the pattern."
    - "PROVENANCE QUESTION 4 — no organism is named DNA PASSAGE. There is no such organism among the canonical eight (threshold-portal, observation-eye, descent-tunnel, archive-tree, specimen-skull, ritual-device, cosmology-core, signal-bloom). conceptId is set to descent-tunnel because it is the only organism whose role is traversal through depth ('profundidad infinita', states DESCEND/ABSORB, verbs accelerate/distort/absorb), which is what a passage is. This choice is contestable and the contrary evidence is stated plainly: the canonical DNA volumes (fic-diseno-humano-adn, lore-4-el-diseno-original) declare their resonances to signal-bloom and cosmology-core, NOT to descent-tunnel. A defensible alternative is to treat DNA PASSAGE as a descent-tunnel traversal whose stations resonate to signal-bloom and cosmology-core, which is what this passport effectively describes. If the passage warrants its own registry entry, the orchestrator should assign one; this passport does not create canon."
    - "PROVENANCE QUESTION 5 — source PDFs are absent. The manifest cites the Codex Estelar chapters to absolute paths under /Users/user1/Obsidian/WenuAgent/..., which DOES NOT EXIST on this machine (verified). Only the derived .txt files under public/kodex-content/books/kodex-estelar/source-text/ are present, and those were read. If the passport's reading of the lore matters to the design — and the 'Símbolo Visual: Espiral doble de ADN dorado brillante' line does matter, because it is why the gold strand is treated as canonical — the orchestrator should confirm the .txt derivation is faithful to the PDFs."
    - "ENGINE DIVERGENCE — the canonical grammar declares one engine: 'un motor (KDX CORE) + una suite de 8 tratamientos GPU'. The shipped DNA passage does not use it. ManifestoSpiral3D.astro runs three.js + gsap + lenis (~500kb, dynamic-imported) with its own EffectComposer/UnrealBloomPass stack, while the KDX CORE candidate (kodex-observe-v2-client.ts) is a hand-written WebGL2 six-pass pipeline with no third-party dependency. Consolidating DNA PASSAGE onto KDX CORE would honour the grammar and reuse existing shaders but would require re-authoring an approved visual; keeping three.js preserves the approved visual but institutionalises a second engine and a 500kb budget. This is an architecture decision above this packet's authority and is escalated, not decided."
    - "SHADER GAP — descent-tunnel's canonical fx_chain is [chromatic-split, pixel-sort]. chroma.frag.glsl exists and covers chromatic-split. THERE IS NO PIXEL-SORT SHADER. Full audit of the 8 canonical treatments against src/kodex/observe-v2/shaders/: crt-scan -> crt.frag EXISTS; bitmap-threshold -> threshold.frag EXISTS; memory-feedback -> feedback.frag EXISTS; chromatic-split -> chroma.frag EXISTS; glitch-fracture -> displace.frag PARTIAL/approximate; dither-matrix, thermal-map and pixel-sort have NO shader. Unlike KOD-38, this passport therefore CANNOT claim 'no new shader is required'. Either pixel-sort is written, or the chain is substituted, and that is the orchestrator's call."
    - "PALETTE CONFLICT — three palettes are in play and they do not agree. (1) The design-system tokens (kodex.tokens.json): livingRed #FF3833, violet #7855D5, acid #B9FF3B, cyan #00E8F0, orange #FF7A00, magenta #FF1EAA. (2) The canonical descent-tunnel organism palette in the manifest: #FF5A00, #FF2028, #FFB000, #0A0A0A. (3) The shipped manifesto expression, which is the wenu-frontend BRAND palette: ember #c9a84c gold and teal #64e0d0 — and the gold is not arbitrary, it is the lore text's own 'Símbolo Visual: Espiral doble de ADN dorado brillante'. This passport uses design-system tokens as authoritative where it can, because they are the versioned artefact in the canon repository, but it preserves the gold/teal strand expression because it has independent canonical warrant. The three-way delta is real and visible; the orchestrator should rule rather than letting the implementation choose."
    - "CONCEPT ID — no canonical id exists for the passage itself, so conceptId is set to the organism it composes (descent-tunnel). See PROVENANCE QUESTION 4."
    - "COORDINATE — coordinateAssignment stays null. ADR-0010's concept assignment law requires creator approval before any A-Y letter is assigned, and no canonical source assigns one to this concept. Note the specific temptation this scene creates and rejects: a passage with ordered stations looks like it wants to be a lettered sequence. It is not one, and reviewChecks tests for that explicitly."
    - "PERFORMANCE RISKS — the reason implementation.performanceRisk is HIGH rather than MEDIUM. (1) The only shipped implementation loads ~500kb of three.js + gsap + lenis plus a full postprocessing composer, and additionally fetches a GLB model at runtime; that is already the heaviest scene in either repository. (2) It builds up to 9000 connective-thread points, 1008 eye-net instances, 3000 starfield points and 6000 galaxy particles on desktop, with an UnrealBloomPass over all of it. (3) It never releases its WebGL context on scroll-out — only pause() is called — so with token performance.maxActiveHeavyCanvases at 1, any second heavy scene on the same page is a violation by construction. (4) The unremoved gsap ticker callback and lenis scroll subscription mean the leak compounds per mount rather than staying constant. (5) Smooth-scroll hijacking of the window is itself a main-thread cost and interacts badly with the keyboard model this passport requires. (6) The helix is a stroked/swept curve whose cost scales with sample count on every frame, and the static SVG path builds ~447 samples per strand plus ~74 rungs at DOM level, which must not be rebuilt on resize. (7) If HelixPassage is instead built on KDX CORE, risk drops toward MEDIUM — which is itself an argument for the consolidation decision above."
    - "IMPLEMENTATION PACKET RECOMMENDATION — split into four, and do not start any of them until PROVENANCE QUESTION 2 (register) is answered, because the register decision changes the palette, the permitted motifs and the permitted links. (a) C1, ORCHESTRATOR/cultural review: rule the register for DNA PASSAGE, and separately open the Mapuche citation gap in ManifestoSpiral3D as its own remediation packet. Blocking for everything else. (b) C1, ORCHESTRATOR/architecture: rule the engine question — KDX CORE versus three.js — and, if KDX CORE, rule the pixel-sort shader gap. Blocking for (c). (c) C2, producer BOUNDED_CODING_AGENT, reviewer LONG_CONTEXT_ARCHITECT: build HelixPassage with the layer profile as a first-class declared parameter, the B-DNA geometry gate enforced in code (a Layer B profile that fails the constraint should fail a unit test, not a visual review), station invariance across viewports, the full keyboard model, the static/SVG parity path, and an explicit destroy() with a test asserting zero remaining listeners, tickers, subscriptions and undisposed textures. No new visual invention. (d) C1, MULTIMODAL_VISUAL_SPEC: visual review against reviewChecks at the three target captures, after (c). A separate small packet is worth opening for the leaks listed under DEFECTS below, since they affect production today and are independent of DNA PASSAGE."
    - "DEFECTS FOUND IN EXISTING CODE — reported, not fixed, since this packet may not edit runtime code. (1) kodex-observe-v2-client.ts bindEvents() registers addEventListener('resize', ...) and document.addEventListener('visibilitychange', ...) as anonymous arrows and never removes them; stop() only cancels the RAF and timeouts and there is no destroy path, so a second mount leaks listeners and a WebGL context. (2) ManifestoSpiral3D.astro has a real dispose(), but gsap.ticker.add(...) is never removed and the retained closure keeps calling lenis.raf() on a Lenis instance dispose() already destroyed; lenis.on('scroll', ScrollTrigger.update) has no matching off(); gsap.ticker.lagSmoothing(0) is a global mutation never restored. (3) The same dispose() disposes only material.map, never emissiveMap, bumpMap or shader-uniform textures, so the DNA ribbon texture, the serpent maps and the kultrun emissive maps are never freed. (4) dispose() is reachable only from a pagehide listener; the IntersectionObserver's exit branch calls pause() only, so the WebGL context and all GPU memory survive for the rest of the page life once the section is scrolled past. There is no visibilitychange listener anywhere in the file, so a backgrounded tab keeps rendering unless it also happens to be scrolled out. renderer.forceContextLoss() is never called. (5) ManifestoSpiral.astro registers window 'scroll' and 'resize' listeners and never removes them. (6) The shipped DNA passage has ZERO keyboard affordance — no keydown handler, no tabindex, no focusable control — so the whole scene is pointer/scroll-only, which fails the packet's own equivalence criterion in production today. (7) ManifestoSpiral3D.astro's header comment (lines 15-17) describes the DNA as 'MeshPhysicalMaterial iridescent strands' with 'base pairs as glowing sacred-geometry star-cross Sprites'; the implementation actually uses MeshStandardMaterial ribbons with BoxGeometry bars and SphereGeometry junctions, and no Sprites. Documentation that contradicts the code it documents is a maintenance hazard worth a one-line fix. (8) COWORK-BRIDGE.md prescribes 'Datos vivos' — core temp 87.3K, field stability 94.6%, quantum noise 2.7dB, signal 87.6%, timeline drift 0.0009% — which are near-verbatim instances of the pseudo-metrics canon/KODEX_EPISTEMIC_STANDARD.md prohibits. This is a canon-versus-working-document conflict, not a code bug, and the bridge should be annotated so no future scene implements it."
    - "EVIDENCE — sources actually inspected are listed file-by-file in sourceRefs, and every file named there was read in this session. Deliberately NOT inspected or not available: no concept/reference image of any kind (none reached this worker); public/kodex-content/art/ does not exist on this machine; the Obsidian vault PDFs at /Users/user1/Obsidian/ do not exist on this machine. The two ear-piercing assets public/img/piercing/types/helix.avif and forward-helix.avif were located, identified as unrelated product photography, and excluded."
