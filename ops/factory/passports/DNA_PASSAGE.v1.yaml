  epistemicConstraints:
    - "CANON, verbatim from KDX-NODE-DNA-ASCENT editorial body: 'La biología de la herencia está documentada y se muestra como tal. El linaje simbólico es construcción de KODEX y se muestra como tal. Las dos capas conviven sin fundirse: esa separación es parte de la obra, no una advertencia legal.' The separation of the two layers is part of the work, not a disclaimer, and must be designed as such rather than appended as a caption."
    - "The double helix is a recognizable biological reference primitive, not a simulation or measurement of a user's DNA. Layer B may be structurally accurate; it is never the visitor's data."
    - "The node's own epistemic block sets claimClass UNKNOWN with no domains, limitations or claims recorded. For a concept canon itself describes as bridging VERIFIED biology, that is a gap: Layer B is OBSERVED-class material with no source recorded anywhere in canon. Until a real structural-biology source is cited and rights-cleared, Layer B may be rendered but must carry the visible words NO SOURCE RECORDED alongside its layer label, exactly as an unsourced locus does."
    - "Spiritual/cosmic/source passage is mythopoetic, not scientific DNA function."
    - "Particle/light telemetry must not become fake biological measurement. Per the epistemic standard: particle density cannot imply a count unless particles encode units, animation cannot manufacture a trend, and a waveform cannot imply measured sound, pulse or brain activity without a real signal. Rung and connector count in particular carry NO meaning."
    - "Any displayed sequence/readout is symbolic texture unless a separate verified scientific source is explicitly cited."
    - "Canon's two-layer rule is inherited verbatim (manifest volume fic-diseno-humano-adn): documented DNA — the double helix, resonance 1-espiral — and the esoteric reading are two distinguished layers and 'Nunca se funden' / 'Never blended'. This scene may show BOTH. It may never merge them. The B-DNA parameters in geometry.topology are the operational boundary: satisfy them and the object may be called DNA, fail them and it may not."
    - "Nothing in this scene is a claim about genetics, heredity, ancestry, evolution, health or the body. The Codex Estelar material it draws on is marked in canon as 'ficcion/esoterico de autor... sin claims de hecho ni de salud' — no claims of fact and no claims of health — and that marking travels with the material into this scene and must be visible in it."
    - "'DNA activation' is a real-world pseudo-medical claim and is treated as such. The lore's 'los codigos dormidos del ADN se encienden' may appear only as explicitly marked fiction. The scene must never imply the visitor's DNA is being activated, read, scanned, awakened, measured or changed, and must never offer an action framed as doing so."
    - "No numeric telemetry may be displayed as factual system state. This explicitly overrides the values prescribed in wenu-frontend COWORK-BRIDGE.md ('core temp 87.3K', 'field stability 94.6%', 'quantum noise 2.7dB', 'signal 87.6%'), which are close paraphrases of the examples canon/KODEX_EPISTEMIC_STANDARD.md lists as prohibited pseudo-metrics. Where the bridge and canon conflict, canon governs."
    - "The scene must not profile the visitor, rank them, or infer identity, ancestry, mood, ability, spiritual state or intent from interaction. Depth reached is not attainment."
    - "The helix is generated, not measured. Its geometry represents no dataset and must never be captioned or labelled as if it did."
    - "Registers must not blend. Under R1 DNA PASSAGE sits in the FICTION register, and it must not link to, blend with or absorb any documented-register volume, and must never touch Mapuche material."
    - "Where a locus has no source record, the absence stays visible and is marked UNKNOWN. It is not filled for aesthetic balance."
  scientificClaimPolicy: "MIXED_WITH_EXPLICIT_LABELS"
  notes:
    - "LINEAGE — this passport is the R2 merge of two independent versions: the iMac branch feature/visual-passport-dna-passage-v1 (149 lines, 3 sourceRefs, 6 reviewChecks) supplied the skeleton, field ordering and compact field values; the macmini branch feature/visual-passport-dna-passage-v1-macmini (637 lines, 19 sourceRefs, 19 reviewChecks) supplied sourceRefs, reviewChecks, provenanceBoundaries and the escalated decisions below. Neither lineage was discarded. Where the two disagreed on a value rather than on depth, the disagreement is recorded in these notes rather than silently resolved."
    - "Concept title in packet is DNA PASSAGE; the canonical node title is DNA ASCENT, now verified. The packet title is kept as `title` and the canonical id is used as conceptId. The mapping is confirmed on content and on graph position, not on the name — see the R-OPEN 1 note."
    - "REGISTER — CLOSED BY RULING R1. DNA PASSAGE sits in the FICTION register with the neon palette. This supersedes the macmini lineage's blocking PROVENANCE QUESTION 2. Consequences applied here: paletteRoles reconciled to the neon values; no link to or blend with any documented-register volume and never with Mapuche material; the register marker carried textually as well as by colour; and iconography from a living tradition treated as a glyph, a borrowing from the imaginary, never doctrine."
    - "PALETTE — WHICH VALUES WERE USED AND WHY, AND WHAT IS STILL OPEN. R-open 3 in the creator rulings is UNRESOLVED: the canonical organism palette is close to but not identical with the design-system tokens. This passport uses the ORGANISM NEON VALUES — #FF5A00, #FF2028, #FFB000, #0A0A0A from manifest organismos[03].paleta — because ruling R1 says the palette is neon and those are the neon values, citing the brand-token neighbour beside each for traceability. This is a change from the macmini lineage, which treated the design-system tokens as authoritative and additionally preserved the shipped wenu BRAND gold #c9a84c / teal #64e0d0 strand expression. That brand expression is NOT used here, because the brand palette is what marks the documented register; the lore text's 'Espiral doble de ADN dorado brillante' is instead realised as the neon amber #FFB000. This is a real, visible change to the shipped look and the creator should confirm it. R-open 3 is NOT settled by any of this: the orchestrator still owes a ruling on whether the manifest or the token file is canonical, and there is a third palette in play — the wenu brand tokens — which no ruling has yet addressed."
    - "R-OPEN 1 — CONCEPT IDENTITY: CLOSED. The concept is the real canonical node KDX-NODE-DNA-ASCENT at src/data/kodex/nodes/dna-ascent.json in wenu-frontend, atlasStatus CANON, status active, publishable true. It was invisible to every earlier search because of a loader bug — getKodexNodes() resolved its path with import.meta.url, which at build time points into dist/ rather than src/, so the loader returned [] and no node route was ever generated. Fixed on feature/kodex-node-graph-v1 @ 867fb8b0 (PR #44). THE MAPPING WAS VERIFIED FROM CONTENT, NOT ASSUMED FROM THE NAME, and the name in fact does not match: the node is titled DNA ASCENT, the packet says DNA PASSAGE. Three independent content checks carry it. (1) The node's visualAnchor is kind 'dual-reading', 'Una misma estructura en capa verificada y capa simbólica, distinguibles' — one structure read twice, distinguishably, which is precisely and only what this passport is about. (2) The node's proposition, 'La herencia es dato antes que símbolo. El ascenso no niega la biología: la lee dos veces', is the exact string the iMac lineage was already carrying as its nodeQuestion in its earlier revision. (3) Graph position: dna-ascent is gate 03 of the canonical ASTRAL ROUTE 01-06, sitting between field-of-eyes (gate 02) and source-chamber (gate 04) — the same three concepts, in the same order, as work packets KOD-38 / KOD-39 / KOD-40. The title difference is recorded and left to the creator; it does not put the mapping in doubt."
    - "STATUS — STAYS DRAFT, BUT FOR DIFFERENT AND SMALLER REASONS THAN BEFORE. With R-open 1 closed and the register closed by R1, the open items are: the MODE AND ACCENT question, the ACCENT CONFLICT below, R-open 3 (palette), the engine divergence, and the pixel-sort shader gap. Those are open decisions for the creator and the architecture track, so status may not move to REVIEW. The iMac lineage's REVIEW remains downgraded."
    - "SCIENTIFIC CLAIM POLICY — CHANGED TO MIXED_WITH_EXPLICIT_LABELS ON CANONICAL EVIDENCE. FLAG THIS TO THE CREATOR: it reverses the iMac lineage's supervisor patch, which had removed the 'Verified Strand' claim and set SYMBOLIC_ONLY. The reversal is not a preference, it is what the canonical node says. The node's summary uses the word VERIFIED — 'Bridges VERIFIED biology of inheritance with KODEX symbolic lineage' — its visualAnchor is 'capa verificada y capa simbólica, distinguibles', and its editorial body states 'La biología de la herencia está documentada y se muestra como tal... Las dos capas conviven sin fundirse: esa separación es parte de la obra, no una advertencia legal.' SYMBOLIC_ONLY would forbid the verified layer outright and would make canon's own 'dual-reading' anchor unrenderable: you cannot show two distinguishable layers if one of them may not exist. This is exactly the argument the macmini lineage made and the iMac lineage rejected; the node graph decides it in the macmini lineage's favour. Consequences applied: the B-DNA geometry gate is reinstated in geometry.topology and in reviewChecks, Layer B and Layer S are separate palette roles, the layer label is a mandatory typographyRole, and the layer boundary is a motion timescale that may not be crossfaded. The supervisor patch's underlying concern is still honoured — nothing generated may be presented as measurement, and Layer B must meet the structural gate or lose the right to be called DNA. If the creator prefers to keep SYMBOLIC_ONLY, Layer B must be removed entirely and the scene must never be captioned as DNA at all; that is coherent, but it is a different scene and it contradicts the node, so it should be chosen explicitly."
    - "ACCENT CONFLICT — SPECIFIC TO THIS PASSPORT, AND UNRESOLVED. KDX-NODE-DNA-ASCENT declares accent 'violet'. The organism this scene is rendered as a preset of, descent-tunnel, has the neon palette #FF5A00, #FF2028, #FFB000, #0A0A0A — which contains NO violet. So the node accent and the rendering organism's palette cannot both be satisfied from a single palette, and this is not a rounding difference like R-open 3 but a missing hue. This passport carries the accent as its own paletteRole resolved to the manifest's neon violet #903CFF (used by observation-eye, cosmology-core and ritual-device) while keeping descent-tunnel's own palette for the passage roles. Three ways out, for the creator: (a) the accent is the concept's identity colour and overrides the organism palette for accent purposes, which is what this passport assumes; (b) descent-tunnel is the wrong rendering organism for this node, and signal-bloom or cosmology-core — which the canonical DNA volumes actually declare as their resonances — is the right one, in which case violet resolves natively; (c) the accent slot is decorative metadata and may be ignored. Option (b) has independent support and is worth considering seriously; it is not adopted here because changing the rendering organism changes the fx_chain, the state vocabulary and the whole implementation packet."
    - "MODE AND ACCENT vs RULING R1 — A GENUINE AMBIGUITY, RECORDED AS AN OPEN DECISION RATHER THAN RESOLVED. The node declares mode 'dark-archive' and accent 'violet', while R1 places this scene in the FICTION register with the NEON palette. This passport's reading is that these are two DIFFERENT AXES and do not contradict. The node schema constrains mode to exactly two values, ['dark-archive', 'technical-plate'], and all nine nodes are dark-archive; two values, one of which is 'technical-plate', describe a RENDER SURFACE, not a content register, and the manifest's register vocabulary is a separate five-value system in which the word 'ficcion' appears nowhere in the node schema. The node schema likewise constrains accent to a fixed eight-name list [gold, red, violet, cyan, acid, magenta, indigo, bone] — SLOT NAMES, not hex values — so the node says which accent slot the concept owns and R1 supplies the palette that resolves it. THE READING IS NOT CERTAIN. A defensible contrary reading is that 'dark-archive' IS the archive's presentation register and that node-graph content therefore sits outside the manifest's documented/fiction split, making R1's fiction placement a category error rather than a binding ruling. Nothing in either repository defines mode or accent in prose; the enums are the only evidence, and enums do not state intent. The creator should say which reading is intended."
    - "CONCEPT ID — REVERSED ON NEW EVIDENCE, AND THE iMac LINEAGE WAS RIGHT. An earlier revision of this merge set conceptId to the organism slug descent-tunnel and recorded the iMac lineage's KDX-NODE-DNA-ASCENT as an unverifiable claim, because a full-tree grep found no such id and src/data/kodex/nodes/ did not exist on any branch then available. The node files were real; the loader bug meant nothing ever read them. conceptId is now the canonical node id. descent-tunnel remains the RENDERING anchor and is retained as a PRIMARY_CONCEPT sourceRef — but see the ACCENT CONFLICT note, which is a live argument that it may be the wrong organism for this node."
    - "R-OPEN 2 — MAPUCHE/FICTION BLEND ALREADY IN PRODUCTION. Recorded here because this passport is where it was found and because it constrains this scene. ManifestoSpiral3D.astro places its DNA station inside a fourteen-station Mapuche cosmology and asserts an 'authentic kultrun' with no ethnographic citation in 2555 lines. Under R1 that is a live two-register violation shipped today. It needs a cultural review as its own packet, not an agent fix, and DNA PASSAGE must not inherit the arrangement. Canon requires documented Mapuche material to be cited (COWORK-BRIDGE records 'mapuche=documentado citado (Canio & Pozo), review:true donde no verifique')."
    - "SCIENTIFIC CLAIM POLICY — THE LINEAGE DISAGREEMENT IS NOW DECIDED BY CANON, AND THE RECORD IS KEPT. iMac set SYMBOLIC_ONLY after an explicit supervisor patch that removed a 'Verified Strand' claim; macmini set MIXED_WITH_EXPLICIT_LABELS and argued that SYMBOLIC_ONLY forbids a biologically recognizable layer outright and thereby makes the 'explicitly separate the two layers' criterion vacuous, since you cannot separate verified geometry from symbolic geometry if the verified layer may not exist. The macmini version also specified the operational geometry gate (right-handed, ~10.5 base pairs per turn, strand phase offset ~140/220 degrees not 180, antiparallel strands, pitch-to-diameter ~1.7). The canonical node settles it in the macmini lineage's favour: KDX-NODE-DNA-ASCENT says VERIFIED biology in its summary, declares visualAnchor kind 'dual-reading' with the label 'capa verificada y capa simbolica, distinguibles', and states in its editorial body that the two layers coexist without fusing and that this separation is part of the work. The policy is therefore MIXED_WITH_EXPLICIT_LABELS and the geometry gate is reinstated. The supervisor patch's underlying concern survives intact: nothing generated may be presented as measurement, and geometry that fails the gate loses the right to be called DNA. See the SCIENTIFIC CLAIM POLICY note above for what to do if the creator wants SYMBOLIC_ONLY back."
    - "CONCEPT ID / RENDERING ORGANISM — the conceptId question is closed (see CONCEPT ID above); what remains open is which ORGANISM renders this node. descent-tunnel is used because it is the only one of the eight whose role is traversal through depth ('profundidad infinita', states DESCEND/ABSORB), which is what a passage is. The contrary evidence is stated plainly and is now stronger than before: NO organism is named DNA PASSAGE; the canonical DNA volumes (fic-diseno-humano-adn, lore-4-el-diseno-original) declare their resonances to signal-bloom and cosmology-core, NOT to descent-tunnel; and the node's own accent 'violet' does not exist in descent-tunnel's neon palette while it does exist in cosmology-core's. A defensible alternative is a descent-tunnel traversal whose loci resonate to signal-bloom and cosmology-core, which is effectively what this passport describes. The creator should rule, because the choice changes the fx_chain, the state vocabulary and the accent resolution."
    - "PASSPORT ID — LINEAGE DISAGREEMENT. iMac used VP-DNA-PASSAGE-V1, macmini used KDX-VP-DNA-PASSAGE-V1. Neither lineage is authority here; ops/factory/VISUAL_PASSPORT_TEMPLATE.yaml is, and it prescribes the prefix KDX-VP-. That is what this file uses. Flagged rather than assumed."
    - "MEMORY KEY — LINEAGE DISAGREEMENT, RESOLVED ON EVIDENCE. iMac specified an ad-hoc key kodex-dna-passage-traversed; macmini specified sourcesOpened. schemas/session-memory.schema.json declares sourcesOpened with uniqueItems true and sets additionalProperties false, so the ad-hoc key would be rejected by the repository's own schema. The schema-valid key is used and the iMac choice is recorded here. Note the semantic shift this carries: the iMac key recorded traversal, the macmini key records provenance-opening, and only the latter is permitted to write under ADR-0010."
    - "SCHEMA ENVELOPE — LINEAGE DISAGREEMENT. The iMac file was a bare top-level mapping; the macmini file used the schema_version / visual_passport envelope. The envelope is kept because ops/factory/VISUAL_PASSPORT_TEMPLATE.yaml uses it and the contract validator reads the passport at the visual_passport key."
    - "OTHER LINEAGE DISAGREEMENTS CARRIED AS-IS. medium: iMac WEBGL, macmini HYBRID — WEBGL is kept per the iMac skeleton, though the scene is specified so that the static/SVG path is fully functional, which is closer to HYBRID in substance; the implementation packet should confirm the declaration. interaction.inputs: iMac declares POINTER/TOUCH/KEYBOARD, macmini adds TIME for ambient decay — the iMac set is kept even though decay is specified in motion. reusableEngineBoundary name HelixPassage is the one identifier both lineages already agreed on. targetCaptures: iMac's desktop_wide 1920x1080 is kept and macmini's desktop-1440x900 added, because the grafted reviewChecks are written against 1440x900."
    - "ENGINE DIVERGENCE — ESCALATED, NOT DECIDED. The canonical grammar declares one engine: 'un motor (KDX CORE) + una suite de 8 tratamientos GPU'. The shipped DNA passage does not use it. ManifestoSpiral3D.astro runs three.js + gsap + lenis (~500kb, dynamic-imported) with its own EffectComposer/UnrealBloomPass stack, while the KDX CORE candidate (kodex-observe-v2-client.ts) is a hand-written WebGL2 six-pass pipeline with no third-party dependency. Consolidating onto KDX CORE would honour the grammar and reuse existing shaders but would require re-authoring an approved visual; keeping three.js preserves the approved visual but institutionalises a second engine and a 500kb budget. This is an architecture decision above this packet's authority."
    - "SHADER GAP — descent-tunnel's canonical fx_chain is [chromatic-split, pixel-sort]. chroma.frag.glsl exists and covers chromatic-split. THERE IS NO PIXEL-SORT SHADER. Full audit of the 8 canonical treatments against src/kodex/observe-v2/shaders/: crt-scan -> crt.frag EXISTS; bitmap-threshold -> threshold.frag EXISTS; memory-feedback -> feedback.frag EXISTS; chromatic-split -> chroma.frag EXISTS; glitch-fracture -> displace.frag PARTIAL/approximate; dither-matrix, thermal-map and pixel-sort have NO shader. This passport therefore cannot claim 'no new shader is required'. Either pixel-sort is written, or the chain is substituted, and that is the orchestrator's call. This is one of the four treatments R4 track 3 identifies as missing."
    - "PROVENANCE QUESTION — SOURCE PDFs ARE ABSENT. The manifest cites the Codex Estelar chapters to absolute paths under an Obsidian vault which DOES NOT EXIST on this machine (verified). Only the derived .txt files under public/kodex-content/books/kodex-estelar/source-text/ are present, and those were read. Since the passport's reading of the lore matters to the design — the 'Simbolo Visual: Espiral doble de ADN dorado brillante' line is why an amber/gold strand is treated as canonical — the creator should confirm the .txt derivation is faithful to the PDFs."
    - "COORDINATE — coordinateAssignment stays null. ADR-0010's concept assignment law requires creator approval before any A-Y letter is assigned, and no canonical source assigns one. Note the specific temptation this scene creates and rejects: a passage with ordered loci looks like it wants to be a lettered sequence. It is not one, and reviewChecks tests for that explicitly."
    - "DEPENDENCY — source opening cannot be implemented before KOD-28 (JourneyState + EventTrace) lands, because idempotent replay by event identity is what keeps the memory write from double-writing."
    - "PERFORMANCE RISKS — why implementation.performanceRisk is HIGH. (1) The only shipped implementation loads ~500kb of three.js + gsap + lenis plus a full postprocessing composer, and additionally fetches a GLB model at runtime; that is already the heaviest scene in either repository. (2) It builds up to 9000 connective-thread points, 1008 eye-net instances, 3000 starfield points and 6000 galaxy particles on desktop, with an UnrealBloomPass over all of it. (3) It never releases its WebGL context on scroll-out — only pause() is called — so with token performance.maxActiveHeavyCanvases at 1, any second heavy scene on the same page is a violation by construction. (4) The unremoved ticker callback and smooth-scroll subscription mean the leak compounds per mount rather than staying constant. (5) Smooth-scroll hijacking of the window is itself a main-thread cost and interacts badly with the keyboard model this passport requires. (6) The helix is a stroked/swept curve whose cost scales with sample count on every frame, and the static SVG path builds ~447 samples per strand plus ~74 rungs at DOM level, which must not be rebuilt on resize. (7) If HelixPassage is instead built on KDX CORE, risk drops toward MEDIUM — which is itself an argument for the consolidation decision above."
    - "IMPLEMENTATION PACKET RECOMMENDATION — split into three, in this order. (a) C1, ORCHESTRATOR/architecture: rule the engine question — KDX CORE versus three.js — and, if KDX CORE, rule the pixel-sort shader gap. Blocking for (b). (b) C2, producer BOUNDED_CODING_AGENT, reviewer LONG_CONTEXT_ARCHITECT: build HelixPassage with locus invariance across viewports, the full keyboard model, the static/SVG parity path, the register marking, and an explicit destroy() with a test asserting zero remaining listeners, tickers, subscriptions and undisposed textures. No new visual invention. (c) C1, MULTIMODAL_VISUAL_SPEC: visual review against reviewChecks at the target captures, after (b). Do not issue (b) until R-open 1 is answered. The register question that previously blocked everything is now closed by R1. A separate packet is worth opening for the leaks listed under DEFECTS, since they affect production today and are independent of DNA PASSAGE; and R-open 2 needs its own cultural-review packet."
    - "DEFECTS FOUND IN EXISTING CODE — reported, not fixed, since this packet may not edit runtime code. (1) kodex-observe-v2-client.ts bindEvents() registers addEventListener('resize', ...) and document.addEventListener('visibilitychange', ...) as anonymous arrows and never removes them; stop() only cancels the RAF and timeouts and there is no destroy path, so a second mount leaks listeners and a WebGL context. (2) ManifestoSpiral3D.astro has a real dispose(), but gsap.ticker.add(...) is never removed and the retained closure keeps calling lenis.raf() on a Lenis instance dispose() already destroyed; lenis.on('scroll', ScrollTrigger.update) has no matching off(); gsap.ticker.lagSmoothing(0) is a global mutation never restored. (3) The same dispose() disposes only material.map, never emissiveMap, bumpMap or shader-uniform textures, so the DNA ribbon texture, the serpent maps and the kultrun emissive maps are never freed. (4) dispose() is reachable only from a pagehide listener; the IntersectionObserver's exit branch calls pause() only, so the WebGL context and all GPU memory survive for the rest of the page life once the section is scrolled past. There is no visibilitychange listener anywhere in the file, and renderer.forceContextLoss() is never called. (5) ManifestoSpiral.astro registers window 'scroll' and 'resize' listeners and never removes them. (6) The shipped DNA passage has ZERO keyboard affordance — no keydown handler, no tabindex, no focusable control — so the whole scene is pointer/scroll-only, which fails the packet's own equivalence criterion in production today. (7) ManifestoSpiral3D.astro's header comment (lines 15-17) describes the DNA as 'MeshPhysicalMaterial iridescent strands' with 'base pairs as glowing sacred-geometry star-cross Sprites'; the implementation actually uses MeshStandardMaterial ribbons with BoxGeometry bars and SphereGeometry junctions, and no Sprites. Documentation that contradicts the code it documents is a maintenance hazard worth a one-line fix. (8) COWORK-BRIDGE.md prescribes 'Datos vivos' — core temp 87.3K, field stability 94.6%, quantum noise 2.7dB, signal 87.6%, timeline drift 0.0009% — which are near-verbatim instances of the pseudo-metrics canon/KODEX_EPISTEMIC_STANDARD.md prohibits. This is a canon-versus-working-document conflict, not a code bug, and the bridge should be annotated so no future scene implements it."
    - "EVIDENCE — sources actually inspected are listed file-by-file in sourceRefs, and every file named there was read. Deliberately NOT inspected or not available: no concept/reference image of any kind (none reached this worker); public/kodex-content/art/ does not exist on this machine; the Obsidian vault PDFs do not exist on this machine; and the chatgpt-file-library asset carried from the iMac lineage is not present here. The two ear-piercing assets public/img/piercing/types/helix.avif and forward-helix.avif were located, identified as unrelated product photography, and excluded."
