schema_version: 1
visual_passport:
  passportId: "KDX-VP-DNA-PASSAGE-V1"
  conceptId: "descent-tunnel"
  title: "DNA PASSAGE"
  status: "DRAFT"
  semanticPurpose: "To use the recognizable double-helix form as a biological reference primitive while keeping KODEX lineage, ascent and memory language explicitly symbolic. Composed as a data-driven preset of the canonical `descent-tunnel` organism (manifest organismos[03], role 'profundidad infinita', states DORMANT / DESCEND / ABSORB, verbs accelerate / distort / absorb), whose wall is the helix, so that descent through depth and descent through scale are the same movement."
  nodeQuestion: "¿Qué cambia cuando una forma biológica reconocible se lee también como símbolo, sin confundir una lectura con la otra?"
  coordinateAssignment: null
  sourceRefs:
    - id: "ops/factory/packets/KOD-39.yaml (KDX-WP-VISUAL-02)"
      relation: "PRIMARY_CONCEPT"
      rightsStatus: "CLEAR"
      notes:
        - "The exact string 'DNA PASSAGE' occurs in no file of kodex-minus-infinity or wenu-frontend except this packet. Verified by full-tree grep of both repositories."
        - "The packet's source_inputs name 'actual DNA PASSAGE concept/reference images available to the visual worker'. No image set reached this worker; no image was inspected. See R-OPEN 1."
        - "The absence of images did NOT leave this passport ungrounded: a shipped, approved implementation of a DNA passage exists in wenu-frontend and is the primary anchor below."
    - id: "kodex-node-dna-ascent (claimed canonical node KDX-NODE-DNA-ASCENT)"
      relation: "PRIMARY_CONCEPT"
      rightsStatus: null
      notes:
        - "Carried from the iMac lineage, which anchored the passport on a canonical node KDX-NODE-DNA-ASCENT said to live at src/data/kodex/nodes/dna-ascent.json, with a violet accent, and noted that the packet title is DNA PASSAGE while the canonical node title is DNA ASCENT."
        - "NOT VERIFIABLE ON THIS MACHINE. A full-tree grep of kodex-minus-infinity and kodex-work finds no occurrence of KDX-NODE-DNA-ASCENT or dna-ascent, and src/data/kodex/nodes/ does not exist. Recorded as an unresolved lineage claim, not as evidence. See the CONCEPT ID note."
    - id: "wenu-frontend src/components/ManifestoSpiral.astro"
      relation: "PRIMARY_CONCEPT"
      rightsStatus: "CLEAR"
      notes:
        - "Read in full (260 lines). Header: 'ManifestoSpiral.astro — the DNA-helix cosmos journey (from a dream, 2026-07). Opening of /manifesto. Earth at the top; scrolling down travels out through the scales — atom, seed, cell, THE SOURCE, planets, sun, galaxy — and pours into a black hole at the bottom. Two strands: gold (organic/DNA) + cyan (cybernetic/informatic).'"
        - "This is the DEFAULT served visual for /manifesto and the no-WebGL / reduced-motion / <360px fallback for the 3D version. Hand-coded inline SVG, no dependencies."
        - "Measured geometry: cx=190, yTop=150, yBot=1490, k=0.0225 rad/px, y step 3px. Total twist (1490-150)*0.0225 = 30.15 rad = 4.80 turns. Rungs every 6th sample = every 18px = 0.405 rad, i.e. ~15.5 rungs per turn, ~74 rungs total. Amplitude envelope amp(y)=12+62*((yBot-y)/(yBot-yTop))^0.72 — wide at Earth, narrowing into the black hole."
        - "Strand pair is P1 = cx + a*sin(th), P2 = cx - a*sin(th) — an exact pi phase offset, which yields two IDENTICAL grooves. Real B-DNA has unequal major/minor grooves. This helix is therefore a symbolic form, not a biologically accurate one. That is correct for its register; see reviewChecks."
        - "Stations, in served order: Earth / LA TIERRA, Atom / EL ATOMO, Seed / LA SEMILLA, Cell-DNA / LA CELULA, The Source / LA FUENTE, Planets / LOS PLANETAS, Sun / EL SOL, Galaxy / LA GALAXIA, Black Hole / EL AGUJERO NEGRO. Bilingual EN + ES on every station."
        - "Strand colours as shipped: gold #c9a84c / #e8c766 (organic) and teal-cyan #64e0d0 / #7fe9db (cybernetic). These are wenu-frontend BRAND tokens (ember #c9a84c). Under ruling R1 this scene is fiction-register and the brand palette is not what it uses; see the PALETTE note."
        - "Accessibility as shipped: a real .sr-only paragraph describes the whole journey; prefers-reduced-motion disables every animation. There is no keyboard interaction because there is no interaction at all beyond scroll reveal."
        - "DEFECT: window 'scroll' and 'resize' listeners are registered and never removed; there is no teardown. Reported, not fixed."
    - id: "wenu-frontend src/components/ManifestoSpiral3D.astro"
      relation: "PRIMARY_CONCEPT"
      rightsStatus: "REVIEW_REQUIRED"
      notes:
        - "Inspected in detail (2555 lines), read-only. WebGL 'visionary' upgrade of the same journey; header says 'Ocin's dream, prototype v5 — audited + approved, 2026-07-18', ported 1:1 from a prototype index.html."
        - "14 stations, chapter I..XIV, expressed as Mapuche cosmology: I Wenu Mapu, II Antu, III Rupu, IV Kuyen, V Nag Mapu, VI the descent toward Minche Mapu, VII Kutral, VIII Kuruf, IX Ko, X Kura, XI Meli Witran Mapu, XII The cosmic code, XIII Itrofill Mongen, XIV Minche Mapu."
        - "UNDER RULING R1 THIS IS A LIVE TWO-REGISTER VIOLATION IN PRODUCTION, not merely a question. DNA PASSAGE must not inherit that arrangement. It is R-open 2 in the creator rulings and needs a cultural review, not an agent fix."
        - "The DNA object: turns 4.2, radius 8.5, spans world y -164 to -256. Strands are flat ribbons (custom BufferGeometry, width 1.8, MeshStandardMaterial emissive #a8c4ff) plus additive glow TubeGeometry radius 1.2. Base pairs are two BoxGeometry bars + two SphereGeometry junctions per rung."
        - "Second strand is generated at `ang + Math.PI` — again an exact pi offset, again equal grooves."
        - "Base-pair COUNT CHANGES WITH VIEWPORT: STEPS 200 desktop / 110 mobile with a rung every 6th sample gives 34 base pairs on desktop and 19 on mobile — 8.1 and 4.5 per turn respectively, against ~10.5 in real B-DNA. A structure whose base-pair count depends on screen width is decorative by construction."
        - "There is NO ethnographic or cultural citation anywhere in the file. Line 829 asserts an 'authentic kultrun drumhead — audited pass' without naming a source."
        - "Interaction: pointermove only (eye-net pupil tracking, idle drift after 2s). Lenis smooth-scroll hijacks the window. ZERO keyboard handlers, zero tabindex, zero focusable control in the enhanced block. No storage, no fetch, no analytics — nothing is persisted."
        - "No numeric readout is displayed anywhere; the progress rail is a CSS width only and is never rendered as text. This is good and must be preserved."
        - "Capability gate: the SVG fallback is served when prefers-reduced-motion is set, OR innerWidth < 360, OR neither webgl2 nor webgl can be obtained, OR any exception. lowPerf does NOT gate the fallback; it only forces the lighter preset."
        - "Dependencies: three, three/addons postprocessing (EffectComposer, RenderPass, UnrealBloomPass, ShaderPass, OutputPass), GLTFLoader, gsap, gsap/ScrollTrigger, lenis — all dynamic-imported inside an IntersectionObserver. The file states ~500kb. Also fetches /models/serpent_head_r2.glb at runtime."
        - "It HAS a real dispose() (renderer.dispose, composer.dispose, lenis.destroy, scene traverse, ScrollTrigger kills, listener removal). See notes for exactly what it still leaks."
    - id: "wenu-frontend src/pages/manifesto.astro"
      relation: "REFERENCE"
      rightsStatus: "CLEAR"
      notes:
        - "The only consumer of ManifestoSpiral3D, which in turn renders ManifestoSpiral as its poster/fallback. Confirms the passage is shipped, not a sketch."
    - id: "wenu-frontend public/kodex-content/manifest.json — organismos[03] descent-tunnel"
      relation: "PRIMARY_CONCEPT"
      rightsStatus: "CLEAR"
      notes:
        - "rol: 'profundidad infinita'. estados: DORMANT / DESCEND / ABSORB. verbos ES: acelera, distorsiona, absorbe. EN: accelerate, distort, absorb."
        - "Canonical paleta: #FF5A00, #FF2028, #FFB000, #0A0A0A. Under ruling R1 these are the neon values this passport uses. Canonical fx_chain: [chromatic-split, pixel-sort]. Canonical audio routing: 'low-mid+velocidad'."
        - "This is the only one of the 8 organisms whose role is traversal-through-depth, which is why DNA PASSAGE is specified as its preset. NO organism is named DNA PASSAGE; see the CONCEPT ID note."
    - id: "wenu-frontend public/kodex-content/manifest.json — volume fic-diseno-humano-adn"
      relation: "PROVENANCE"
      rightsStatus: "CLEAR"
      notes:
        - "THE governing canonical statement for this passport. curaduria_en verbatim: 'Two distinguished layers: documented DNA (double helix = 1-spiral) and the esoteric Human Design reading. Never blended.' ES: '...Nunca se funden.'"
        - "fuente field verbatim: 'ADN: ciencia. Diseno Humano: esoterico.' — canon already splits the science layer from the esoteric layer by name."
        - "registro: ficcion. marco: ficcion. paleta: neon. resonancias include signal-bloom and cosmology-core. This is one of the two anchors for ruling R1's placement of DNA PASSAGE in the fiction register."
    - id: "wenu-frontend public/kodex-content/manifest.json — Codex Estelar Libro IV volumes"
      relation: "PROVENANCE"
      rightsStatus: "REFERENCE_ONLY"
      notes:
        - "lore-4-el-diseno-original, lore-4-la-geometria-del-alma, lore-4-merkabah, lore-4-respiracion-primordial, lore-4-llama-del-corazon. Book IV is titled 'El ADN Sagrado y el Cuerpo de Luz'."
        - "Every one carries registro: ficcion, marco: ficcion, paleta: neon, and nota_registro 'ficcion/esoterico de autor, presentado como lore, sin claims de hecho ni de salud' — no claims of fact OR HEALTH. The health clause is load-bearing and is carried into epistemicConstraints."
        - "Parent volume vol-codex-estelar states '(Ficcion/esoterica: separada de la cosmovision mapuche documentada.)'"
    - id: "wenu-frontend public/kodex-content/books/kodex-estelar/source-text/libro-4/01-el-diseno-original.txt"
      relation: "PROVENANCE"
      rightsStatus: "REFERENCE_ONLY"
      notes:
        - "Primary lore text, READ IN FULL by this worker. It supplies the canonical visual instruction for this concept, verbatim: 'Simbolo Visual: Espiral doble de ADN dorado brillante, flotando en el espacio.' — a brilliant golden DNA double spiral floating in space."
        - "That line is why a gold/amber strand is treated in this passport as canonical expression rather than as an arbitrary colour choice. Under R1 it is realised in the neon amber #FFB000, not in the wenu brand gold #c9a84c."
        - "The same text asserts 'el ADN es energia', 'Matrix 5D', 'objetos hiperespaciales', and chapter II asserts 'los codigos dormidos del ADN se encienden' and 'Tu ADN vibra segun proporciones numericas'. These are MYTHOPOETIC claims in the fiction register and are the exact material the epistemic constraints exist to contain."
        - "The Obsidian vault PDFs that the manifest names as the origin of these texts DO NOT EXIST on this machine. Only the derived .txt files are present. Verified."
    - id: "wenu-frontend public/kodex-content/manifest.json — sistemas.gramatica and sistemas.registro_vocabulario"
      relation: "DESIGN_SYSTEM"
      rightsStatus: "CLEAR"
      notes:
        - "gramatica verbatim: 'un motor (KDX CORE) + una suite de 8 tratamientos GPU (KDX FX SUITE), 8 organismos = presets data-driven. Cualquier tratamiento se aplica a cualquier organismo.' This is the authority for specifying DNA PASSAGE as a preset of an existing organism, not a new renderer."
        - "registro_vocabulario declares five registers: documentado, mito, esoterico, ficcion, estructura. 'ficcion' is defined as 'Nunca se mezcla con lo documentado ni con lo mapuche.'"
        - "manifest.note verbatim: 'Dos registros siempre marcados: DOCUMENTADO (paleta marca) y MITO/FICCION (paleta neon). Mapuche y Codex Estelar NUNCA se mezclan.'"
    - id: "kodex-minus-infinity packages/recovered/helix-transparent-v1/ (PROTO-CANVAS-001)"
      relation: "REFERENCE"
      rightsStatus: "CLEAR"
      notes:
        - "Read in full: helix.js, index.html, README.md. Registered in data/registries/prototypes.yaml as PROTO-CANVAS-001 'KODEX Helix Transparent', family transparent_line_organism, status SOURCE_MIGRATED, and checksummed in data/registries/package-checksums.yaml as PKG-HELIX-TRANSPARENT-V1 sha256 79e52eed4d867ea7fdca6e8a132897333eb901beca2c971a9907bf378cb4c98c."
        - "IMPORTANT AND EASY TO MISREAD: this prototype is NOT a DNA double helix. It is a lobed spindle surface of revolution — 34 meridians x 32 parallels, turns 3.0, verticalSteps 180, baseRadius 0.245, heightRatio 0.84, perspective 3.8 — with progressive twist. It is a twisted lattice, not a base-paired duplex. It must not be presented as DNA."
        - "What it DOES contribute: a proven perfect-loop discipline (phase runs exactly 0 -> 2pi over 240 frames at 30fps, so the loop closes with no seam), a transparent-canvas method (ctx.clearRect each frame, alpha preserved), and depth by painter's-algorithm z-sorting of stroked paths. All three are adopted in motion.loopingBehavior and composition.depthModel."
    - id: "wenu-frontend COWORK-BRIDGE.md"
      relation: "RESEARCH"
      rightsStatus: "REFERENCE_ONLY"
      notes:
        - "Line 173 establishes the archetype code: 'SPIRAL a 1-espiral'. SPIRAL is one of the 7 constellation glyphs that index the universe (SEED, WITNESS, SPIRAL, MIRROR, LATTICE, VOID, ANCHOR)."
        - "Line 511 verbatim: 'ADN = 1-espiral (doble helice)'. Line 526: 'F7. DISENO HUMANO + ADN: diseno humano (esoterico) + ADN documentado (doble helice = 1-espiral) — distinguir las dos capas.' The two-layer rule appears independently in two places."
        - "Line 175 is the counter-example this passport refuses: it prescribes 'Datos vivos: core temp 87.3K, field stability 94.6%, dark flow 13.7%, quantum noise 2.7dB, timeline drift 0.0009%, signal 87.6%'. These are almost verbatim the values canon/KODEX_EPISTEMIC_STANDARD.md lists as PROHIBITED pseudo-metrics. Canon overrides the bridge."
    - id: "wenu-frontend src/pages/kodex/folio/[folio].astro"
      relation: "REFERENCE"
      rightsStatus: "CLEAR"
      notes:
        - "folio ii is the shipped descent scene: slug 'descent', motif 'descent-tunnel', title 'THE TREE DESCENDS TO HOLD WHAT RISES.', cta 'DESCEND'."
        - "Its meta row declares 'MODE · STEPWISE' and 'SKIP · INDEX'. The shipped descent already treats stepwise progression and an always-available skip as first-class. This passport makes that mandatory rather than decorative, because it is what keeps traversal non-compulsory under ADR-0010."
    - id: "wenu-frontend src/components/kodex/scenes/kodex-observe-v2-client.ts"
      relation: "REFERENCE"
      rightsStatus: "CLEAR"
      notes:
        - "KdxObserveV2Runtime — the shipped KDX CORE candidate: WebGL2 six-pass pipeline source -> displace -> threshold -> chroma -> feedback -> crt, ping-pong framebuffers, fullscreen triangle."
        - "resolveProfile(): reduced-motion -> low-power; mobile (max-width 760px) with dpr > 2 -> low-power; mobile -> balanced; else dpr > 1.65 ? balanced : full. DPR capped at 1.5 (full) / 1.2 (otherwise)."
        - "Supports ?fallback=1 and ?debug=1. The DOM fallback layer is always rendered; the canvas only gains .is-active when WebGL2 initialises. This is the proven progressive-enhancement pattern adopted in fallback.noWebGL."
        - "DEFECT: bindEvents() registers addEventListener('resize', ...) and document.addEventListener('visibilitychange', ...) as anonymous arrows and never removes them. stop() only cancels the RAF and timeouts. There is no destroy path. Verified at lines 253-258 and 247-251."
    - id: "wenu-frontend src/kodex/observe-v2/shaders/*.glsl"
      relation: "REFERENCE"
      rightsStatus: "CLEAR"
      notes:
        - "Verified present: fullscreen.vert.glsl, source.frag.glsl, displace.frag.glsl, threshold.frag.glsl, chroma.frag.glsl, feedback.frag.glsl, crt.frag.glsl."
        - "Treatment-to-shader map for the 8 canonical treatments: crt-scan -> crt.frag (EXISTS); bitmap-threshold -> threshold.frag (EXISTS); memory-feedback -> feedback.frag (EXISTS); chromatic-split -> chroma.frag (EXISTS); glitch-fracture -> displace.frag (PARTIAL, approximate only); dither-matrix -> NO SHADER; thermal-map -> NO SHADER; pixel-sort -> NO SHADER."
        - "Consequence for this scene: descent-tunnel's canonical fx_chain is [chromatic-split, pixel-sort]. chroma.frag covers the first. PIXEL-SORT HAS NO SHADER and would have to be written or substituted. This is stated plainly rather than assumed away."
    - id: "kodex-design-tokens (kodex-minus-infinity design-system/tokens/kodex.tokens.json)"
      relation: "DESIGN_SYSTEM"
      rightsStatus: "CLEAR"
      notes:
        - "Carried from the iMac lineage, which recorded it as providing violet, cyan, bone, acid and obsidian signal roles."
        - "Authoritative for space, line, duration, easing, layout and performance tokens. performance.maxActiveHeavyCanvases = 1 and mobileDprCap 1.2 / desktopDprCap 1.65 are treated as binding."
        - "Its COLOUR tokens are the BRAND palette and are NOT authoritative here: ruling R1 places this scene in the fiction register, whose palette is neon. Brand-token neighbours are cited beside each neon value for traceability only."
        - "notes field verbatim: 'Color may not carry essential meaning alone.' and 'Typography families are intentionally omitted until font rights are approved.' — hence every paletteRole sets colorIsNotOnlyChannel true, typographyRoles name no family, and the register marker is carried in words."
    - id: "kodex-minus-infinity docs/decisions/ADR-0010-ALPHABETIC-MULTIVERSE-A-M-Y.md"
      relation: "RESEARCH"
      rightsStatus: "CLEAR"
      notes:
        - "Concept assignment law — B-L and N-X meanings are not invented to complete a list, so coordinateAssignment stays null."
        - "'A linear A->B->C sequence. Rejected. The alphabet defines the available conceptual universe, not a mandatory order.' This is the direct constraint on a scene that is literally a sequence of rungs and stations."
        - "'Passive pointer movement alone cannot make identity claims or write consequential personal memory.' Governs the atmospheric/consequential split."
        - "Return-anchor law: 'leaving M restores the exact prior node, focus, state and route anchor.' Governs exitBehavior."
    - id: "kodex-minus-infinity canon/KODEX_EPISTEMIC_STANDARD.md"
      relation: "RESEARCH"
      rightsStatus: "CLEAR"
      notes:
        - "Claim classes OBSERVED and MYTHOPOETIC are the two this scene must hold apart; the standard requires MYTHOPOETIC be 'preserved as symbolic discourse' and never converted into scientific fact."
        - "Prohibited pseudo-metrics, metric admission, and the visual-truthfulness rules — in particular 'Particle density cannot imply a count unless particles encode units' and 'Animation cannot manufacture a trend' — govern every generated element in this scene."
        - "'Provenance interaction: every canonical visualization must provide at least one route to inspect sources.' This is why the scene's consequential action is opening a source, not travelling."
    - id: "kodex-minus-infinity schemas/session-memory.schema.json"
      relation: "DESIGN_SYSTEM"
      rightsStatus: "CLEAR"
      notes:
        - "sourcesOpened is declared as an array with uniqueItems true, which makes the memory write specified below idempotent by construction rather than by convention. additionalProperties is false, so only a declared key may be written."
    - id: "chatgpt-file-library:file_00000000428081fba426a0a5aa5bc7a7"
      relation: "REFERENCE"
      rightsStatus: null
      notes:
        - "Carried from the iMac lineage. Exact project asset it names: Paneles cosmicos del Codex Infinito.png."
        - "Claimed to contain a DNA ASCENT panel with a luminous double helix, vertical traversal composition and pseudo-telemetry such as VITALITY 78.4%."
        - "NOT INSPECTED BY THIS WORKER and not present on this machine. The asset identifier is carried verbatim; its content, generation and rights provenance must not be inferred from this record."
        - "Note that the VITALITY readout it describes is exactly the kind of value epistemicConstraints forbids this scene from rendering."
    - id: "wenu-frontend public/kodex-content/art/ and any concept/reference imagery"
      relation: "REFERENCE"
      rightsStatus: "UNKNOWN"
      notes:
        - "LOOKED FOR AND NOT FOUND. The directory public/kodex-content/art/ does not exist on this machine, so no artwork cover referenced by the manifest could be opened."
        - "A filesystem search for dna/helix/espiral/adn image assets returned only public/img/piercing/types/helix.avif and forward-helix.avif — ear-piercing product photography, unrelated to this concept. Recorded so that a later worker does not mistake them for references."
        - "No image informed this passport. Any resemblance to a specific external work found at implementation time is an invention introduced downstream and must be rejected at visual review."
  provenanceBoundaries:
    mayAbstract:
      - "Double-helix silhouette as a generic biological reference form. The form is not owned by anyone; only a specific rendering of it could be."
      - "Dual-strand spacing and rung rhythm as geometric structure"
      - "Vertical passage, depth and orbit/traversal composition"
      - "The scale-ladder composition already shipped in ManifestoSpiral.astro — a vertical traversal whose stations move between orders of magnitude — reused as structure, with this scene's own station set and copy."
      - "The organism's own canonical vocabulary: states DORMANT / DESCEND / ABSORB and verbs accelerate / distort / absorb."
      - "The perfect-loop discipline and transparent-canvas method of PROTO-CANVAS-001 (phase exactly 0 -> 2pi, ctx.clearRect per frame, painter z-sorting)."
      - "The progressive-enhancement pattern already proven in both repositories: a hand-coded static/SVG layer always rendered, the heavy engine attached only when capability allows."
      - "The bilingual ES/EN station copy pattern, and the register-marking pattern that canon already applies to every volume."
    mustNotCopy:
      - "Real nucleotide sequence data or base-pair listings unless separately sourced and licensed"
      - "Photographic or anatomical renderings of human cells/chromosomes from external references"
      - "Any branding, logo or distinctive sacred/ethnic lineage iconography in references"
      - "Pseudo-biological numbers such as vitality/coherence percentages as factual data"
      - "No external reference image reached this worker. Therefore no external artwork, frame, figure, poster or layout may be reproduced. This boundary is stated conservatively on purpose: nothing external may be reproduced because nothing external was seen."
      - "Do not reproduce a specific published scientific figure of DNA — no recreation of the Franklin Photo 51 X-ray diffraction pattern, and no redraw of a particular journal or textbook plate. If a real structural figure is ever wanted, it must be sourced, rights-cleared and cited first."
      - "Do not render a real, identifiable genomic sequence. No ACGT letter run, no chromosome ideogram, no accession number, no barcode-style sequence texture. Invented letters are pseudo-telemetry; real letters are somebody's data. Both are forbidden."
      - "No human body, face, silhouette or medical-scan imagery attached to the helix. The lore speaks of 'tu ADN' and 'tu cuerpo'; the scene must not personalize that onto the visitor or onto any identifiable person."
      - "Do not reproduce the kultrun drumhead, its four-direction cross, its choike terminals or its Antu / Kuyen / Melipal / Wunelfe quadrant motifs. They belong to the Mapuche documented register and must not be carried into a fiction-register scene."
      - "No link, quotation, citation or visual echo of any documented-register volume. Under R1 this scene is fiction-register and the two registers never mix."
      - "FX treatments must never be applied to Ocin's finished specimen artwork. Per the manifest's fx_chain_nota, treatments apply only to photographs and derivatives, never to the completed work."
    culturalSensitivity:
      - "RESOLVED BY RULING R1 — REGISTER IS FICTION. DNA PASSAGE sits in the marked-fiction register with the neon palette. The macmini lineage recorded this as the blocking open question; it is now closed. The sacred-DNA material that gives this concept its meaning is Codex Estelar Libro IV — registro ficcion, paleta neon — and fic-diseno-humano-adn is likewise registro ficcion, so the ruling matches the evidence."
      - "RESOLVED BY RULING R1 — ICONOGRAPHY FROM LIVING TRADITIONS. Any such iconography is handled as a GLYPH: named as a borrowing from the imaginary ('prestamo del imaginario') and never as that tradition's doctrine, and never as a claim about the origin of any species or any people. This is the position recorded in fic-razas-estelares-iconografia, and DNA PASSAGE inherits it rather than inventing its own. The Merkabah, the light body, prana breathing, Flower of Life, Metatron's cube and the Platonic solids named in the lore are glyphs in that sense: marked fiction-register symbols, never presented as mathematics, physics, anatomy or instruction."
      - "DNA PASSAGE must not link to, blend with, quote, cite or visually echo any documented-register volume, and above all not Mapuche material. Canon states it twice: 'Mapuche y Codex Estelar NUNCA se mezclan', and registro ficcion 'Nunca se mezcla con lo documentado ni con lo mapuche'. This scene therefore borrows NO Mapuche cosmology and must not inherit the fourteen-station Mapuche framing of ManifestoSpiral3D.astro."
      - "R-OPEN 2 IS A LIVE VIOLATION IN PRODUCTION, NOT A HYPOTHETICAL. ManifestoSpiral3D.astro places its DNA station — 'XII · The cosmic code / The spiral within' — inside a fourteen-station Mapuche cosmology running from Wenu Mapu to Minche Mapu, and asserts an 'authentic kultrun' with no ethnographic citation in 2555 lines. Under R1 that is a two-register violation shipped today. It needs a cultural review as its own packet; it is explicitly not an agent fix and it is not in scope here. DNA PASSAGE must not replicate the pattern."
      - "Mapuche material in KODEX is a DOCUMENTED register that requires citation. Canon's documented volumes cite their sources (COWORK-BRIDGE records 'mapuche=documentado citado (Canio & Pozo), review:true donde no verifique')."
      - "Do not substitute generic 'ancestral', 'tribal' or 'sacred geometry' motifs for the material this scene may not use."
      - "DNA as 'source code of life', ancestral memory or spiritual lineage must stay symbolic and must not be presented as biological fact. This passage is a KODEX model, not an ancestral-science claim."
      - "'DNA activation' is a real-world pseudo-medical claim. The lore's 'los codigos dormidos del ADN se encienden' may exist in the scene only as marked fiction. It must never be phrased as something the visitor can do, receive or measure. The manifest's own nota_registro binds this: 'sin claims de hecho ni de salud.'"
      - "The register marker must be carried TEXTUALLY, not by palette alone. The manifest marks register by palette; design-system/tokens/kodex.tokens.json requires that colour never be the only channel. The persistent words REGISTRO · FICCION / REGISTER · FICTION are the required non-colour channel."
