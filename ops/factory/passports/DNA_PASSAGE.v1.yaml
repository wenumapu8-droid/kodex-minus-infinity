      - "Helix Strand (Dual)"
      - "Rung"
      - "Locus Node"
      - "Focus Ring"
    topology: "Dual-strand vertical passage with repeated cross-rung structure. An OPEN, SINGLE-AXIS passage: bidirectional, leavable from any rung, never a closed loop, with irregular locus spacing so the passage cannot be read as a progress bar. The helix is a SYMBOLIC form throughout, not an accurate rendering of B-DNA: it makes no structural claim, and nothing in the scene may be captioned or narrated as displaying the molecule. Both currently shipped helices use an exact 180-degree strand offset, giving equal grooves, and neither has ~10.5 base pairs per turn (ManifestoSpiral ~15.5; ManifestoSpiral3D 8.1 desktop / 4.5 mobile), which is consistent with a symbolic form and inconsistent with a biological one."
    coordinateSystem: "Continuous 3D passage with bounded traversal along a primary axis. The axis parameter u runs 0 at entry to 1 at the final locus and is the single source of truth for position; the static/SVG path maps the same u to a viewBox y so the two paths agree locus-for-locus. Pointer normalized to [-1,1] with y negated, matching kodex-observe-v2-client.ts."
    spatialLayers:
      - "Background Void"
      - "Biological Reference Strand"
      - "KODEX Symbolic Overlay"
      - "Traversal Focus / Foreground Anchor"
  composition:
    focalStructure: "Central vertical passage; user position resolves the visible helix section. Exactly one locus is current at a time; the current locus and the strand-turns around it hold full contrast while the rest drops back, so position is legible without a numeric readout. The register marker is always at full contrast and never faded."
    grid: "Helical grid, two strands phase-offset around a shared axis, in a single centred column. Labels alternate left and right of the axis to avoid a centred stack, as the shipped SVG already does. Chrome sits outside the column and never overlaps the helix."
    depthModel: "Deep Z along the traversal axis with attenuation on distant rungs. Painter's-algorithm z-sorting per frame, as PROTO-CANVAS-001 already does, so the two strands genuinely wind around one another rather than crossing flat; depth is reinforced by draw order, stroke weight and opacity together."
    negativeSpace: "Black void between and beyond strands keeps symbolic overlays separate from biological-reference geometry. At least 55% of the column stays unmarked and the helix amplitude never reaches the column edge. Where a locus has no source record the space stays visibly empty and is marked UNKNOWN rather than filled."
    responsiveRules:
      desktop: "Full passage visible with wide aspect; pointer offset modulates camera/orbit without forcing sequence order. Pointer parallax is atmospheric only; every consequential action requires a commit."
      mobile: "Vertical slice of the passage; touch drag advances/orbits while keeping controls reachable without hover. LOCUS COUNT AND ORDER DO NOT CHANGE with viewport — only density and effects scale — so the scene means the same thing on every device, and rung density therefore carries no meaning. Hit targets are at least 44x44 CSS px at 390x844 and 412x915; if 44px cannot be met, spacing increases rather than the target shrinking. The register marker never collapses."
  paletteRoles:
    - role: "Passage Ground"
      semanticMeaning: "The void the passage descends through; the archive at rest"
      tokenOrRange: "neon ground #0A0A0A (manifest organismos[03].paleta). Brand-token neighbour color.field.obsidian (#050608) is NOT used — see the PALETTE note."
      colorIsNotOnlyChannel: true
    - role: "Biological Reference Strand"
      semanticMeaning: "Recognizable helix geometry derived from general biological form, not a displayed genetic dataset"
      tokenOrRange: "neon amber #FFB000 (manifest organismos[03].paleta) — the fiction-register realisation of the lore text's 'Espiral doble de ADN dorado brillante'. The shipped wenu BRAND gold #c9a84c / #e8c766 is NOT used, because the brand palette marks the documented register."
      colorIsNotOnlyChannel: true
    - role: "Symbolic Strand / Overlay"
      semanticMeaning: "KODEX lineage, memory and ascent symbolism"
      tokenOrRange: "neon orange #FF5A00 (manifest organismos[03].paleta). Brand-token neighbour color.signal.orange (#FF7A00) is NOT used; the iMac lineage's violet has no neon counterpart in this organism's palette."
      colorIsNotOnlyChannel: true
    - role: "Committed Rung / Current Locus"
      semanticMeaning: "The single rung the visitor has committed to reading"
      tokenOrRange: "neon red #FF2028 (manifest organismos[03].paleta). Brand-token neighbour color.signal.livingRed (#FF3833) is NOT used."
      colorIsNotOnlyChannel: true
    - role: "Register Marker — Fiction"
      semanticMeaning: "Persistent declaration that this scene is marked fiction, per the manifest requirement that both registers are always marked"
      tokenOrRange: "neon orange #FF5A00 on the neon ground #0A0A0A. The WORDS carry the meaning; colour is secondary and never sufficient on its own."
      colorIsNotOnlyChannel: true
    - role: "Unresolved / Unknown"
      semanticMeaning: "A locus with no source record, or a claim the epistemic standard marks UNKNOWN or CONTESTED"
      tokenOrRange: "neon amber #FFB000 at reduced alpha with a 4-2 dashed stroke and the visible word UNKNOWN"
      colorIsNotOnlyChannel: true
    - role: "Instrument Text"
      semanticMeaning: "Chrome, labels and non-factual readouts"
      tokenOrRange: "bone #E8E8E8 with a muted variant; never a neon signal colour, so chrome cannot be mistaken for state"
      colorIsNotOnlyChannel: true
  typographyRoles:
    - role: "Register Marker"
      behavior: "Mono, uppercase, letter-spaced, always adjacent to the passage chrome and never removed at any breakpoint. Carries the literal words REGISTRO · FICCION / REGISTER · FICTION. It is a text label first and a colour second, so register survives monochrome, and it is never abbreviated to a glyph."
    - role: "Passage Labels"
      behavior: "Monospaced labels distinguish BIOLOGICAL REFERENCE from KODEX SYMBOLIC content in words, not by colour or line treatment alone; invented numeric readouts are explicitly decorative. Bilingual EN over ES as the shipped SVG already does. Real DOM text at every viewport, never baked into a texture."
    - role: "Passage Position"
      behavior: "Mono, uppercase, low contrast, fixed corner. Names the locus, e.g. 'IV · LA FUENTE'. It must NEVER show a percentage, a count, a coordinate, a frequency or any other number, because a mono uppercase string in a fixed corner is exactly the shape a visitor reads as telemetry."
    - role: "Source Citation"
      behavior: "Reading-width prose, capped at token layout.maxReadingWidth (68ch). Shows the actual source record for the locus, including its register and its limitations, or the visible words NO SOURCE RECORDED. Never auto-summarised into a claim."
    - role: "Non-Factual Marker"
      behavior: "Any generated value that ever appears — and none should — must be preceded by a persistent marker (EN 'SIMULATED', ES 'ATMOSFERA'). The shipped DNA passage displays no numbers at all, which is the better answer and is the one this passport prefers: no number beats a marked number."
  motion:
    timescales:
      - "Ambient helix drift (slow) — token duration.ambient (12000ms) base period"
      - "Traversal/orbit response (user-driven) — token duration.micro (120ms) / duration.short (240ms)"
      - "Locus commit and release — token duration.medium (600ms)"
      - "Entry and exit of the passage — token duration.long (1600ms)"
    stateTransitions:
      - "Idle to Traversing (organism DORMANT -> DESCEND). Atmospheric; nothing is written."
      - "Traversing to Locked Rung (organism DESCEND -> ABSORB). Consequential."
      - "Traversing decays to Idle after 3200ms without input, matching kodex-observe-v2-client.ts. Position is not reset; only attention decays."
      - "The passage introduces no parallel state machine; it uses the organism's own three canonical states."
    loopingBehavior: "Subtle helix rotation and drifting locus markers; traversal remains user-controlled and non-compulsory. The passage itself does NOT loop — it is an open traversal and arriving at the end is not a completion. Only the ambient shimmer loops, seamlessly, using the PROTO-CANVAS-001 discipline (phase exactly 0 -> 2pi over a fixed frame count). The shimmer must never travel in a way that implies flow, transcription, replication or any directional biological process."
    reducedMotion: "Static helix, no camera ride or rotation, instant rung state changes; smooth-scroll interpolation disabled entirely, since hijacked scrolling is itself a motion effect. The static path is served, which is already the shipped capability-gate behaviour."
  interaction:
    inputs:
      - "POINTER"
      - "TOUCH"
      - "KEYBOARD"
    semanticActions:
      - "ATMOSPHERIC — advance or orbit through the passage by scroll, drag, arrow key or the locus index. Changes what is on screen and nothing else. Position is scene state, never a claim about the visitor, and is not written to memory. Required by ADR-0010: passive movement alone cannot make identity claims or write consequential personal memory."
      - "CONSEQUENTIAL — commit a rung read that exposes biological-reference versus symbolic labels."
      - "CONSEQUENTIAL — open the source record behind the current locus. This is the scene's only memory write, and it is deliberately the provenance action rather than the travel action, because the epistemic standard requires every canonical visualization to provide a route to inspect sources."
      - "CONSEQUENTIAL — exit the passage by Esc, the explicit exit control, or the skip-to-index control."
      - "EXPLICITLY NOT AN ACTION — scroll velocity, dwell time at a locus, how far along the passage the visitor reached, whether they reached the end, how many rungs they passed, pointer path shape. None may be recorded, scored, aggregated, ranked or used to infer anything about the visitor. Depth reached is not achievement and must never be presented as one."
    stateChanges:
      - "Pointer/touch drag changes traversal or orbit position."
      - "Click/tap or Enter/Space locks a rung and reveals its two explicitly labeled readings."
      - "Keyboard arrows cycle reachable rungs without implying an A-to-Z genetic sequence."
      - "Opening a source marks that locus's source as opened and appends to session memory."
      - "Reaching the final locus changes nothing except that there is no further locus. It does not set completionEligible, does not unlock anything, and does not write."
    memoryWrite:
      enabled: true
      key: "sourcesOpened"
      description: "Records that the user committed a traversal/rung-read interaction; it stores no genetic, biometric, spiritual or psychological inference. Only the source-opening commit writes: it appends the source id of the record behind the current locus to the session memory array sourcesOpened declared in schemas/session-memory.schema.json, which sets uniqueItems true so the write is idempotent by construction, and additionalProperties false so an ad-hoc key would be invalid. Traversal writes nothing. Nothing about progress, depth, speed, completion, duration or which reading the visitor preferred is ever written. No identity claim, score, ranking, profile, biometric value, genetic value, ancestry inference or 'activation' state is ever written — a scene about DNA must be held to this more strictly than any other, because the subject matter invites exactly the inference canon forbids. The visitor must be able to see and clear exactly what was written, and accessibility preferences are never inferred from behaviour."
    exitBehavior: "The helix recedes and symbolic overlays dissolve independently into the void. Exit restores the exact prior route anchor, node, focus and scroll position per the ADR-0010 return-anchor law; it is available from EVERY locus, is never gated on progress, and is never presented as abandoning something. Reaching the final locus is an ending of the scene and NOT a canonical completion: it does not constitute Y and must not be captioned as arrival, ascension, activation or awakening. Position and opened sources persist for the session."
  implementation:
    medium: "WEBGL"
    reusableEngineBoundary: "HelixPassage (handles strand instantiation, rung layout, traversal/orbit position and reduced-motion geometry independently of scene logic). It is a data-driven preset of the canonical descent-tunnel organism, not a new renderer, and it also owns locus placement along u with the guarantee that locus count and order never vary with viewport, the keyboard model, register marking, the static/SVG parity path and the full render-loop lifecycle. DISPOSAL IS A HARD REQUIREMENT: HelixPassage must expose an explicit destroy() that (a) cancels the animation frame and all timeouts; (b) removes EVERY listener it registered, including any animation-library ticker callback and any smooth-scroll subscription — the two that the shipped ManifestoSpiral3D.dispose() misses; (c) disposes geometries, materials AND every texture slot, not only material.map; (d) restores any global it mutated; and (e) is invoked when the scene leaves the viewport and on visibilitychange, not only on pagehide."
    sceneSpecificParts:
      - "KODEX symbolic overlay configuration"
      - "CRT/post-processing only when confirmed by the bounded implementation packet"
      - "The locus set: names, bilingual copy, order, irregular positions along u, and the source record behind each"
      - "The amplitude envelope amp(u) and the strand colour assignment"
      - "The persistent register marker and the bilingual state copy"
      - "The chrome layout: which rail, index, legend and exit controls this scene shows"
      - "The 55% negative-space and locus-spacing composition rules"
    dependencies:
      - "Existing KODEX organism/WebGL runtime"
      - "Existing KODEX lifecycle, input and fallback contracts"
      - "Existing shaders in src/kodex/observe-v2/shaders/ — chroma.frag.glsl covers chromatic-split"
      - "NO SHADER EXISTS for pixel-sort, the second half of descent-tunnel's canonical fx_chain. It must be written, or the chain must be substituted, and the choice is the orchestrator's. This is a real gap, not an oversight."
      - "Existing state and profile config in src/kodex/observe-v2/config.ts (resolveProfile, OBSERVE_V2_PROFILE_SCALE)"
      - "design-system/tokens/kodex.tokens.json for non-colour tokens"
      - "schemas/session-memory.schema.json for sourcesOpened"
      - "KOD-28 (JourneyState + EventTrace) — source opening depends on it for event identity, though sourcesOpened's uniqueItems constraint means a partial implementation degrades safely rather than double-writing"
      - "A ruling on the engine question before any renderer work begins; if KDX CORE is chosen there is no new third-party dependency, if three.js is chosen there are three"
    performanceRisk: "HIGH"
  fallback:
    noWebGL: "SVG/canvas or static raster of the double helix with semantic rung controls and explicit BIOLOGICAL REFERENCE / KODEX SYMBOLIC labels. This is already proven rather than hypothetical: ManifestoSpiral.astro is a complete hand-coded SVG rendering of this exact passage and is the shipped default whenever WebGL is unavailable. The static path must present the SAME loci in the SAME order with the SAME register marks, labels, source affordances, keyboard model and memory write. Only atmosphere is lost, ?fallback=1 forces it for review, and there must be no layout shift between paths."
    noAudio: "Layer labels, focus rings and state changes communicate passage behavior without sound. The organism's canonical audio routing ('low-mid+velocidad') is optional atmosphere only. One specific prohibition: that routing modulates by descent velocity, and the modulation must never be presented, captioned or heard as a measurement of anything — not a frequency, not a resonance, not a body state."
    staticMode: "A single detailed helix frame with keyboard/touch-accessible rung selection: all loci labelled and marked, both readings labelled, no drift, no shimmer, no parallax. This is the mode used to produce the target captures, so captures are reproducible and comparable across runs."
  accessibility:
    keyboardEquivalent: "Tab/arrow navigation cycles semantic rungs; Enter/Space commits the selected rung read. This is the single largest gap in the shipped implementation, which has ZERO keyboard handlers, no tabindex and no focusable control — the passage is currently reachable only by scrolling, and HelixPassage must fix it. The passage is one composite widget with a single tab stop and roving tabindex; Home and End move to the first and last locus; Esc exits; and a skip-to-locus-index control is the FIRST focusable element, which is what makes the traversal genuinely non-compulsory. Smooth-scroll interpolation must never swallow or delay keyboard navigation."
    touchEquivalent: "Drag controls traversal/orbit and tap commits a rung without requiring hover. No long-press, pinch, multi-touch gesture or horizontal swipe is required for anything consequential. Hit targets are at least 44x44 CSS px, which is the binding constraint on locus spacing at 390x844 and 412x915. Smooth-scroll momentum must not make it impossible to stop at a locus."
    screenReaderAlternative: "Live region announces traversal position and whether content is biological-reference or KODEX-symbolic. The passage is exposed as an ordered list of loci; each carries its position ('locus 5 of 9'), its bilingual label, its REGISTER in words and whether its source has been opened. A full text alternative for the whole passage is available on demand and contains the same loci, registers, readings and sources as the visual scene; the shipped ManifestoSpiral.astro already provides a real .sr-only description and that practice is inherited and extended. Decorative layers are aria-hidden."
    nonColorEquivalent: "The two readings differ by position, line treatment and labels, not color alone: the biological-reference strand is a continuous solid stroke and the symbolic overlay a distinguishable treatment fixed at implementation, and both carry mandatory word labels. The current locus is also scale plus a focus ring. Unresolved is also a 4-2 dashed stroke plus the visible word UNKNOWN. The fiction register is marked in WORDS, not by the neon palette alone, so register survives monochrome — which matters more than usual here, because register is a truth claim."
    reducedMotionEquivalent: "Static helix with direct rung selection and no camera movement; smooth-scroll interpolation disabled entirely. A stored accessibility.motion preference of OFF in session memory overrides the media query, and no motion, sound or contrast setting is ever inferred from behaviour."
  reviewChecks:
    - "Can a viewer distinguish biological-reference geometry from KODEX symbolic content without relying only on color?"
    - "Does any text accidentally imply that the artwork displays verified genetic data?"
    - "Does traversal avoid imposing a compulsory alphabet, spiritual ascent or deterministic life sequence?"
    - "Is HelixPassage separated from scene-specific overlays/post-processing?"
    - "Are all numeric dossier values clearly decorative unless sourced?"
    - "Does the design remain legible and performant at 390x844 and 412x915?"
    - "REGISTER MARKER — the words REGISTRO · FICCION / REGISTER · FICTION are visible in every state and at every viewport including 390x844, and remain legible under a grayscale filter. Register is never carried by palette alone."
    - "NO REGISTER BLEND — the scene links to, quotes, cites and visually echoes no documented-register volume, and contains no Mapuche term, motif or cosmological structure. Specifically: no kultrun, no four-direction cross, no choike terminals, no Antu/Kuyen/Melipal/Wunelfe motifs, and no Mapudungun anywhere."
    - "NOT-DNA GATE — nothing in the scene is labelled, captioned or narrated as the molecule. The helix is a symbolic form under SYMBOLIC_ONLY: it is not right-handed-with-unequal-grooves B-DNA and must never be presented as if it were. Both currently shipped helices use an exact 180-degree offset and non-biological base-pair densities, which is consistent with this."
    - "LAYER SEPARATION — biological-reference and symbolic content are never blended into one continuous unlabelled object; every transition between them is visible and is also announced to screen readers."
    - "LAYER LABEL — whenever biological-reference geometry is on screen, the words BIOLOGICAL REFERENCE / REFERENCIA BIOLOGICA are visible. An unlabelled recognizable helix invites the viewer to read the symbolic material around it as equally factual."
    - "NO NUMBERS — no percentage, count, frequency, temperature, coherence, integrity, vitality or activation value appears anywhere; the progress rail is graphic only and is never rendered as text. Confirm the corner element shows a locus name, never a value."
    - "NO SEQUENCE — no ACGT run, chromosome ideogram, accession number or sequence-like texture appears anywhere."
    - "NON-COMPULSORY TRAVERSAL — the skip-to-index control is the first focusable element; every locus is reachable directly from the index; exit is available from every locus; reaching the final locus unlocks nothing and is not captioned as completion, arrival, activation or awakening."
    - "NO ALPHABET IMPLICATION — no locus is labelled with, ordered by, or visually keyed to an A-Y letter."
    - "TRAVERSAL WRITES NOTHING — sweep the full passage by pointer and by keyboard without opening a source, then inspect the event trace: session memory is unchanged. Depth reached, dwell time and speed appear nowhere."
    - "FULL KEYBOARD PASS with no pointer: skip control, enter the passage, traverse every locus with arrows, commit a rung, open a source, exit with Esc — with a visible focus indicator at every step and no action reachable only by scrolling."
    - "TOUCH TARGETS — minimum 44x44 px verified on 390x844 and 412x915, with no two locus targets overlapping."
    - "REDUCED MOTION — no drift, shimmer, parallax or travelling pulse; smooth-scroll interpolation disabled; the reading labels are still present and still announced."
    - "STATIC / NO-WEBGL PARITY — with the static path forced, the same loci in the same order with the same registers, labels, sources, keyboard model and memory write are present, and there is no layout shift versus the WebGL path."
    - "LOCUS INVARIANCE — locus count and order are identical at 1920x1080, 1440x900, 390x844 and 412x915. Only density and effects differ, which is why rung density may never carry meaning."
    - "MONOCHROME PASS under a grayscale filter: register, reading, current locus, opened source and unresolved all remain distinguishable."
    - "REVISIT — leaving and re-entering restores position and previously opened sources, and no duplicate source id is written on replay."
    - "DISPOSAL — after the scene leaves the viewport and after unmount: no animation frame is running, no ticker callback remains registered, no smooth-scroll subscription remains, the WebGL context is released, all textures including emissiveMap and bumpMap are disposed, and no window or document listener registered by the scene remains."
    - "PERFORMANCE — no more than one heavy canvas active per token performance.maxActiveHeavyCanvases; DPR capped at 1.2 mobile / 1.65 desktop; sustained 50fps or better at full profile on desktop and 30fps or better at low-power on mobile; no frame-time regression versus the existing manifesto scene at equivalent settings."
