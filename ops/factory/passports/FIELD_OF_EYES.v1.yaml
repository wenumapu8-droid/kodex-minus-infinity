provenanceBoundaries:
  mayAbstract:
    - "Distributed node topologies"
    - "Nested recursive eye structures"
    - "Concentric relation fields and luminous tethers"
  mustNotCopy:
    - "Direct photographs of human eyes without alteration"
    - "Distinctive Buddhist, third-eye, ceremonial or sacred-geometry iconography from external references"
    - "Pseudo-telemetry numbers or labels as factual measurements"
  culturalSensitivity:
    - "Buddhist or 'Third Eye' iconography must be treated with caution, avoiding exact replication of sacred geometries or explicit spiritual claims. Retain a computational/algorithmic framing."
informationHierarchy:
  primary: "The distributed field / lattice of eyes."
  secondary:
    - "The user's active gaze/interaction point (the 'self' node)."
  tertiary:
    - "Background telemetry, signal values, and structural tethering."
geometry:
  primitives:
    - "Node (Eye)"
    - "Tether (Lattice Edge)"
    - "Focus Ring"
  topology: "Recursive observation lattice"
  coordinateSystem: "Continuous 3D coordinate space with bounded implementation limits"
  spatialLayers:
    - "Background Void"
    - "Structural Lattice"
    - "Active Nodes"
    - "Foreground Gaze Anchor"
composition:
  focalStructure: "Decentralized with local concentration around interaction points."
  grid: "Non-linear / Organic Lattice"
  depthModel: "Layered Z-depth with depth-of-field or scale attenuation on distant nodes."
  negativeSpace: "Vast void to emphasize isolation yet connectedness of nodes."
  responsiveRules:
    desktop: "Wide aspect, expansive lattice visible, pointer controls gaze center."
    mobile: "Vertical slice, denser vertical stacking of nodes, touch drives focal shifts."
paletteRoles:
  - role: "Observe Base"
    semanticMeaning: "The fundamental state of the archive observing"
    tokenOrRange: "Observe Spectral Violet"
    colorIsNotOnlyChannel: true
  - role: "Active Gaze"
    semanticMeaning: "Nodes responding to the user's observation state"
    tokenOrRange: "Cyan (accent from KDX-NODE-FIELD-OF-EYES)"
    colorIsNotOnlyChannel: true
typographyRoles:
  - role: "Telemetry"
    behavior: "Monospaced, overlaid, reacting to focus states; invented numeric values remain explicitly decorative."
motion:
  timescales:
    - "Ambient drift (slow)"
    - "Gaze response (fast)"
  stateTransitions:
    - "Idle to Observing"
    - "Observing to Locked"
  loopingBehavior: "Continuous subtle ambient drift and procedural gaze shifts."
  reducedMotion: "Static nodes, no drift, instant state changes without interpolation."
interaction:
  inputs:
    - "POINTER"
    - "TOUCH"
    - "KEYBOARD"
  semanticActions:
    - "Attract gaze of surrounding nodes"
    - "Reveal hidden lattice connections"
  stateChanges:
    - "Hovering or keyboard focus on a node focuses the field."
    - "Clicking, tapping or activating with keyboard locks observation."
  memoryWrite:
    enabled: true
    key: "kodex-field-of-eyes-observed"
    description: "Records that the user has triggered the committed observation state within the lattice; it does not record a psychological or biometric inference."
  exitBehavior: "Eyes dilate and fade into the void."
implementation:
  medium: "WEBGL"
  reusableEngineBoundary: "EyeFieldRenderer (handles node instantiation, lattice connectivity and gaze vectors independently of scene logic)."
  sceneSpecificParts:
    - "Kodex Observe V2 integration"
    - "CRT post-processing layer when confirmed by the implementation packet"
  dependencies:
    - "Existing KODEX organism/WebGL runtime"
    - "Existing KODEX lifecycle, input and fallback contracts"
  performanceRisk: "HIGH"
fallback:
  noWebGL: "Static SVG or raster of the lattice with keyboard/touch/pointer focus states for major nodes."
  noAudio: "Visual telemetry and focus rings carry the weight of state changes."
  staticMode: "A single, highly detailed frame of the field with semantic controls still available."
accessibility:
  keyboardEquivalent: "Tab navigation cycles through major focal nodes and Enter/Space triggers locked states."
  touchEquivalent: "Taps act as gaze anchors and commitment actions without requiring hover."
  screenReaderAlternative: "Live region describes observation density and state without implying factual surveillance or consciousness measurement."
  nonColorEquivalent: "Focus rings and scale changes signify active gaze instead of color alone."
  reducedMotionEquivalent: "Static background, no camera pan, abrupt state transitions."
reviewChecks:
  - "Does the lattice feel computational and relational rather than presented as spiritual fact?"
  - "Are pointer, touch, and keyboard interactions semantically equivalent?"
  - "Is EyeFieldRenderer separated from scene-specific CRT/post-processing?"
  - "Are all numeric dossier values treated as decorative texture unless sourced?"
  - "Does the design remain legible and performant at 390x844 and 412x915?"
targetCaptures:
  - name: "desktop_wide"
    width: 1920
    height: 1080
  - name: "mobile_ios"
    width: 390
    height: 844
  - name: "mobile_android"
    width: 412
    height: 915
epistemicConstraints:
  - "Recursive observation is an artistic/interaction frame, not third-eye science."
  - "Generated frequencies, coherence values and telemetry are not factual."
  - "The eye network represents relation/observation in KODEX and must not be presented as evidence of a universal consciousness network."
scientificClaimPolicy: "SYMBOLIC_ONLY"
notes:
  - "Supervisor patch replaces ambiguous astral/cultural language and dependency assumptions with neutral implementation language."
