  provenanceBoundaries:
    mayAbstract:
      - "Distributed node topologies"
      - "Nested recursive eye structures"
      - "Concentric relation fields and luminous tethers, provided they never resolve into rings around one centre — see the acentric-lattice safeguard below"
      - "Distributed multi-observer composition as generic information design: many peer nodes, one committed focus, explicit relations between nodes."
      - "Iris, pupil and lid as neutral geometric primitives — ring stroke, filled disc, swept arc — composed as the three existing slots of ObservationEye.astro."
      - "The organism's own canonical state vocabulary (DORMANT / AWARE / ACTIVE) and verbs (track / scan / block)."
      - "CRT scanline and chromatic-split treatment, which are the organism's declared canonical fx_chain and already exist as shaders in the implementation repository."
      - "Instrument/dossier chrome from OBSERVE V2, reused as layout rather than reinvented."
    mustNotCopy:
      - "Direct photographs of human eyes without alteration"
      - "Pseudo-telemetry numbers or labels as factual measurements"
      - "No external reference image reached this worker. Therefore no external artwork, frame, figure or layout may be reproduced. Anything in the implementation that resembles a specific external work is an invention introduced downstream and must be rejected at visual review."
      - "No Buddhist or Buddha-derived iconography by default: no thousand-eyed or thousand-armed Avalokitesvara form, no urna or third-eye forehead mark on any human or deity figure, no lotus throne, no halo or mandorla, no mandala construction geometry, and no Devanagari or other dharmic script used as ornament. Ruling R1 governs what may be admitted by exception and on what terms; it does not lift this default."
      - "No photographic or photorealistic human eye, and no eye that can be read as a specific identifiable person."
      - "No eye-of-providence / all-seeing-eye emblem — it carries unrelated political-symbolic freight that this scene does not intend to claim."
      - "No Mapuche motif, term or cosmological structure of any kind, and no link, quotation, citation or visual echo of any documented-register volume. Under R1 this scene is fiction-register and the two registers never mix."
      - "FX treatments must never be applied to Ocin's finished specimen artwork. Per manifest fx_chain_nota, treatments apply only to photographs and derivatives, never to the completed work."
    culturalSensitivity:
      - "RESOLVED BY RULING R1 — REGISTER IS FICTION. FIELD OF EYES sits in the marked-fiction register with the neon palette. This is no longer an open question and must not be re-opened by an implementation packet."
      - "RESOLVED BY RULING R1 — BUDDHIST MATERIAL. Iconography drawn from a living tradition is handled as a GLYPH: a form the myth repeats because it serves the myth, named as a borrowing from the imaginary ('prestamo del imaginario') and never as that tradition's doctrine, and never as a claim about the origin of any species or any people. This is the position already recorded in the manifest volume fic-razas-estelares-iconografia and FIELD OF EYES inherits it rather than inventing its own. Admission of any specific Buddhist form is still governed by mustNotCopy above; R1 settles the FRAMING, not a licence to depict."
      - "TWO CANONICAL EDGES ARE MARKED NEEDS_CULTURAL_REVIEW IN THE NODE GRAPH, and both are Mapuche-rooted: KDX-NODE-WE-TRIPANTU EXPANDS KDX-NODE-RETURN ('Ambos articulan renovación y continuidad cíclica') and KDX-NODE-WENU-MAPU CONTAINS KDX-NODE-ANIMAL-GUIDES ('Los animales se sitúan dentro de territorio y cosmología'). Neither touches FIELD OF EYES, and neither may be rendered, traversed or referenced from this scene. They are surfaced here rather than left silent because they mark exactly where the astral route runs closest to documented Mapuche material."
      - "The scene must not link to, blend with, quote, cite or visually echo any documented-register volume, and above all not Mapuche material. The manifest states it twice: 'Mapuche y Codex Estelar NUNCA se mezclan', and registro ficcion 'Nunca se mezcla con lo documentado ni con lo mapuche'. Do not substitute Mapuche, Andean or generic 'ancestral' / 'tribal' motifs for anything this scene may not use."
      - "The register marker must be carried TEXTUALLY, not by palette alone. The manifest marks register by palette; design-system/tokens/kodex.tokens.json requires that colour never be the only channel. The persistent words REGISTRO · FICCION / REGISTER · FICTION are the required non-colour channel."
      - "Do not resolve any residual gap with generic 'sacred geometry'. If a reference cannot be identified, the field stays as specified here: a seeded irregular lattice that copies nothing."
      - "The deliberately acentric lattice specified in geometry.topology is itself a cultural safeguard: concentric rings around a single centre would reproduce mandala construction, which is exactly the boundary above."
      - "Retain a computational/algorithmic framing. Recursive observation is an interaction frame; no spiritual claim, no third-eye anatomy, no consciousness measurement."
  informationHierarchy:
    primary: "The distributed field / lattice of eyes — canonical visualAnchor kind 'distributed-field', role dominant-phenomenon: 'Campo donde la atención propia aparece como un nodo más'."
    secondary:
      - "The user's active gaze/interaction point (the 'self' node), which canon requires to read as ONE MORE NODE in the field and never as a privileged centre."
      - "The persistent register marker identifying the scene as marked fiction."
    tertiary:
      - "Background telemetry, signal values, and structural tethering."
  geometry:
    primitives:
      - "Node (Eye)"
      - "Tether (Lattice Edge)"
      - "Focus Ring"
    topology: "Recursive observation lattice, canonical topology 'astral / observer' (KDX-NODE-FIELD-OF-EYES behavior.topology) — irregular and acentric by construction. Eye centres are placed by seeded Poisson-disk sampling; each eye connects to its nearest neighbours, yielding one connected graph. A regular grid is rejected because it reads as interface chrome; a concentric or radial arrangement is rejected because rings around a single centre reproduce mandala construction, which provenanceBoundaries forbids."
    coordinateSystem: "Continuous 3D coordinate space with bounded implementation limits; pointer normalized to [-1,1] with y negated, matching kodex-observe-v2-client.ts."
    spatialLayers:
      - "Background Void"
      - "Structural Lattice"
      - "Active Nodes"
      - "Foreground Gaze Anchor"
  composition:
    focalStructure: "Decentralized with local concentration around interaction points. Exactly one eye holds committed focus at a time; the central region is left deliberately empty so the field has no single centre."
    grid: "Non-linear / Organic Lattice"
    depthModel: "Layered Z-depth with depth-of-field or scale attenuation on distant nodes."
    negativeSpace: "Vast void to emphasize isolation yet connectedness of nodes; at least 40% of the field box stays unpopulated and no two eyes touch."
    responsiveRules:
      desktop: "Wide aspect, expansive lattice visible, pointer controls gaze center. Pointer proximity is atmospheric only; a commit is required for any consequential action."
      mobile: "Vertical slice, denser vertical stacking of nodes, touch drives focal shifts. Eye count is capped by touch-target geometry so every 44x44 CSS px target stays non-overlapping at 390x844 and 412x915. The register marker never collapses."
  paletteRoles:
    - role: "Field Ground"
      semanticMeaning: "The archive at rest; the absence of observation"
      tokenOrRange: "neon ground #0A0A0A (manifest organismos[02].paleta). Brand-token neighbour color.field.obsidian (#050608) is NOT used — see the PALETTE note."
      colorIsNotOnlyChannel: true
    - role: "Observe Base"
      semanticMeaning: "The fundamental state of the archive observing; an eye present but not attending (DORMANT)"
      tokenOrRange: "neon violet #903CFF (manifest organismos[02].paleta), reduced alpha at rest. Brand-token neighbour color.signal.violet (#7855D5) is NOT used."
      colorIsNotOnlyChannel: true
    - role: "Node Accent (canonical) / Active Gaze"
      semanticMeaning: "The concept's canonical accent, and the state of nodes responding to the user's observation (AWARE)"
      tokenOrRange: "neon cyan #00F7FF (manifest organismos[02].paleta), resolving the canonical accent slot 'cyan' declared on KDX-NODE-FIELD-OF-EYES. The node names the accent SLOT, not a hex value; ruling R1 selects the neon palette to resolve it. Brand-token neighbour color.signal.cyan (#00E8F0) is NOT used."
      colorIsNotOnlyChannel: true
    - role: "Committed Focus"
      semanticMeaning: "The single eye the visitor has committed to (ACTIVE)"
      tokenOrRange: "neon red #FF2028 (manifest organismos[02].paleta). Brand-token neighbour color.signal.livingRed (#FF3833) is NOT used."
      colorIsNotOnlyChannel: true
    - role: "Traced Relation"
      semanticMeaning: "A relation the visitor committed and the session kept"
      tokenOrRange: "neon violet #903CFF at 2px (token line.signal) against 1px hairline lattice edges"
      colorIsNotOnlyChannel: true
    - role: "Register Marker — Fiction"
      semanticMeaning: "Persistent declaration that this scene is marked fiction, per the manifest requirement that both registers are always marked"
      tokenOrRange: "neon violet #903CFF on the neon ground #0A0A0A. The WORDS carry the meaning; colour is secondary and never sufficient on its own."
      colorIsNotOnlyChannel: true
    - role: "Instrument Text"
      semanticMeaning: "Chrome, labels and non-factual readouts"
      tokenOrRange: "bone #E8E8E8 with a muted variant; never a neon signal colour, so chrome cannot be mistaken for state"
      colorIsNotOnlyChannel: true
  typographyRoles:
    - role: "Register Marker"
      behavior: "Mono, uppercase, always visible in the header chip row and never collapsed at any viewport. Reads REGISTRO · FICCION / REGISTER · FICTION. This is a required element, not decoration: the manifest marks register by palette alone, which cannot satisfy the design-system rule that colour may not carry essential meaning alone. The word is the non-colour channel."
    - role: "Telemetry"
      behavior: "Monospaced, overlaid, reacting to focus states; invented numeric values remain explicitly decorative and are always preceded by a persistent marker (EN 'SIMULATED' / ES 'ATMOSFERA'). The existing OBSERVE V2 dossier renders generated percentages with no such marker and must not be copied in that respect."
  motion:
    timescales:
      - "Ambient drift (slow) — token duration.ambient (12000ms) base period, jittered per eye. Canonical behavior.tempo 0.2 is the low end of the tempo range, which is what makes a slow ambient drift the correct default rather than a lively one."
      - "Gaze response (fast) — token duration.micro (120ms) / duration.short (240ms). Canonical behavior.responsiveness 0.5 places response mid-range: the field answers input without snapping."
      - "Canonical behavior.entropy 0.3 governs the jitter budget: the lattice is irregular but not noisy, and blink phase jitter stays modest rather than chaotic."
      - "Canonical behavior.persistence 0.5 governs how long traced relations and attention states hold: relations persist for the session, attention decays. These four scalars are carried from KDX-NODE-FIELD-OF-EYES and replace the previously invented motion values; they are identical across all nine node files and must be treated as canonical defaults, not as measurements."
    stateTransitions:
      - "Idle to Observing"
      - "Observing to Locked"
      - "Locked to Witnessing after the existing 820ms engine timeout"
      - "Observing decays to Idle after 3200ms without input, matching kodex-observe-v2-client.ts"
    loopingBehavior: "Continuous subtle ambient drift and procedural gaze shifts. The field must never blink in unison — unison reads as a cut rather than as life. The render loop pauses on document visibilitychange."
    reducedMotion: "Static nodes, no drift, no blink, instant state changes without interpolation; every state change becomes a single 240ms opacity or stroke step."
  interaction:
    inputs:
      - "POINTER"
      - "TOUCH"
      - "KEYBOARD"
    semanticActions:
      - "ATMOSPHERIC — pointer proximity raises the attention of nearby eyes and aims their pupils. Nothing is committed and nothing is written. Required by ADR-0010: passive pointer movement alone cannot make identity claims or write consequential personal memory."
      - "CONSEQUENTIAL — attract gaze of surrounding nodes by committing to one eye (click, tap, Enter or Space)"
      - "CONSEQUENTIAL — reveal hidden lattice connections by committing a second eye, which traces a persistent relation"
      - "EXPLICITLY NOT AN ACTION — scroll position, hover duration, pointer path shape and the number of eyes passed over. None of these may be recorded, scored, aggregated or used to infer anything about the visitor."
    stateChanges:
      - "Hovering or keyboard focus on a node focuses the field."
      - "Clicking, tapping or activating with keyboard locks observation."
      - "At most one eye is committed at a time; committing a new eye returns the previous one to the attending state."
      - "A committed relation adds a persistent traced edge, which survives release and reappears on revisit."
    memoryWrite:
      enabled: true
      key: "relationsTraced"
      description: "Records that the user has triggered the committed observation state within the lattice; it does not record a psychological or biometric inference. Only the relation-tracing commit writes: it appends one relation id of the form 'rel:<eyeIdA>~<eyeIdB>', ids sorted so the pair is order-independent, to the session memory array relationsTraced declared in schemas/session-memory.schema.json. That schema sets additionalProperties false, so an ad-hoc key would be invalid. The write is idempotent by event identity. No identity claim, score, ranking, profile, biometric value or attention metric is ever written, the visitor must be able to see and clear exactly what was written, and accessibility preferences are never inferred from behaviour."
    exitBehavior: "Eyes dilate and fade into the void. Exit restores the exact prior route anchor, node, focus and scroll position per the ADR-0010 return-anchor law; traced relations persist for the session so a revisit regenerates the identical seeded lattice with previous relations already drawn."
  implementation:
    medium: "WEBGL"
    reusableEngineBoundary: "`field-of-eyes` — the engine name is canonical, declared as behavior.engine on KDX-NODE-FIELD-OF-EYES, and it is what the implementation must register itself as. EyeFieldRenderer (the name both lineages used) is the implementation class behind that engine id and handles node instantiation, lattice connectivity and gaze vectors independently of scene logic. It is a data-driven preset of the canonical observation-eye organism on KDX CORE, not a new renderer, and it must expose an explicit destroy(): the current runtime registers window 'resize' and document 'visibilitychange' listeners inside bindEvents() and never removes them, so a second mount leaks. Fixing that is a precondition for reuse and belongs to the implementation packet, not to this passport."
    sceneSpecificParts:
      - "Kodex Observe V2 integration"
      - "CRT post-processing layer when confirmed by the implementation packet"
      - "Eye count per profile and per viewport, and the touch-target cap that overrides it on small screens"
      - "Bilingual copy strings for the field states, and the persistent register marker"
      - "Mapping of organism states DORMANT / AWARE / ACTIVE onto the palette roles declared above"
      - "The empty-centre and 40% negative-space composition rules"
    dependencies:
      - "Existing KODEX organism/WebGL runtime"
      - "Existing KODEX lifecycle, input and fallback contracts"
      - "Existing shaders in src/kodex/observe-v2/shaders/ — no new shader is required for this organism's canonical fx_chain"
      - "Existing per-eye primitive src/components/kodex/motion/ObservationEye.astro"
      - "design-system/tokens/kodex.tokens.json for non-colour tokens"
      - "KOD-28 (JourneyState + EventTrace). Relation tracing cannot be implemented before it lands, because the memory write depends on event identity for idempotent replay."
      - "No new third-party dependency."
    performanceRisk: "HIGH"
  fallback:
    noWebGL: "Static SVG or raster of the lattice with keyboard/touch/pointer focus states for major nodes. The WebGL layer is atmospheric and carries no data; every eye, edge, focus action, traced relation, memory write and accessibility affordance behaves identically with and without it, and the existing ?fallback=1 parameter forces this path for review."
    noAudio: "Visual telemetry and focus rings carry the weight of state changes. The organism's canonical audio routing is optional atmosphere only; no information is available exclusively through sound."
    staticMode: "A single, highly detailed frame of the field with semantic controls still available. This is the mode used to produce the target captures."
  accessibility:
    keyboardEquivalent: "Tab navigation cycles through major focal nodes and Enter/Space triggers locked states; the field is one composite widget with roving tabindex, arrow-key traversal along lattice adjacency and Esc to release. Every consequential action is reachable without a pointer and without hover, with a visible focus indicator at every step."
    touchEquivalent: "Taps act as gaze anchors and commitment actions without requiring hover. Hit targets are at least 44x44 CSS px regardless of rendered eye radius, which is what caps eye count on small viewports."
    screenReaderAlternative: "Live region describes observation density and state without implying factual surveillance or consciousness measurement. Each eye carries an accessible name, its state and its traced relations; the register is announced in words; committed actions are announced and pointer movement is not."
    nonColorEquivalent: "Focus rings and scale changes signify active gaze instead of color alone; pupil aperture, stroke weight and a data attribute carry state. The fiction register is marked in WORDS, not by the neon palette alone, so register survives monochrome."
    reducedMotionEquivalent: "Static background, no camera pan, abrupt state transitions; a stored accessibility.motion preference of OFF in session memory overrides the media query, and no motion, sound or contrast setting is ever inferred from behaviour."
  reviewChecks:
    - "Does the lattice feel computational and relational rather than presented as spiritual fact?"
    - "Are pointer, touch, and keyboard interactions semantically equivalent?"
    - "Is EyeFieldRenderer separated from scene-specific CRT/post-processing?"
    - "Are all numeric dossier values treated as decorative texture unless sourced?"
    - "Does the design remain legible and performant at 390x844 and 412x915?"
    - "REGISTER MARKER — the words REGISTRO · FICCION / REGISTER · FICTION are visible in every state and at every viewport including 390x844, and remain legible under a grayscale filter. Register is never carried by palette alone."
    - "CANONICAL ANCHOR — the visitor's own attention reads as one more node in the field and never as a privileged centre, per the node's visualAnchor label 'Campo donde la atención propia aparece como un nodo más'."
    - "ROUTE POSITION — the scene is reachable from DREAM GATE and leads to DNA ASCENT, its two CANONICAL edges, and neither transition is compulsory or irreversible. Per the ASTRAL ROUTE proposition, the return is also a path: confirm the visitor can go back to the previous gate as freely as forward."
    - "NO UNDECLARED RELATIONS — the scene renders only the edges declared in authored-edges.json for this node, with their validity visible or at least not contradicted. It renders neither of the two NEEDS_CULTURAL_REVIEW edges, which are Mapuche-rooted and belong to another register."
    - "NO REGISTER BLEND — the scene links to, quotes, cites and visually echoes no documented-register volume, and contains no Mapuche term, motif or cosmological structure."
    - "No two eye nodes overlap and none is clipped at the field-box edge, at 1440x900, 390x844 and 412x915."
    - "The central region is empty; the field shows no single dominant centre and does not read as concentric rings."
    - "Exactly one eye is focused at a time; releasing focus leaves no second reticle on screen."
    - "Hover alone never changes a readout that implies a committed state and never writes to session memory — verify against the event trace after sweeping the pointer across every eye."
    - "Every numeric readout in the chrome carries its persistent non-factual marker; no readout can be mistaken for a measurement."
    - "Full keyboard pass with no pointer: enter the field, traverse every eye with arrows, commit a focus, trace a relation, release with Esc, with a visible focus indicator at every step."
    - "Minimum 44x44 px touch targets verified on 390x844 and 412x915, with no two targets overlapping."
    - "With prefers-reduced-motion set: no blink, no drift, no feedback trail, and all transitions are 240ms opacity or stroke steps."
    - "With ?fallback=1: the scene is fully usable, all eyes, edges, focus and tracing are present, and there is no layout shift versus the WebGL path."
    - "Screen-reader pass: every eye has a name and a state, commits are announced, pointer movement is not."
    - "Monochrome pass under a grayscale filter: rest, attending, focused, traced and contested remain distinguishable, and the register is still readable."
    - "Leaving and re-entering the scene regenerates the identical lattice and redraws previously traced relations, and no duplicate relation is written on replay."
    - "After unmount, no animation frame is running, the WebGL context is released, and no window or document listener registered by the scene remains."
    - "No Buddhist-derived iconography, no photographic human eye, no mandala construction geometry and no eye-of-providence emblem is present in the rendered scene."
    - "Sustained 50fps or better at the full profile on desktop with no frame-time regression versus OBSERVE V2 at the same profile, and 30fps or better at low-power on mobile."
