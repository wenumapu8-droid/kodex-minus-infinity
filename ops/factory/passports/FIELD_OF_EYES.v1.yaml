schema_version: 1
visual_passport:
  passportId: "KDX-VP-FIELD-OF-EYES-V1"
  conceptId: "KDX-NODE-FIELD-OF-EYES"
  title: "FIELD OF EYES"
  status: "DRAFT"
  semanticPurpose: "Represents recursive observation and a distributed field of attention. (Canonical summary, verbatim from KDX-NODE-FIELD-OF-EYES.) The act of looking places the viewer as a node within that field. Rendered as a data-driven preset of the canonical `observation-eye` organism (manifest organismos[02], role 'detecta y reconoce', states DORMANT / AWARE / ACTIVE, verbs track / scan / block), not as a new renderer."
  nodeQuestion: "Ningún ojo observa solo. Mirar es ya ser parte del campo que mira."
  coordinateAssignment: null
  sourceRefs:
    - id: "ops/factory/packets/KOD-38.yaml (KDX-WP-VISUAL-01)"
      relation: "PRIMARY_CONCEPT"
      rightsStatus: "CLEAR"
      notes:
        - "The string FIELD OF EYES occurs in no other file of kodex-minus-infinity or wenu-frontend. Verified by full-tree grep of both repositories."
        - "The packet's source_inputs name 'actual FIELD OF EYES concept/reference images available to the visual worker'. No such image set reached this worker."
    - id: "wenu-frontend public/kodex-content/manifest.json — organismos[02] observation-eye"
      relation: "PRIMARY_CONCEPT"
      rightsStatus: "CLEAR"
      notes:
        - "Canonical organism 02. rol: 'detecta y reconoce'. estados: DORMANT / AWARE / ACTIVE. verbos ES: sigue, escanea, bloquea. EN: track, scan, block."
        - "Canonical fx_chain: [crt-scan, chromatic-split]. Canonical audio routing: mid+high+pointer."
        - "Organism palette declared as #903CFF, #00F7FF, #FF2028, #0A0A0A. Under ruling R1 this is the neon palette this passport uses; see the PALETTE note."
    - id: "wenu-frontend src/data/kodex/nodes/field-of-eyes.json (KDX-NODE-FIELD-OF-EYES), branch feature/kodex-node-graph-v1 @ 867fb8b0"
      relation: "PRIMARY_CONCEPT"
      rightsStatus: "CLEAR"
      notes:
        - "THE canonical source for this concept, and it outranks every other entry in this list. Read in full. It was invisible until now because getKodexNodes() resolved its path with import.meta.url, which at build time points into dist/ rather than src/, so the loader returned [] and no node route was ever generated. That bug is fixed on this branch."
        - "id KDX-NODE-FIELD-OF-EYES, slug field-of-eyes, title 'FIELD OF EYES', subtitle 'OBSERVER / PERCEPTION FIELD', status active, visibility surface, atlasStatus CANON, publishable true, version 1.0.0, checksum KDX-NODE-FIELD-OF-EY-7F8D."
        - "summary verbatim: 'Represents recursive observation and a distributed field of attention.' — adopted verbatim as semanticPurpose."
        - "proposition verbatim: 'Ningun ojo observa solo. Mirar es ya ser parte del campo que mira.' — adopted verbatim as nodeQuestion. Both lineages already carried these two strings, which is how the iMac lineage was in fact anchored."
        - "visualAnchor: kind 'distributed-field', role 'dominant-phenomenon', label 'Campo donde la atencion propia aparece como un nodo mas'. This is canon for informationHierarchy.primary and for composition: the visitor's own attention must appear as ONE MORE NODE in the field, not as a privileged centre. The acentric lattice specified in geometry.topology satisfies this; a concentric arrangement would not."
        - "symbols: ASTRAL, OBSERVER. behavior.engine 'field-of-eyes', topology 'astral / observer'."
        - "behavior scalars tempo 0.2, entropy 0.3, responsiveness 0.5, persistence 0.5 — carried into motion, but note they are IDENTICAL across all nine node files, so they read as schema defaults rather than authored per-node values. They must not be presented as measurements or as tuned parameters."
        - "epistemic: claimClass UNKNOWN, culturalStatus STANDARD, domains [], limitations [], claims []. Canon has not classified this concept's claim, so it neither supports nor overrides this passport's scientificClaimPolicy."
        - "editorial body (es) verbatim: 'La observacion recursiva es aca un modelo computacional: el observador se representa dentro del campo que observa. No afirma efectos de observador fuera de ese modelo.' — this is canon stating the epistemic frame directly, and it is carried into epistemicConstraints."
        - "mode 'dark-archive', accent 'cyan'. See the MODE AND ACCENT note: these are a render axis, not the content register."
    - id: "wenu-frontend src/data/kodex/authored-edges.json and src/data/kodex/nodes/astral-route.json"
      relation: "PRIMARY_CONCEPT"
      rightsStatus: "CLEAR"
      notes:
        - "74 hand-authored edges across 33 relation types, recovered after Bridge 1 lost them. Validity census: CANONICAL 27, VALID 43, HYPOTHESIS 2, NEEDS_CULTURAL_REVIEW 2."
        - "FIELD OF EYES is GATE 02 of the canonical ASTRAL ROUTE 01-06 (KDX-NODE-ASTRAL-ROUTE CONTAINS KDX-NODE-FIELD-OF-EYES, validity VALID). The route orders Dream -> Eyes -> DNA -> Source -> Heart -> Return."
        - "Incoming CANONICAL: KDX-NODE-DREAM-GATE LEADS_TO KDX-NODE-FIELD-OF-EYES, 'Dream dissolves ordinary framing before the observer confronts recursive perception.'"
        - "Outgoing CANONICAL: KDX-NODE-FIELD-OF-EYES LEADS_TO KDX-NODE-DNA-ASCENT, 'Observation turns inward from field/perception toward embodied biological lineage.' This is declared on the node itself as well."
        - "Also incoming VALID: KDX-NODE-EYE-WITHIN-EYE EXPANDS KDX-NODE-FIELD-OF-EYES, 'La percepcion anidada profundiza la familia del observador creada en Field of Eyes.'"
        - "The route's own proposition is binding on this scene's interaction model: 'La ruta no se recorre: se ordena. Cada estacion contiene a la siguiente y ninguna es obligatoria. Reversible significa que el regreso tambien es camino.' Non-compulsory and reversible traversal is therefore canon, not a passport preference."
        - "NEITHER of the two NEEDS_CULTURAL_REVIEW edges touches this concept. Both are Mapuche-rooted (KDX-NODE-WE-TRIPANTU EXPANDS KDX-NODE-RETURN; KDX-NODE-WENU-MAPU CONTAINS KDX-NODE-ANIMAL-GUIDES) and are recorded in provenanceBoundaries.culturalSensitivity as a boundary, never rendered."
