        - "crt.frag.glsl and chroma.frag.glsl already implement the organism's canonical fx_chain, so this passport requires no new shader."
    - id: "wenu-frontend src/components/kodex/motion/ObservationEye.astro"
      relation: "REFERENCE"
      rightsStatus: "CLEAR"
      notes:
        - "Existing per-eye primitive with three slots — field / pupil / overlay — all aria-hidden. Adopted unchanged as the eye node structure."
    - id: "kodex-minus-infinity design-system/tokens/kodex.tokens.json"
      relation: "DESIGN_SYSTEM"
      rightsStatus: "CLEAR"
      notes:
        - "Authoritative spacing, line, duration, easing, layout and performance tokens for this passport."
        - "Its COLOUR tokens are the brand palette and are NOT authoritative here: ruling R1 places this scene in the fiction register, whose palette is neon. Brand-token neighbours are cited alongside each neon value for traceability only."
        - "Its rule 'Color may not carry essential meaning alone' is binding and is why every paletteRole sets colorIsNotOnlyChannel true and why the register marker is carried in words."
    - id: "kodex-minus-infinity schemas/session-memory.schema.json"
      relation: "DESIGN_SYSTEM"
      rightsStatus: "CLEAR"
      notes:
        - "additionalProperties is false and the declared keys include relationsTraced, entitiesTraced, sourcesOpened and artifactSeed. Only a declared key may be written; see the MEMORY KEY note."
    - id: "kodex-minus-infinity docs/decisions/ADR-0010-ALPHABETIC-MULTIVERSE-A-M-Y.md"
      relation: "RESEARCH"
      rightsStatus: "CLEAR"
      notes:
        - "Concept assignment law: letters are not assigned without creator approval, so coordinateAssignment stays null."
        - "'Passive pointer movement alone cannot make identity claims or write consequential personal memory.' This governs the atmospheric/consequential split."
        - "Return-anchor law and mutated-revisit (K-prime) behaviour govern exitBehavior."
    - id: "kodex-minus-infinity canon/KODEX_EPISTEMIC_STANDARD.md"
      relation: "RESEARCH"
      rightsStatus: "CLEAR"
