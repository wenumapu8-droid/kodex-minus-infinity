    - id: "wenu-frontend public/kodex-content/manifest.json — volumes fic-razas-estelares-iconografia"
      relation: "PROVENANCE"
      rightsStatus: "REFERENCE_ONLY"
      notes:
        - "The standing KODEX position on iconography drawn from living traditions. registro: ficcion, marco: ficcion, paleta: neon, review: false."
        - "'Se tratan como glifos ... y no como afirmaciones sobre el origen de ninguna especie ni de ningun pueblo. Donde una imagen viene de una tradicion viva se nombra como prestamo del imaginario y no como su doctrina.'"
        - "Ruling R1 makes this position binding for FIELD OF EYES. Its review_nota records that its resonances touch no documented volume of Mapuche root."
    - id: "wenu-frontend public/kodex-content/manifest.json — sistemas.registro_vocabulario and top-level note"
      relation: "PROVENANCE"
      rightsStatus: "CLEAR"
      notes:
        - "note verbatim: 'Dos registros siempre marcados: DOCUMENTADO (paleta marca) y MITO/FICCION (paleta neon). Mapuche y Codex Estelar NUNCA se mezclan.'"
        - "registro ficcion: 'Lore/ficcion de autor, presentado como tal. Nunca se mezcla con lo documentado ni con lo mapuche.'"
        - "This is the canonical text behind ruling R1 and behind the no-blend boundaries below."
    - id: "chatgpt-file-library:file_00000000428081fba426a0a5aa5bc7a7"
      relation: "REFERENCE"
      rightsStatus: null
      notes:
        - "Carried from the iMac lineage. Exact project asset it names: Paneles cosmicos del Codex Infinito.png."
        - "Claimed to contain a FIELD OF EYES panel with a central purple eye, a concentric network of smaller eyes, golden lattice geometry and pseudo-telemetry such as COHERENCE 63.7%."
        - "NOT INSPECTED BY THIS WORKER and not present on this machine. The asset identifier is carried verbatim; its content, generation and rights provenance must not be inferred from this record."
        - "Note the direct conflict with this passport's geometry: a concentric network around a single centre is exactly the mandala-adjacent construction provenanceBoundaries forbids. If this asset is confirmed as the reference, geometry.topology must be re-decided, not quietly reconciled."
    - id: "R2 bucket pub-2b4562c758ed440ab047fe9523a2d99c.r2.dev/kodex-content/art/"
      relation: "REFERENCE"
      rightsStatus: "UNKNOWN"
      notes:
