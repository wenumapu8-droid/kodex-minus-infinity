  notes:
    - "PROVENANCE QUESTION 1 — concept identity. The title FIELD OF EYES exists in no file of either repository except KOD-38 itself, and the concept/reference images named in the packet's source_inputs never reached this worker. This passport is therefore derived from canonical material that already exists: the observation-eye organism, the 'ocular field' phrase in the OBSERVE V2 copy, and the shipped OBSERVE V2 engine. The orchestrator must confirm that this is the intended concept before any implementation packet is issued. Status stays DRAFT for this reason."
    - "PROVENANCE QUESTION 2 — Buddhist source material. The packet declares that Buddha-inspired source material requires provenance review, but no Buddhist reference reached this worker and none exists in either repository apart from the marked-fiction position in fic-razas-estelares-iconografia. If the withheld reference set is Buddha-derived, the orchestrator must assign FIELD OF EYES to the fiction register — neon palette, glyph treatment, named as a borrowing and not as doctrine — before implementation, because that decision changes the palette. Until it is answered, this passport specifies a field that copies nothing, so the packet's stop condition is not triggered: copying boundaries are stated, they are simply stated conservatively."
    - "PROVENANCE QUESTION 3 — R2 art references. The bucket pub-2b4562c758ed440ab047fe9523a2d99c.r2.dev was located through manifest cover URLs but no image was opened and none informed this passport. If the orchestrator intends specific R2 pieces as references, they must be named explicitly and given rights and cultural status before implementation."
    - "PALETTE CONFLICT — the canonical organism palette (#903CFF, #00F7FF, #FF2028, #0A0A0A) is close to but not identical with the design-system tokens (violet #7855D5, cyan #00E8F0, livingRed #FF3833, obsidian #050608). This passport uses the design-system tokens as authoritative because they are the versioned artefact in the canon repository. The delta is real and visible; the orchestrator should rule on which is canonical rather than letting the implementation choose."
    - "CONCEPT ID — no canonical id exists for the field composition itself, so conceptId is set to the organism it composes (observation-eye). If the field warrants its own registry entry, the orchestrator should assign one; this passport does not create canon."
    - "COORDINATE — coordinateAssignment stays null. ADR-0010's concept assignment law requires creator approval before any A-Y letter is assigned, and no canonical source assigns one to this concept."
    - "DEPENDENCY — TRACE_RELATION cannot be implemented before KOD-28 (JourneyState + EventTrace) lands, because idempotent replay by event identity is what keeps the memory write from double-writing."
    - "PERFORMANCE RISKS — the reason implementation.performanceRisk is MEDIUM rather than LOW. (1) Per-frame style writes: the existing runtime already sets CSS custom properties on 44 elements every frame (24 waveform bars, 12 signal bars, 8 nodes); at 24 eyes plus roughly 36 lattice edges this grows to about 60 elements, so per-eye updates must be restricted to transform and opacity and batched in one write phase, never interleaved with reads. (2) Six-pass ping-pong at DPR 1.5 on a full-profile desktop is the existing cost and must not regress; the eye layer is DOM/SVG on top and adds compositing, not fill. (3) Blink jitter must not force layout — lid arcs animate by transform or clip-path, never by width or radius. (4) Traced relations accumulate for the session and are never removed, so their draw cost must stay O(traced) with no full-field repaint per commit. (5) Mobile low-power caps at 6 eyes and DPR 1.0, so the binding constraint there is touch-target geometry rather than fill rate. (6) The listener leak recorded in the defect note below becomes a compounding performance problem, not merely a correctness one, if the scene is mounted more than once."
    - "IMPLEMENTATION PACKET RECOMMENDATION — split into two packets. (a) C2, producer BOUNDED_CODING_AGENT, reviewer LONG_CONTEXT_ARCHITECT: extract EyeField from the existing OBSERVE V2 runtime with an explicit destroy(), seeded lattice generation, the focus/trace state machine, the keyboard model and unit tests. No new shaders and no visual novelty. (b) C1, MULTIMODAL_VISUAL_SPEC: visual review against reviewChecks at the three target captures, after (a). Do not issue (a) until provenance questions 1 and 2 are answered, because the register decision changes the palette."
    - "DEFECT FOUND IN EXISTING CODE — reported, not fixed, since this packet may not edit runtime code. kodex-observe-v2-client.ts bindEvents() adds a window 'resize' listener and a document 'visibilitychange' listener and never removes them; there is no destroy path, so mounting a second scene leaks listeners and a WebGL context. Separately, the OBSERVE V2 dossier renders generated percentages (SIGNAL, FOCUS, ANOMALY, LATENCY) with no non-factual marker, which this passport requires for FIELD OF EYES and which is worth backporting to OBSERVE V2."
    - "EVIDENCE — sources actually inspected are listed field-by-field in sourceRefs. Every file named there was read in this session. The R2 bucket is the one source located but deliberately not opened, and it is marked as such."
