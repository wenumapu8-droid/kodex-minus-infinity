  epistemicConstraints:
    - "CANON, verbatim from KDX-NODE-FIELD-OF-EYES editorial body: 'La observación recursiva es acá un modelo computacional: el observador se representa dentro del campo que observa. No afirma efectos de observador fuera de ese modelo.' Recursive observation is a computational model in which the observer is represented inside the field it observes, and the scene asserts no observer effect outside that model."
    - "Recursive observation is an artistic/interaction frame, not third-eye science. Nothing here is a claim about perception, consciousness, third-eye anatomy or any spiritual faculty."
    - "The node's own epistemic block sets claimClass UNKNOWN and culturalStatus STANDARD with no domains, limitations or claims recorded. Canon has therefore not classified this concept, and the absence of a classification must not be read as a licence: the constraints here stand on their own."
    - "Generated frequencies, coherence values and telemetry are not factual. Every numeric readout — signal, focus, anomaly, latency, node count, checksum — is generated atmosphere, not measurement, per the prohibited pseudo-metrics section of canon/KODEX_EPISTEMIC_STANDARD.md."
    - "The eye network represents relation/observation in KODEX and must not be presented as evidence of a universal consciousness network."
    - "The scene must not profile the visitor, rank them, or infer identity, mood, ability or intent from interaction."
    - "Buddhist imagery, where admitted at all, is a borrowing from the marked-fiction imaginary and never doctrine, inheriting the position recorded in fic-razas-estelares-iconografia and now binding under ruling R1."
    - "Registers must not blend. Under R1 the field sits in the FICTION register, and it must not link to, blend with or absorb any documented-register volume, and must never touch Mapuche material."
    - "The lattice is generated, not measured. Its geometry represents no dataset and must never be captioned or labelled as if it did."
  scientificClaimPolicy: "SYMBOLIC_ONLY"
  notes:
    - "LINEAGE — this passport is the R2 merge of two independent versions: the iMac branch feature/visual-passport-field-of-eyes-v1 (140 lines, 3 sourceRefs, 5 reviewChecks) supplied the skeleton, field ordering and compact field values; the macmini branch feature/visual-passport-field-of-eyes-v1-macmini (429 lines, 13 sourceRefs, 15 reviewChecks) supplied sourceRefs, reviewChecks, provenanceBoundaries and the escalated decisions below. Neither lineage was discarded. Where the two disagreed on a value rather than on depth, the disagreement is recorded in these notes rather than silently resolved."
    - "REGISTER — CLOSED BY RULING R1. FIELD OF EYES sits in the FICTION register with the neon palette. This supersedes the macmini lineage's PROVENANCE QUESTION 2, which asked the orchestrator to rule on exactly this. Consequences applied here: paletteRoles are reconciled to the neon values; the scene may not link to or blend with any documented-register volume and never with Mapuche material; the register marker is carried textually as well as by colour; and iconography from a living tradition is a glyph, a borrowing from the imaginary, never doctrine."
    - "PALETTE — WHICH VALUES WERE USED AND WHY, AND WHAT IS STILL OPEN. R-open 3 in the creator rulings is UNRESOLVED: the canonical organism palette (#903CFF, #00F7FF, #FF2028, #0A0A0A) is close to but not identical with the design-system tokens (violet #7855D5, cyan #00E8F0, livingRed #FF3833, obsidian #050608). This passport uses the ORGANISM NEON VALUES — #903CFF, #00F7FF, #FF2028, #0A0A0A from manifest organismos[02].paleta — because ruling R1 says the palette is neon and those are the neon values, and it cites the brand-token neighbour beside each one for traceability. This is a change from the macmini lineage, which treated the design-system tokens as authoritative. The delta is real and visible and R-open 3 is NOT settled by doing this: the orchestrator still owes a ruling on whether the manifest or the token file is canonical, and if the token file wins the neon values must be re-derived there rather than taken from the manifest."
    - "R-OPEN 1 — CONCEPT IDENTITY: CLOSED. FIELD OF EYES is a real canonical node, KDX-NODE-FIELD-OF-EYES, at src/data/kodex/nodes/field-of-eyes.json in wenu-frontend, atlasStatus CANON, status active, publishable true. It was invisible to every earlier search because of a loader bug — getKodexNodes() resolved its path with import.meta.url, which at build time points into dist/ rather than src/, so the loader returned [] and no node route was ever generated. The fix is on branch feature/kodex-node-graph-v1 at commit 867fb8b0 (PR #44). The mapping is confirmed on CONTENT, not on the name: the node's title is literally 'FIELD OF EYES', and its summary and proposition are the exact strings both passport lineages were already carrying, which is how the iMac lineage came to be anchored on this id in the first place. Independently, the node is gate 02 of the canonical ASTRAL ROUTE 01-06, whose gates 02/03/04 are Eyes / DNA / Source — the same three concepts, in the same order, as work packets KOD-38 / KOD-39 / KOD-40. That is structural confirmation, not a name coincidence."
    - "STATUS — STAYS DRAFT, BUT FOR A DIFFERENT AND SMALLER REASON THAN BEFORE. With R-open 1 closed and the register closed by R1, the remaining open items in this passport are the MODE AND ACCENT question below and R-open 3 (palette). Both are open decisions for the creator, so not every question in these notes is closed and the status may not move to REVIEW. Note that the iMac lineage carried status REVIEW; that is still downgraded here, because two live questions remain. If the creator answers the mode/accent and palette questions, this passport is ready for REVIEW without further evidence work."
    - "MODE AND ACCENT vs RULING R1 — A GENUINE AMBIGUITY, RECORDED AS AN OPEN DECISION RATHER THAN RESOLVED. The node declares mode 'dark-archive' and accent 'cyan', while R1 places this scene in the FICTION register with the NEON palette. This passport's reading is that these are two DIFFERENT AXES and do not contradict, for three reasons drawn from the data. (1) The node schema constrains mode to exactly two values, ['dark-archive', 'technical-plate'], and all nine node files are dark-archive. Two values, one of which is 'technical-plate', describe a RENDER SURFACE — how a node is presented — not a content register. The manifest's register vocabulary is a separate five-value system (documentado, mito, esoterico, ficcion, estructura) and the word 'ficcion' appears nowhere in the node schema. (2) The node schema constrains accent to a fixed eight-name list [gold, red, violet, cyan, acid, magenta, indigo, bone]. Those are SLOT NAMES, not hex values. The node says which accent slot the concept owns; it does not say which palette resolves that slot into a colour. R1 supplies the palette. On this reading accent 'cyan' resolves to the neon cyan #00F7FF rather than the brand cyan #00E8F0, which is exactly what this passport does. (3) The two systems agree where they can be compared: all three concepts' accents match the accent each iMac-lineage passport had already recorded, and cyan exists in observation-eye's neon palette. THE READING IS NOT CERTAIN. A defensible contrary reading is that 'dark-archive' IS the archive's own presentation register and that these nodes therefore sit outside the manifest's documented/fiction split altogether, in which case R1's fiction placement is a category error for node-graph content rather than a ruling that binds it. The creator should say which reading is intended. Nothing in either repository defines mode or accent in prose; the enums are the only evidence, and enums do not state intent."
    - "CONCEPT ID — REVERSED ON NEW EVIDENCE, AND THE iMac LINEAGE WAS RIGHT. An earlier revision of this merge set conceptId to the organism slug observation-eye and recorded the iMac lineage's KDX-NODE-FIELD-OF-EYES as an unverifiable claim, because a full-tree grep found no such id and src/data/kodex/nodes/ did not exist on any branch then available. The node files were real; the loader bug meant nothing ever read them and they were absent from the branches checked. conceptId is now the canonical node id KDX-NODE-FIELD-OF-EYES. The observation-eye organism remains the RENDERING anchor — it is what the scene is a preset of — and it is retained as a PRIMARY_CONCEPT sourceRef. The two are different kinds of thing: the node is the concept, the organism is the engine preset that renders it, and this passport now names both."
    - "RELATIONSHIPS — USED, NOT DECORATIVE. The node graph gives this scene two CANONICAL edges (DREAM GATE LEADS_TO here; here LEADS_TO DNA ASCENT), one VALID containment (gate 02 of ASTRAL ROUTE 01-06) and one VALID incoming expansion (EYE WITHIN EYE EXPANDS here). These are carried into reviewChecks as route-position checks. The route's own proposition — 'La ruta no se recorre: se ordena. Cada estación contiene a la siguiente y ninguna es obligatoria. Reversible significa que el regreso también es camino' — independently confirms the non-compulsory, reversible traversal model that both lineages had already specified from ADR-0010. Two edges in the graph carry validity NEEDS_CULTURAL_REVIEW; neither touches this concept, both are Mapuche-rooted, and they are surfaced in provenanceBoundaries.culturalSensitivity rather than rendered."
    - "PROVENANCE QUESTION — R2 ART REFERENCES. The bucket pub-2b4562c758ed440ab047fe9523a2d99c.r2.dev was located through manifest cover URLs but no image was opened and none informed this passport. If specific R2 pieces are intended as references, they must be named explicitly and given rights and cultural status before implementation."
    - "CONCEPT ID — LINEAGE DISAGREEMENT, RESOLVED ON EVIDENCE. The iMac lineage set conceptId to KDX-NODE-FIELD-OF-EYES; the macmini lineage set it to observation-eye. A full-tree grep of kodex-minus-infinity and kodex-work finds NO occurrence of KDX-NODE-FIELD-OF-EYES and src/data/kodex/nodes/ does not exist on this machine, while observation-eye is verifiable in the manifest. This passport therefore uses observation-eye and records the iMac claim in sourceRefs as an unverified lineage claim, because the standing prohibition on fabricating provenance forbids carrying an unverifiable canonical id as if it existed. If the KDX-NODE registry exists elsewhere, the creator should say where and this field should be revisited."
    - "PASSPORT ID — LINEAGE DISAGREEMENT. iMac used VP-FIELD-OF-EYES-V1, macmini used KDX-VP-FIELD-OF-EYES-V1. Neither lineage is authority here; ops/factory/VISUAL_PASSPORT_TEMPLATE.yaml is, and it prescribes the prefix KDX-VP-. That is what this file uses. Flagged rather than assumed."
    - "MEMORY KEY — LINEAGE DISAGREEMENT, RESOLVED ON EVIDENCE. iMac specified an ad-hoc key kodex-field-of-eyes-observed; macmini specified relationsTraced. schemas/session-memory.schema.json declares relationsTraced and sets additionalProperties false, so the ad-hoc key would be rejected by the repository's own schema. The schema-valid key is used and the iMac choice is recorded here."
    - "SCHEMA ENVELOPE — LINEAGE DISAGREEMENT. The iMac file was a bare top-level mapping; the macmini file used the schema_version / visual_passport envelope. The envelope is kept because ops/factory/VISUAL_PASSPORT_TEMPLATE.yaml uses it and the contract validator reads the passport at the visual_passport key. This is the one place the iMac skeleton could not be preserved verbatim."
    - "OTHER LINEAGE DISAGREEMENTS CARRIED AS-IS. performanceRisk: iMac HIGH, macmini MEDIUM — HIGH is kept, per the iMac skeleton and because the performance risks below are real. medium: iMac WEBGL, macmini HYBRID — WEBGL is kept, but note the scene is specified so that the WebGL layer carries no data and the DOM/SVG path is fully functional, which is closer to HYBRID in substance; the implementation packet should confirm the declaration. interaction.inputs: iMac declares POINTER/TOUCH/KEYBOARD, macmini adds TIME for ambient decay — the iMac set is kept even though ambient decay is specified in motion, and this should be reconciled if TIME-driven behaviour becomes consequential. targetCaptures: iMac's desktop_wide 1920x1080 is kept and macmini's desktop-1440x900 added, because the grafted reviewChecks are written against 1440x900."
    - "DEPENDENCY — relation tracing cannot be implemented before KOD-28 (JourneyState + EventTrace) lands, because idempotent replay by event identity is what keeps the memory write from double-writing."
    - "PERFORMANCE RISKS — why implementation.performanceRisk is HIGH. (1) Per-frame style writes: the existing runtime already sets CSS custom properties on 44 elements every frame (24 waveform bars, 12 signal bars, 8 nodes); at 24 eyes plus roughly 36 lattice edges this grows to about 60 elements, so per-eye updates must be restricted to transform and opacity and batched in one write phase, never interleaved with reads. (2) Six-pass ping-pong at DPR 1.5 on a full-profile desktop is the existing cost and must not regress; the eye layer is DOM/SVG on top and adds compositing, not fill. (3) Blink jitter must not force layout — lid arcs animate by transform or clip-path, never by width or radius. (4) Traced relations accumulate for the session and are never removed, so their draw cost must stay O(traced) with no full-field repaint per commit. (5) Mobile low-power caps eye count and DPR, so the binding constraint there is touch-target geometry rather than fill rate. (6) The listener leak recorded below becomes a compounding performance problem, not merely a correctness one, if the scene is mounted more than once."
    - "IMPLEMENTATION PACKET RECOMMENDATION — split into two packets. (a) C2, producer BOUNDED_CODING_AGENT, reviewer LONG_CONTEXT_ARCHITECT: extract EyeFieldRenderer from the existing OBSERVE V2 runtime and register it under the canonical engine id 'field-of-eyes', with an explicit destroy(), seeded lattice generation, the focus/trace state machine, the keyboard model and unit tests. No new shaders and no visual novelty. (b) C1, MULTIMODAL_VISUAL_SPEC: visual review against reviewChecks at the target captures, after (a). Both blockers that previously held (a) are now cleared: the register by R1, and concept identity by the node graph. What remains is the mode/accent question, which changes only the palette resolution and not the geometry, so (a) may proceed at the creator's discretion while it is answered."
    - "DEFECT FOUND IN EXISTING CODE — the node loader. getKodexNodes() resolved src/data/kodex/nodes/ with import.meta.url, which at build time points into dist/ rather than src/, so it returned an empty array and no node route was ever generated. Nine canonical node files and 74 authored edges were invisible to the whole factory as a result, which is why three visual passports were derived from secondary material and why R-open 1 stayed open. Fixed on feature/kodex-node-graph-v1 @ 867fb8b0 (PR #44). Recorded here because the failure mode is silent — an empty array is not an error — and any similar loader should be checked for the same pattern and given a test that asserts a non-empty result."
    - "DEFECT FOUND IN EXISTING CODE — reported, not fixed, since this packet may not edit runtime code. kodex-observe-v2-client.ts bindEvents() adds a window 'resize' listener and a document 'visibilitychange' listener and never removes them; there is no destroy path, so mounting a second scene leaks listeners and a WebGL context. Separately, the OBSERVE V2 dossier renders generated percentages (SIGNAL, FOCUS, ANOMALY, LATENCY) with no non-factual marker, which this passport requires for FIELD OF EYES and which is worth backporting to OBSERVE V2."
    - "EVIDENCE — sources actually inspected are listed field-by-field in sourceRefs. Two sources are named but were NOT inspected and are marked as such: the R2 bucket, deliberately not opened; and the chatgpt-file-library asset carried from the iMac lineage, which is not present on this machine and whose described content conflicts with this passport's acentric geometry."
