    - "kodex-minus-infinity:AGENTS.md"
    - "kodex-minus-infinity:ops/factory/DISPATCH_QUEUE.yaml"
    - "kodex-minus-infinity:ops/factory/FACTORY_EVENT_SCHEMA.yaml"
    - "kodex-minus-infinity:ops/factory/HEARTBEAT_PROTOCOL.md"
    - "kodex-minus-infinity:ops/factory/FACTORY_LOOP_PROTOCOL.md"
    - "kodex-minus-infinity:scripts/factory_andon.py"
  may_edit:
    - "only the bounded local Hermes observer/source adapter required after inspection"
    - "local compact observer snapshot/state"
    - "local cron/job configuration required to poll and write canonical events into the existing KOD-36 inbox"
  must_not_edit:
    - "KODEX canon"
    - "production site"
