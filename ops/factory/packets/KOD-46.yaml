    github_evidence: "current packet PR/head SHA/commit/CI state"
    linear_evidence: "optional issue state/blocker/human-action metadata only when locally available"
  outputs:
    - "bounded repo-native Factory Observer"
    - "persisted compact prior-state snapshot"
    - "canonical factory_event JSON written to the existing Hermes inbox"
    - "fixture and restart/no-change suppression evidence"
  acceptance:
    - "ASSIGNED_UNKNOWN -> evidence-backed RUNNING produces exactly one event"
    - "new REVIEW-ready PR state produces exactly one REVIEW event with evidence URL"
    - "CI transition to failure produces exactly one FAILURE event and unchanged failure does not repeat"
    - "BLOCKED/human-action transition produces exactly one actionable event"
    - "RELEASE_GATE preserves explicit deploy-not-authorized semantics downstream"
    - "no state change produces no event"
    - "observer restart with persisted snapshot produces no replay storm"
    - "no secrets/private paths/raw conversations/arbitrary payloads enter event or handoff"
  tests:
    - "seven acceptance fixtures listed in Linear KOD-46"
    - "one downstream event through the existing KOD-36 inbox/transport after fixture pass"
  evidence_required:
    - "observer module/config changed without secret values"
    - "sources actually observed"
    - "fixture results"
    - "no-change suppression evidence"
    - "restart/no-replay evidence"
    - "one downstream Telegram evidence item"
    - "private-data check"
  stop_conditions:
    - "implementation requires exposing Hermes publicly to the internet"
    - "implementation requires committing secrets/tokens"
    - "source polling requires broad refactor of stable KOD-36 transport"
    - "Hermes memory pressure materially prevents bounded observer execution"
  notes:
    - "Prefer deterministic polling/state-diff over webhooks in v1. Evaluate push/webhooks only if measured polling latency becomes a real bottleneck."
