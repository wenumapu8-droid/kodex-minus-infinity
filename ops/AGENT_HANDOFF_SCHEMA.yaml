  next_actions: []
  next_owner: ""
  deploy_status: NOT_APPROVED

context_priority:
  - non_negotiable_rules
  - current_product_objective
  - approved_decisions
  - current_state_and_blockers
  - affected_files_and_interfaces
  - evidence_and_provenance
  - aesthetic_references
  - optional_explorations

rules:
  - An agent must not claim to have read a file it has not fetched.
  - An agent must not silently create new canon.
  - An agent must not invent tests, sources, files or successful results.
  - Canonical conflicts require explicit comparison and human review.
  - Deployment remains blocked without the exact phrase APROBAR DEPLOY.
