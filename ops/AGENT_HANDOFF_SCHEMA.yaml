status_promotion_order:
  - IMPLEMENTED
  - CI_PASS
  - BROWSER_VERIFIED
  - CURATOR_REVIEWED
  - CREATOR_ACCEPTED
  - RELEASE_CANDIDATE
  - MERGED
  - DEPLOYED
  - OBSERVED

context_priority:
  - explicit_current_creator_instruction
  - current_product_authority
  - public_runtime_and_valid_local_work
  - approved_canon_and_epistemic_rules
  - current_state_and_blockers
  - affected_files_and_interfaces
  - governed_reference_and_wireframe
  - evidence_and_provenance
  - historical_donors
  - optional_explorations

rules:
  - An agent must not claim to have read a file it has not fetched.
  - An agent must not silently create new canon.
  - An agent must not invent tests, sources, files, evidence or successful results.
  - Product-facing work must fail closed when Mini-local truth has not been reconciled.
  - Status promotion must be bound to exact evidence; CI PASS cannot imply browser, curator, creator, canon, merge or deployment status.
  - A stale authority snapshot invalidates the work packet until refreshed.
  - Active file/surface ownership collisions must serialize rather than race.
  - Canonical conflicts require explicit comparison and human review.
  - Creator deployment authorization does not bypass release reconciliation, exact-SHA QA or the authorized deployment environment.
